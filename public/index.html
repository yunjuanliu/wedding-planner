<style>
  :root {
    --bg: #F8F7FC;
    --surface: #FFFFFF;
    --ink: #1D1B29;
    --ink-soft: #6F6C81;
    --primary: #6E4CD9;
    --primary-hover: #5D3FC0;
    --primary-light: #EFEAFB;
    --border: #E7E4F1;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 0;
    -webkit-font-smoothing: antialiased;
  }
  /* 12-column grid with 80px side margins. Content occupies the middle 10
     columns, leaving one empty column of breathing room each side. */
  .wrap {
    max-width: none;
    margin: 0;
    padding: 0 80px 28px;
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    column-gap: 20px;
    align-content: start;
  }
  .wrap > * { grid-column: 2 / 12; min-width: 0; }
  @media (max-width: 1024px) {
    .wrap { padding: 0 40px 24px; column-gap: 16px; }
    /* below this the spare columns cost more than they give back */
    .wrap > * { grid-column: 1 / -1; }
  }
  @media (max-width: 768px)  { .wrap { padding: 0 24px 20px; column-gap: 12px; } }
  h1 {
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: 26px;
    margin: 0;
    letter-spacing: -0.4px;
  }
  /* The rule runs full-bleed, but the logo and title sit on the same grid
     as the content so they always line up with it. */
  .app-header {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    column-gap: 20px;
    padding: 20px 80px 18px;
    margin-bottom: 22px;
    border-bottom: 1px solid var(--border);
  }
  .app-header-inner { grid-column: 2 / 12; display: flex; align-items: center; gap: 14px; min-width: 0; }
  .backup-btn { margin-left: auto; flex: 0 0 auto; white-space: nowrap; }
  .backup-btn.saved { background: #E8F6EF; border-color: #C6E7D8; color: #1F7A54; }
  @media (max-width: 1024px) {
    .app-header { padding: 18px 40px 16px; column-gap: 16px; }
    .app-header-inner { grid-column: 1 / -1; }
  }
  @media (max-width: 768px)  { .app-header { padding: 16px 24px 14px; column-gap: 12px; } }
  .app-logo { width: 38px; height: 38px; flex: 0 0 auto; display: block; }
  @media (max-width: 480px) {
    .app-header { padding: 16px 12px 14px; margin-bottom: 18px; }
    .app-header-inner { gap: 10px; }
    .app-logo { width: 32px; height: 32px; }
    h1 { font-size: 21px; }
  }
  .tabs {
    display: flex;
    gap: 2px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
    /* Underline tabs stay on one line; scroll sideways when they overflow. */
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    white-space: nowrap;
    padding: 10px 14px;
    margin-bottom: -1px;
    border-bottom: 2px solid transparent;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink-soft);
    cursor: pointer;
    user-select: none;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab svg { flex: 0 0 auto; opacity: 0.85; }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
  .tab.active svg { opacity: 1; }
  @media (max-width: 480px) {
    .tab { padding: 10px 11px; gap: 6px; }
  }
  .panel { display: none; }
  .panel.active { display: block; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 14px;
    box-shadow: 0 1px 2px rgba(28, 27, 41, 0.03);
  }
  .stat-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat {
    flex: 1;
    min-width: 110px;
    background: var(--primary-light);
    border-radius: 12px;
    padding: 13px 15px;
  }
  .stat .num { font-size: 21px; font-weight: 700; color: var(--primary); letter-spacing: -0.3px; }
  .stat .lbl { font-size: 12px; color: var(--ink-soft); margin-top: 1px; }
  .progress-bar { height: 8px; border-radius: 5px; background: var(--primary-light); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--primary); border-radius: 5px; transition: width 0.3s; }
  .dash-duo { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .dash-duo { grid-template-columns: 1fr; } }
  .dash-hero-row { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; align-items: stretch; }
  @media (max-width: 640px) { .dash-hero-row { grid-template-columns: 1fr; } }
  .ring-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 6px 0 2px; }
  .ring { position: relative; width: 132px; height: 132px; flex: 0 0 auto; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
  .ring .ring-track { stroke: var(--primary-light); }
  .ring .ring-fill { stroke-linecap: round; transition: stroke-dashoffset 0.45s ease; }
  .ring-center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 1px;
  }
  .ring-center .ring-pct { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.05; }
  .ring-center .ring-sub { font-size: 11px; color: var(--ink-soft); }
  .ring-legend { text-align: center; }
  .ring-legend .ring-main { font-size: 15px; font-weight: 600; }
  .ring-legend .ring-note { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  input[type=text], input[type=number], input[type=date], select {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    /* Matches button's min-height so inputs and buttons line up exactly. */
    min-height: 36px;
    font-size: 14px;
    font-family: inherit;
    background: var(--white);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
  }
  input[type=text]:focus, input[type=number]:focus, input[type=date]:focus, select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
  }
  input[type=checkbox] { accent-color: var(--primary); width: 17px; height: 17px; }
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }
  ::placeholder { color: #A6A3B6; }
  button {
    border: 1px solid var(--border);
    background: var(--white);
    color: var(--ink);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    font-family: inherit;
    min-height: 36px;
  }
  button:hover { background: var(--primary-light); border-color: var(--primary); }
  button.primary { background: var(--primary); color: var(--white); border-color: var(--primary); }
  button.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .icon-btn { padding: 6px 10px; border-color: transparent; color: var(--ink-soft); min-height: 32px; }
  .icon-btn:hover { background: var(--primary-light); color: var(--primary); border-color: transparent; }
  @media (max-width: 480px) {
    body { padding: 0; }
    .wrap { padding: 0 12px 16px; }
    .stat-row { gap: 8px; }
    .stat { min-width: 100%; }
    .item-row { gap: 6px; }
  }
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(29, 27, 41, 0.35);
    align-items: center; justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--white);
    border-radius: 14px;
    padding: 22px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 8px 30px rgba(29, 27, 41, 0.18);
  }
  .modal-box h3 { margin: 0 0 14px; font-size: 16px; font-weight: 600; }
  .modal-box input[type=text] { width: 100%; margin-bottom: 16px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  #input-modal-title { font-size: 20px; margin-bottom: 20px; }
  #input-modal-field { font-size: 19px; min-height: 52px; padding: 12px 14px; }
  #input-modal .modal-actions button { font-size: 16px; padding: 11px 22px; }
  .field-label { display: block; margin: 14px 0 5px; font-size: 12px; color: var(--ink-soft); font-weight: 500; }
  textarea {
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
    font-size: 14px; font-family: inherit; background: var(--white); color: var(--ink);
    outline: none; width: 100%; resize: vertical; transition: border-color 0.15s;
  }
  textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
  .area-name-link { cursor: pointer; font-weight: 600; }
  .area-name-link:hover { color: var(--primary); text-decoration: underline; }
  .area-cover-banner {
    position: relative; width: 100%; height: 220px; overflow: hidden;
    background: var(--primary-light); cursor: pointer; flex: 0 0 auto;
  }
  .area-cover-banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .area-cover-banner-placeholder {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 8px; color: var(--primary); font-size: 13px; font-weight: 500;
  }
  .area-cover-banner:hover .area-cover-banner-placeholder { color: var(--primary-hover); }
  .area-cover-banner-remove {
    position: absolute; top: 12px; right: 12px; width: 28px; height: 28px;
    min-height: 28px; padding: 0; border-radius: 50%; background: rgba(29,27,41,0.55);
    border: none; color: var(--white); display: flex; align-items: center; justify-content: center;
  }
  .area-cover-banner-remove:hover { background: rgba(29,27,41,0.75); color: var(--white); }
  .icon-plus-btn {
    width: 32px; height: 32px; min-height: 32px; padding: 0; flex: 0 0 auto;
    border-radius: 8px; background: var(--primary); color: var(--white); border-color: var(--primary);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .icon-plus-btn:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .task-text { cursor: pointer; border-bottom: 1px dashed transparent; }
  .task-text:hover { border-bottom-color: var(--primary); color: var(--primary); }
  .switch {
    position: relative;
    display: inline-block;
    width: 42px;
    height: 24px;
    flex: 0 0 auto;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch-track {
    position: absolute; inset: 0;
    background: var(--border);
    border-radius: 24px;
    transition: background 0.15s;
    cursor: pointer;
  }
  .switch-track::before {
    content: '';
    position: absolute;
    height: 18px; width: 18px;
    left: 3px; bottom: 3px;
    background: var(--white);
    border-radius: 50%;
    transition: transform 0.15s;
    box-shadow: 0 1px 3px rgba(28,27,41,0.2);
  }
  .switch input:checked + .switch-track { background: var(--primary); }
  .switch input:checked + .switch-track::before { transform: translateX(18px); }
  .shop-item-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .shop-item-row:first-child { border-top: none; }
  .shop-item-name { cursor: pointer; border-bottom: 1px dashed transparent; flex: 2; min-width: 100px; }
  .shop-item-name:hover { border-bottom-color: var(--primary); color: var(--primary); }
  .link-btn {
    border: none;
    background: none;
    padding: 0;
    color: var(--primary);
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
    font-family: inherit;
  }
  .link-btn:hover { text-decoration: underline; }
  /* Household row and the person rows beneath it share one column track so
     names and dish pickers line up down the page. */
  .guest-row, .person-row {
    display: grid;
    grid-template-columns: minmax(130px, 2fr) 36px 110px 100px minmax(210px, 1.5fr) minmax(110px, 1fr) 32px;
    align-items: center;
    gap: 10px;
    text-align: left;
  }
  .guest-row { padding: 10px 0 8px; }
  .guest-block { border-top: 1px solid var(--border); }
  .guest-block:first-child { border-top: none; }
  .guest-row > *, .person-row > * { text-align: left; justify-self: start; }
  .guest-row select, .person-row select { width: 100%; }
  .guest-dishes { grid-column: 5; display: flex; gap: 6px; width: 100%; min-width: 0; }
  .guest-dishes select { flex: 1 1 0; min-width: 0; }
  .person-row { padding: 4px 0; }
  .person-row > [data-person-name] { grid-column: 1 / 5; width: 100%; }
  .person-row > .kid-toggle { grid-column: 6; }
  .person-row > [data-action=remove-person] { grid-column: 7; }
  .kid-toggle {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--ink-soft); cursor: pointer; user-select: none;
  }
  .kid-toggle input { margin: 0; cursor: pointer; }
  .kid-toggle:has(input:checked) { color: #C23568; font-weight: 600; }
  .person-add-row { padding: 2px 0 10px; }
  .person-add-row > .link-btn { grid-column: 1 / 5; font-size: 12.5px; }
  /* The add-note button is clutter on the many rows that have no note, but
     hiding it outright would leave no way to add one. */
  .dietary-add { opacity: 0; transition: opacity 0.12s; }
  .guest-block:hover .dietary-add, .dietary-add:focus { opacity: 1; }
  #g-list { overflow-x: auto; }
  #g-list .guest-row, #g-list .person-row { min-width: 760px; }
  .tl-card {
    position: relative;
    transition: box-shadow 0.15s, opacity 0.15s;
  }
  .tl-card.dragging { opacity: 0.4; }
  .tl-card.drag-over-top { border-top: 2px solid var(--primary); margin-top: -2px; }
  .tl-card.drag-over-bottom { border-bottom: 2px solid var(--primary); }
  .tl-handle {
    cursor: grab;
    color: var(--border);
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
    flex: 0 0 auto;
    font-size: 15px;
    line-height: 1;
    padding: 0 2px;
    user-select: none;
  }
  .tl-card:hover .tl-handle { opacity: 1; }
  .tl-handle:hover { color: var(--primary); }
  .tl-handle:active { cursor: grabbing; }
  .tl-fade { opacity: 0; transition: opacity 0.15s; }
  .tl-card:hover .tl-fade { opacity: 1; }
  @keyframes tlPulse {
    0%   { box-shadow: 0 0 0 3px var(--primary); }
    100% { box-shadow: 0 1px 2px rgba(28,27,41,0.03); }
  }
  .tl-card.jumped { animation: tlPulse 0.6s ease-out forwards; }
  .item-row.dragging { opacity: 0.4; }
  .item-row.drag-over-top { border-top: 2px solid var(--primary); margin-top: -2px; }
  .item-row.drag-over-bottom { border-bottom: 2px solid var(--primary); }
  .item-row.jumped { animation: tlPulse 0.6s ease-out forwards; border-radius: 8px; }
  .todo-handle {
    cursor: grab;
    color: var(--border);
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
    flex: 0 0 auto;
    font-size: 15px;
    line-height: 1;
    padding: 0 2px;
    user-select: none;
  }
  .item-row:hover .todo-handle { opacity: 1; }
  .todo-handle:hover { color: var(--primary); }
  .todo-handle:active { cursor: grabbing; }
  .todo-zone { min-height: 6px; }
  .hero-banner {
    background: linear-gradient(135deg, var(--primary) 0%, #8B6FE8 100%);
    border-radius: 16px;
    padding: 24px 26px;
    color: #fff;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .hero-banner::before {
    content: '';
    position: absolute;
    right: -40px; top: -40px;
    width: 160px; height: 160px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
  }
  .hero-banner::after {
    content: '';
    position: absolute;
    right: 30px; bottom: -50px;
    width: 110px; height: 110px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
  }
  .hero-days {
    font-size: 38px;
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1;
    position: relative;
    z-index: 1;
  }
  .hero-sub {
    font-size: 13px;
    opacity: 0.85;
    margin-top: 6px;
    position: relative;
    z-index: 1;
  }
  .icon-stat {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .icon-stat-badge {
    flex: 0 0 auto;
    width: 38px; height: 38px;
    border-radius: 10px;
    background: var(--white);
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 1px 3px rgba(28,27,41,0.06);
  }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .item-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .item-row:last-child { border-bottom: none; }
  .section-title {
    font-family: "Inter", sans-serif;
    font-weight: 600;
    font-size: 15px;
    margin: 0 0 8px;
    color: var(--ink);
  }
  .section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--primary);
    background: var(--primary-light);
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
  }
  .muted { color: var(--ink-soft); font-size: 13px; }
  .strike { color: var(--ink-soft); text-decoration: line-through; }
  /* align-items:center stops the button stretching to the row height while
     the input keeps its intrinsic height, which left them visibly unequal. */
  .add-form { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  /* .modal-box input[type=text] carries a 16px bottom margin for the simple
     input modal; inside an add-form row it just knocks the button out of line. */
  .add-form input[type=text] { margin-bottom: 0; }
  /* selects size from their own content box and come out 1px taller */
  .add-form select { height: 36px; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
  table.data-table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 13.5px; }
  table.data-table th {
    text-align: left; padding: 10px 10px; background: var(--primary-light); color: var(--primary);
    font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.3px;
    white-space: nowrap; position: sticky; top: 0;
  }
  table.data-table td { padding: 6px 8px; border-top: 1px solid var(--border); vertical-align: middle; }
  table.data-table tr:hover td { background: #FBFAFE; }
  table.data-table input[type=text], table.data-table input[type=number] {
    border: 1px solid transparent; background: transparent; width: 100%; padding: 6px 6px; border-radius: 6px;
  }
  table.data-table input[type=text]:hover, table.data-table input[type=number]:hover { border-color: var(--border); }
  table.data-table input[type=text]:focus, table.data-table input[type=number]:focus { background: var(--white); border-color: var(--primary); }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/docx@9.7.1/dist/index.iife.min.js"></script>
<script>
let inputModalCallback = null;
function openInputModal(title, initialValue, onSave, inputType) {
  document.getElementById("input-modal-title").textContent = title;
  const field = document.getElementById("input-modal-field");
  field.type = inputType || "text";
  field.value = initialValue !== undefined && initialValue !== null ? initialValue : "";
  inputModalCallback = onSave;
  document.getElementById("input-modal").classList.add("open");
  field.focus();
  field.select();
}
function closeInputModal() {
  inputModalCallback = null;
  document.getElementById("input-modal").classList.remove("open");
}
document.getElementById("input-modal-cancel").addEventListener("click", closeInputModal);
document.getElementById("input-modal").addEventListener("click", (e) => {
  if (e.target.id === "input-modal") closeInputModal();
});
document.getElementById("input-modal-save").addEventListener("click", async () => {
  const value = document.getElementById("input-modal-field").value;
  const cb = inputModalCallback;
  closeInputModal();
  if (cb) await cb(value);
});
document.getElementById("input-modal-field").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("input-modal-save").click();
});

let tagsModalMode = "helpers";
function openTagsModal(mode) {
  tagsModalMode = mode === "stores" ? "stores" : "helpers";
  document.getElementById("tags-modal-title").textContent =
    tagsModalMode === "stores" ? "Manage stores" : "Manage tags";
  renderTagsModalList();
  document.getElementById("tags-modal").classList.add("open");
}
function closeTagsModal() {
  document.getElementById("tags-modal").classList.remove("open");
}
function tagsModalItems() {
  return tagsModalMode === "stores" ? storeOptions : helperTags;
}
async function persistTagsModal() {
  if (tagsModalMode === "stores") {
    await saveKey("wedding-store-options", storeOptions);
    await saveKey("wedding-shop-list", shopList);
    renderShopList();
    renderDashboard();
  } else {
    await saveKey("wedding-helper-tags", helperTags);
    await saveKey("wedding-todo-items", todoData);
    renderTodo();
  }
}
function renameTagReferences(oldName, newName) {
  if (tagsModalMode === "stores") {
    shopList.forEach(r => { if (r.store === oldName) r.store = newName; });
  } else {
    todoData.forEach(s => s.items.forEach(i => { if (i.assignee === oldName) i.assignee = newName; }));
  }
}
function clearTagReferences(name) {
  if (tagsModalMode === "stores") {
    shopList.forEach(r => { if (r.store === name) r.store = ""; });
  } else {
    todoData.forEach(s => s.items.forEach(i => { if (i.assignee === name) i.assignee = ""; }));
  }
}
function renderTagsModalList() {
  const list = document.getElementById("tags-modal-list");
  const items = tagsModalItems();
  if (items.length === 0) {
    list.innerHTML = `<p class="muted">${tagsModalMode === "stores" ? "No stores yet." : "No tags yet."}</p>`;
    return;
  }
  list.innerHTML = items.map(t => `
    <div class="item-row">
      <input type="text" autocomplete="off" data-lpignore="true" data-1p-ignore data-form-type="other"
        data-rename-tag="${t.id}" value="${esc(t.name)}" style="flex:1; min-width:120px;" />
      <button class="icon-btn" data-remove-tag-modal="${t.id}" aria-label="Remove ${esc(t.name)}" title="Remove">${TRASH_ICON}</button>
    </div>`).join("");
  list.querySelectorAll("[data-rename-tag]").forEach(inp => {
    inp.addEventListener("change", async (e) => {
      const entry = tagsModalItems().find(t => t.id === e.currentTarget.dataset.renameTag);
      if (!entry) return;
      const next = e.currentTarget.value.trim();
      if (!next || next === entry.name) { e.currentTarget.value = entry.name; return; }
      renameTagReferences(entry.name, next);
      entry.name = next;
      renderTagsModalList();
      await persistTagsModal();
    });
  });
  list.querySelectorAll("[data-remove-tag-modal]").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      const id = e.currentTarget.dataset.removeTagModal;
      const entry = tagsModalItems().find(t => t.id === id);
      if (entry) clearTagReferences(entry.name);
      if (tagsModalMode === "stores") storeOptions = storeOptions.filter(t => t.id !== id);
      else helperTags = helperTags.filter(t => t.id !== id);
      renderTagsModalList();
      await persistTagsModal();
    });
  });
}
document.getElementById("tags-modal-add").addEventListener("click", () => {
  const label = tagsModalMode === "stores" ? "Store name" : "Helper name";
  openInputModal(label, "", (name) => {
    const trimmed = name.trim();
    if (!trimmed) return;
    if (tagsModalMode === "stores") storeOptions.push({id: uid(), name: trimmed});
    else helperTags.push({id: uid(), name: trimmed});
    renderTagsModalList();
    persistTagsModal();
  });
});
document.getElementById("tags-modal-close").addEventListener("click", closeTagsModal);
document.getElementById("tags-modal").addEventListener("click", (e) => {
  if (e.target.id === "tags-modal") closeTagsModal();
});

let editingTask = null;
let pendingImageData = null;

function fillAssigneeSelect(selectEl, currentValue) {
  const options = ["<option value=\"\">Unassigned</option>"]
    .concat(helperTags.map(t => `<option value="${t.name}">${t.name}</option>`))
    .join("");
  selectEl.innerHTML = options;
  selectEl.value = currentValue || "";
}
let storeOptions = [];
function storeSelectOptionsHtml(currentValue) {
  return ["<option value=\"\">No store</option>"]
    .concat(storeOptions.map(s => `<option value="${esc(s.name)}" ${s.name === currentValue ? "selected" : ""}>${esc(s.name)}</option>`))
    .concat(["<option value=\"__add_new__\">+ Add new…</option>", "<option value=\"__manage__\">✎ Manage stores…</option>"])
    .join("");
}
// Handles the "+ Add new…" / "Manage stores…" entries on any store <select>.
// Returns true when the change was one of those actions (caller should stop).
function handleStoreSelectAction(selectEl, previousValue, onPicked) {
  if (selectEl.value === "__add_new__") {
    selectEl.value = previousValue || "";
    openInputModal("Store name", "", (name) => {
      const trimmed = name.trim();
      if (!trimmed) return;
      storeOptions.push({id: uid(), name: trimmed});
      saveKey("wedding-store-options", storeOptions);
      if (onPicked) onPicked(trimmed);
    });
    return true;
  }
  if (selectEl.value === "__manage__") {
    selectEl.value = previousValue || "";
    openTagsModal("stores");
    return true;
  }
  return false;
}
function fillStoreSelect(selectEl, currentValue) {
  selectEl.innerHTML = storeSelectOptionsHtml(currentValue);
  selectEl.value = currentValue || "";
}
document.getElementById("task-modal-shop-toggle").addEventListener("change", (e) => {
  document.getElementById("task-modal-shop-fields").style.display = e.target.checked ? "block" : "none";
});

function showTaskPreview(item) {
  document.getElementById("task-edit-mode").style.display = "none";
  document.getElementById("task-view-mode").style.display = "block";
  document.getElementById("tv-title").textContent = item.text;
  document.getElementById("tv-body").textContent = item.body || "No notes added.";
  document.getElementById("tv-due").textContent = item.dueDate || "Not set";
  document.getElementById("tv-assignee").textContent = item.assignee || "Unassigned";
  const imgWrap = document.getElementById("tv-image-wrap");
  if (item.image) {
    imgWrap.style.display = "block";
    document.getElementById("tv-image").src = item.image;
  } else {
    imgWrap.style.display = "none";
  }
}

function showTaskEditForm(item) {
  document.getElementById("task-view-mode").style.display = "none";
  document.getElementById("task-edit-mode").style.display = "block";
  document.getElementById("task-modal-title").value = item.text || "";
  document.getElementById("task-modal-body").value = item.body || "";
  document.getElementById("task-modal-due").value = item.dueDate || "";
  fillAssigneeSelect(document.getElementById("task-modal-assignee"), item.assignee);
  pendingImageData = item.image || null;
  document.getElementById("task-modal-image").value = "";
  const previewWrap = document.getElementById("task-modal-image-preview-wrap");
  if (pendingImageData) {
    previewWrap.style.display = "block";
    document.getElementById("task-modal-image-preview").src = pendingImageData;
  } else {
    previewWrap.style.display = "none";
  }

  const linkedIds = getShopItemIds(item);
  const shopToggle = document.getElementById("task-modal-shop-toggle");
  const shopFields = document.getElementById("task-modal-shop-fields");
  shopToggle.checked = linkedIds.length > 0;
  shopFields.style.display = linkedIds.length > 0 ? "block" : "none";
  shopAddOpen = false;
  renderShopItemsTable();
  renderShopAddRow();
}

function getShopItemIds(item) {
  if (item.shopItemIds) return item.shopItemIds;
  if (item.shopItemId) return [item.shopItemId];
  return [];
}

let shopItemEditingId = null;
function renderShopItemsTable() {
  const item = getEditingItem();
  const wrap = document.getElementById("task-modal-shop-items");
  if (!item || !wrap) return;
  const ids = getShopItemIds(item);
  const rows = ids.map(id => shopList.find(r => r.id === id)).filter(Boolean);
  if (rows.length === 0) {

// One-click backup. Captures the server copy AND this browser's local copy
// separately: when the two disagree - which is exactly how data was lost
// before - keeping both means nothing is thrown away.
async function downloadBackup() {
  const backup = {
    app: "wedding-planner",
    exportedAt: new Date().toISOString(),
    remoteReachable: false,
    remote: {},
    local: {}
  };

  try {
    const r = await sbFetch(SUPABASE_URL + "/rest/v1/wedding_store?select=key,value", { headers: SB_HEADERS });
    if (r.ok) {
      // Skip the dated snapshots: they are copies of these same rows, and with
      // cover images embedded they would dwarf the file being downloaded.
      (await r.json()).forEach(row => {
        if (row.key.indexOf("snapshot::") === 0) return;
        backup.remote[row.key] = row.value;
      });
      backup.remoteReachable = true;
    }
  } catch (e) {
    // offline or project down - the local copy below is then the only record
  }

  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || k.indexOf("wedding-") !== 0) continue;
      try { backup.local[k] = JSON.parse(localStorage.getItem(k)); }
      catch (e) { backup.local[k] = localStorage.getItem(k); }
    }
  } catch (e) {}

  backup.summary = {
    remoteKeys: Object.keys(backup.remote).length,
    localKeys: Object.keys(backup.local).length,
    guests: (backup.remote["wedding-guests"] || backup.local["wedding-guests"] || []).length,
    vendors: ((backup.remote["wedding-budget"] || backup.local["wedding-budget"] || {}).vendors || []).length,
    timeline: (backup.remote["wedding-timeline"] || backup.local["wedding-timeline"] || []).length
  };

  const stamp = new Date().toISOString().slice(0, 10);
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `wedding-planner-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  return backup;
}

});

  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json"
};

// If the Supabase project is unreachable, requests must fail fast: the app
// used to sit on a blank screen until the browser gave up on each one.
// 3s was tight enough that a phone on a slow connection looked like an empty
// account, which is how a real to-do list once got replaced by defaults.
const SB_TIMEOUT_MS = 10000;
let remoteAvailable = true;
async function sbFetch(url, options) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), SB_TIMEOUT_MS);
  try {
    return await fetch(url, Object.assign({}, options, {signal: ctrl.signal}));
  } finally {
    clearTimeout(timer);
  }
}

// Edits made while the backend is unreachable live only in localStorage.
// Stamping them lets a later reconnect tell "edited offline just now" apart
// from "stale copy from weeks ago", instead of silently picking one.
const LS_TS = "::savedAt";
let storeCache = null;
// A failed fetch leaves storeCache empty, which is indistinguishable from a
// genuinely empty account. Seeding defaults on that guess once overwrote a
// real to-do list, so callers must check this before treating "no rows" as
// "new user" - see storeIsTrustworthy().
let storeLoadedOk = false;
async function loadStore() {
  if (storeCache) return storeCache;
  storeCache = {};
  try {
    const r = await sbFetch(SUPABASE_URL + "/rest/v1/wedding_store?select=key,value,updated_at", { headers: SB_HEADERS });
    if (r.ok) {
      (await r.json()).forEach(row => {
        storeCache[row.key] = { value: row.value, ts: Date.parse(row.updated_at) || 0 };
      });
      storeLoadedOk = true;
    } else remoteAvailable = false;
  } catch (e) {
    // One failure is enough: stop paying the timeout on every later save.
    remoteAvailable = false;
  }
  return storeCache;
}

// Only true once we have actually heard back from the server. Seeding defaults
// while this is false would write made-up data over whatever is really stored.
async function storeIsTrustworthy() {
  await loadStore();
  return storeLoadedOk;
}

function readLocal(key) {
  try {
    const raw = localStorage.getItem(key);
    if (raw === null) return null;

// Keys whose latest value made it into localStorage but not onto the server.
const unsavedKeys = new Set();
function updateSaveStatus() {
  let el = document.getElementById("save-status");
  if (unsavedKeys.size === 0) { if (el) el.remove(); return; }
  if (!el) {
    el = document.createElement("div");
    el.id = "save-status";
    el.style.cssText = "position:fixed; left:50%; bottom:18px; transform:translateX(-50%);" +
      "background:#FDECEF; color:#8A1C36; border:1px solid #F5C2CE; border-radius:10px;" +
      "padding:9px 16px; font-size:13px; font-weight:500; z-index:400;" +
      "box-shadow:0 4px 14px rgba(29,27,41,0.14);";
    document.body.appendChild(el);
  }
  el.textContent = "Not saved to the server yet (" + unsavedKeys.size +
    ") — keep this tab open; retrying…";

// A save used to be fire-and-forget, and only network exceptions were caught -
// so an error status counted as success and the app looked saved when it wasn't.
// Check the response, retry, and say so on screen when it still fails.
async function pushToServer(key, value, ts, attempt) {
  attempt = attempt || 0;
  try {
    // updated_at is DEFAULT now() with no update trigger, so an upsert leaves it
    // at the original insert time. Send it explicitly - otherwise every remote
    // row looks permanently older than local and stale copies overwrite good data.
    const r = await sbFetch(SUPABASE_URL + "/rest/v1/wedding_store", {
      method: "POST",
      headers: Object.assign({}, SB_HEADERS, {"Prefer": "resolution=merge-duplicates"}),
      body: JSON.stringify({ key: key, value: value, updated_at: new Date(ts).toISOString() })
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    remoteAvailable = true;
    unsavedKeys.delete(key);
    updateSaveStatus();
    return true;
  } catch (e) {
    if (attempt < 3) {
      await new Promise(res => setTimeout(res, 800 * Math.pow(2, attempt)));
      return pushToServer(key, value, ts, attempt + 1);
    }
    // One failure no longer condemns the whole session: later saves still try.
    unsavedKeys.add(key);
    updateSaveStatus();
    return false;
  }
}

async function saveKey(key, value) {
  const store = await loadStore();
  const now = Date.now();
  store[key] = { value: value, ts: now };
  try {
    localStorage.setItem(key, JSON.stringify(value));
    localStorage.setItem(key + LS_TS, String(now));
  } catch (e) {}
  // Deliberately not awaited: the local write above already made the edit safe
  // on this device, and blocking every edit on a round trip made the UI stall.
  pushToServer(key, value, now);
}

// Dated copies of everything, kept server-side. Recovering a bad overwrite used
// to depend on someone having manually downloaded a backup that day.
const SNAPSHOT_PREFIX = "snapshot::";
const SNAPSHOT_SLOTS = 10;
function snapshotSlotKey(i) { return SNAPSHOT_PREFIX + "slot-" + i; }

// A fixed ring of slots, recycled oldest-first. Dated keys would have needed
// DELETE to prune, and DELETE answers 204 here while row-level security quietly
// keeps the row - so the table would have grown without bound.
async function writeDailySnapshotIfNeeded() {
  // Snapshotting a copy we could not verify would just preserve the wrong data.
  if (!storeLoadedOk) return false;
  const store = await loadStore();
  const today = new Date().toISOString().slice(0, 10);

  const takenAts = [];
  for (let i = 0; i < SNAPSHOT_SLOTS; i++) {
    const row = store[snapshotSlotKey(i)];
    takenAts.push((row && row.value && row.value.takenAt) || null);
  }
  if (takenAts.some(t => t && t.slice(0, 10) === today)) return false;

  let target = takenAts.indexOf(null);
  if (target === -1) {
    target = 0;
    for (let i = 1; i < SNAPSHOT_SLOTS; i++) {
      if (takenAts[i] < takenAts[target]) target = i;
    }
  }

  const data = {};
  Object.keys(store).forEach(k => {
    if (k.indexOf(SNAPSHOT_PREFIX) === 0) return;
    data[k] = store[k].value;
  });
  if (Object.keys(data).length === 0) return false;

  const key = snapshotSlotKey(target);
  const body = { takenAt: new Date().toISOString(), data: data };
  try {
    // Deliberately not pushToServer: a snapshot is housekeeping, so a failure
    // must not raise the "your edits are unsaved" warning.
    const r = await sbFetch(SUPABASE_URL + "/rest/v1/wedding_store", {
      method: "POST",
      headers: Object.assign({}, SB_HEADERS, {"Prefer": "resolution=merge-duplicates"}),
      body: JSON.stringify({ key: key, value: body, updated_at: new Date().toISOString() })
    });
    if (!r.ok) return false;
    store[key] = { value: body, ts: Date.now() };
  } catch (e) { return false; }
  return true;
}

async function loadKey(key) {
  const store = await loadStore();
  const remote = store[key];
  const local = readLocal(key);
  if (remote && local) return local.ts > remote.ts ? local.value : remote.value;
  if (remote) return remote.value;
  return local ? local.value : null;
}

// Anything saved locally that the backend does not have (or that is newer
// than what it has) gets pushed up once the connection comes back.
async function syncLocalToRemote() {
  if (!remoteAvailable) return [];
  const store = await loadStore();
  const pushed = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!key || key.indexOf("wedding-") !== 0 || key.indexOf(LS_TS) !== -1) continue;
    const local = readLocal(key);
    if (!local) continue;
    const remote = store[key];
    if (!remote || local.ts > remote.ts) pushed.push(key);
  }
  for (const key of pushed) {
    const local = readLocal(key);
    if (local) await saveKey(key, local.value);
  }
  return pushed;
}

const WEDDING_DATE = new Date(2026, 8, 19); // September 19, 2026
const SECTION_DAY_RANGES = {
  s1: {startDaysBefore: 70, endDaysBefore: 56},  // 10-8 weeks out
  s2: {startDaysBefore: 42, endDaysBefore: 28},  // 6-4 weeks out
  s3: {startDaysBefore: 21, endDaysBefore: 14},  // 3-2 weeks out
  s4: {startDaysBefore: 7, endDaysBefore: 1},    // week of
  s5: {startDaysBefore: 1, endDaysBefore: 1},    // day before
  s6: {startDaysBefore: 0, endDaysBefore: 0},    // day of
};
function fmtDate(d) {
  return d.toLocaleDateString(undefined, {month:"short", day:"numeric"});
}
function sectionDateLabel(sectionId) {
  const range = SECTION_DAY_RANGES[sectionId];
  if (!range) return "";
  const start = new Date(WEDDING_DATE);
  start.setDate(start.getDate() - range.startDaysBefore);
  const end = new Date(WEDDING_DATE);
  end.setDate(end.getDate() - range.endDaysBefore);
  if (range.startDaysBefore === range.endDaysBefore) return fmtDate(start);
  return fmtDate(start) + " – " + fmtDate(end);
}
function sectionDateStatus(sectionId) {
  const range = SECTION_DAY_RANGES[sectionId];
  if (!range) return "none";
  const today = new Date(); today.setHours(0,0,0,0);
  const start = new Date(WEDDING_DATE);
  start.setDate(start.getDate() - range.startDaysBefore);
  start.setHours(0,0,0,0);
  const end = new Date(WEDDING_DATE);
  end.setDate(end.getDate() - range.endDaysBefore);
  end.setHours(23,59,59,999);
  if (today >= start && today <= end) return "current";
  if (today > end) return "past";
  return "upcoming";
}
// Finds which todo section's date range a given due date falls into, so a
// task can be auto-filed under the right "weeks out" bucket.
function sectionIdForDate(dateStr) {
  if (!dateStr) return null;
  const due = new Date(dateStr + "T00:00:00");
  if (isNaN(due)) return null;
  due.setHours(0, 0, 0, 0);
  for (const id of Object.keys(SECTION_DAY_RANGES)) {
    const range = SECTION_DAY_RANGES[id];
    const start = new Date(WEDDING_DATE);
    start.setDate(start.getDate() - range.startDaysBefore);
    start.setHours(0, 0, 0, 0);
    const end = new Date(WEDDING_DATE);
    end.setDate(end.getDate() - range.endDaysBefore);
    end.setHours(23, 59, 59, 999);
    if (due >= start && due <= end) return id;
  }
  return null;
}
// Moves a task into the section matching its due date, if that's not
// already where it lives. Returns the section id the task ends up in.
function moveTaskToDueSection(fromSectionId, itemId) {
  const fromSection = todoData.find(s => s.id === fromSectionId);
  if (!fromSection) return fromSectionId;
  const idx = fromSection.items.findIndex(i => i.id === itemId);
  if (idx === -1) return fromSectionId;
  const item = fromSection.items[idx];
  const targetId = sectionIdForDate(item.dueDate);
  if (!targetId || targetId === fromSectionId) return fromSectionId;
  const toSection = todoData.find(s => s.id === targetId);
  if (!toSection) return fromSectionId;
  fromSection.items.splice(idx, 1);
  toSection.items.push(item);
  return targetId;
}

// Compares a task's due date with today so each row can show whether it is
// overdue, due today, or still on time.
function dueInfo(dueDate) {
  if (!dueDate) return null;
  const due = new Date(dueDate + "T00:00:00");
  if (isNaN(due)) return null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  due.setHours(0, 0, 0, 0);
  const days = Math.round((due - today) / 86400000);
  if (days < 0) {
    const n = Math.abs(days);
    return {kind: "overdue", label: `Overdue by ${n} day${n === 1 ? "" : "s"}`,
            color: "#B3253C", bg: "#FCE9ED", border: "#F3C4CE"};
  }
  if (days === 0) {
    return {kind: "today", label: "Due today", color: "#9A5B00", bg: "#FFF3DF", border: "#F3DCB4"};
  }
  return {kind: "ontime", label: days === 1 ? "On time · 1 day left" : `On time · ${days} days left`,
          color: "#1F7A54", bg: "#E8F6EF", border: "#C6E7D8"};
}
function dueBadgeHtml(dueDate) {
  const info = dueInfo(dueDate);
  if (!info) return '<span class="muted" style="font-size:11.5px;">No deadline</span>';
  // On-time tasks need no badge - the date field already says when they are due.
  if (info.kind === "ontime") return "";
  return `<span title="Due ${dueDate}" style="display:inline-block; white-space:nowrap; font-size:11.5px; font-weight:600;
    color:${info.color}; background:${info.bg}; border:1px solid ${info.border}; border-radius:10px; padding:2px 8px;">${info.label}</span>`;
}

  return `<div class="item-row" ${dragAttrs} style="${rowTint}">

function bindTodoDrag(p) {
  p.querySelectorAll(".item-row[draggable=true]").forEach(row => {
    row.addEventListener("dragstart", (e) => {
      if (["INPUT","SELECT","TEXTAREA","BUTTON"].includes(e.target.tagName)) {
        e.preventDefault();
        return;
      }
      todoDragId = row.dataset.todoId;
      todoDragSection = row.dataset.todoSection;
      row.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", "");
    });
    row.addEventListener("dragend", () => {
      row.classList.remove("dragging");
      p.querySelectorAll(".item-row").forEach(r => r.classList.remove("drag-over-top","drag-over-bottom"));
      todoDragId = null;
      todoDragSection = null;
    });
    row.addEventListener("dragover", (e) => {
      if (!todoDragId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      const rect = row.getBoundingClientRect();
      const mid = rect.top + rect.height / 2;
      row.classList.remove("drag-over-top","drag-over-bottom");
      row.classList.add(e.clientY < mid ? "drag-over-top" : "drag-over-bottom");
    });
    row.addEventListener("dragleave", () => {
      row.classList.remove("drag-over-top","drag-over-bottom");
    });
    row.addEventListener("drop", (e) => {
      if (!todoDragId) return;
      e.preventDefault();
      e.stopPropagation();
      row.classList.remove("drag-over-top","drag-over-bottom");
      if (todoDragId === row.dataset.todoId) return;
      const rect = row.getBoundingClientRect();
      const after = e.clientY >= rect.top + rect.height / 2;
      performTodoMove(todoDragId, todoDragSection, row.dataset.todoSection, row.dataset.todoId, after);
    });
  });
  p.querySelectorAll(".todo-zone").forEach(zone => {
    zone.addEventListener("dragover", (e) => { if (todoDragId) e.preventDefault(); });
    zone.addEventListener("drop", (e) => {
      if (!todoDragId) return;
      if (e.target.closest(".item-row[draggable=true]")) return;
      e.preventDefault();
      performTodoMove(todoDragId, todoDragSection, zone.dataset.todoZone, null, true);
    });
  });
}

function performTodoMove(itemId, fromSectionId, toSectionId, targetItemId, after) {
  const fromSection = todoData.find(s => s.id === fromSectionId);
  if (!fromSection) return;
  const idx = fromSection.items.findIndex(i => i.id === itemId);
  if (idx === -1) return;
  const [moved] = fromSection.items.splice(idx, 1);
  const toSection = todoData.find(s => s.id === toSectionId) || fromSection;
  if (targetItemId) {
    let targetIdx = toSection.items.findIndex(i => i.id === targetItemId);
    if (targetIdx === -1) targetIdx = toSection.items.length;
    const insertAt = Math.max(0, Math.min(after ? targetIdx + 1 : targetIdx, toSection.items.length));
    toSection.items.splice(insertAt, 0, moved);
  } else {
    toSection.items.push(moved);
  }
  todoJumpId = moved.id;
  renderTodo();
  saveKey("wedding-todo-items", todoData);
}

// PLACEHOLDER MENU - replace this list with the real dishes. Nothing else
// needs to change: a saved pick that is no longer on the list is still shown
// (see dishOptionsHtml), so swapping these out cannot silently drop a choice.
const MENU_DISHES = [
  "Dish 1 (placeholder)",
  "Dish 2 (placeholder)",
  "Dish 3 (placeholder)",
  "Dish 4 (placeholder)",
];
const DISHES_PER_GUEST = 2;

function dishOptionsHtml(current) {
  const opts = MENU_DISHES.slice();
  // Keep a choice that is not on the current menu rather than resetting it.
  if (current && opts.indexOf(current) === -1) opts.push(current);
  return ['<option value="">—</option>'].concat(
    opts.map(d => `<option value="${esc(d)}" ${d === current ? "selected" : ""}>${esc(d)}</option>`)
  ).join("");
}

// plusOne was free text with several shapes: "A, B, C", "A (+ B, C)", "A and B".
function parsePlusOneNames(raw) {
  if (!raw) return [];
  const extras = [];
  const stripped = String(raw).replace(/\(([^)]*)\)/g, (m, inner) => {
    extras.push(inner.replace(/^\s*\+\s*/, ""));
    return "";
  });
  const out = [];
  (stripped + "," + extras.join(",")).split(/[,;]+/).forEach(part => {
    part.split(/\s+and\s+/i).forEach(n => {
      const t = n.trim();
      if (t) out.push(t);
    });
  });
  return out;
}

function blankDishes() { return new Array(DISHES_PER_GUEST).fill(""); }

// Builds the per-person rows once, from the old free-text field. The original
// plusOne string is deliberately left in place: if a name parsed wrongly, the
// text it came from is still on record.
function ensureGuestPeople(g) {
  if (!Array.isArray(g.dishes)) g.dishes = blankDishes();
  while (g.dishes.length < DISHES_PER_GUEST) g.dishes.push("");
  let touched = false;
  if (!Array.isArray(g.people)) {
    g.people = parsePlusOneNames(g.plusOne).map(name => ({id: uid(), name, dishes: blankDishes()}));
    touched = true;
  }
  g.people.forEach(pr => {
    if (!Array.isArray(pr.dishes)) pr.dishes = blankDishes();
    while (pr.dishes.length < DISHES_PER_GUEST) pr.dishes.push("");
    // Only fill in a missing flag, never overwrite one - otherwise unticking a
    // seeded name would silently tick itself again on the next render.
    if (pr.isKid === undefined) {
      pr.isKid = KNOWN_KID_NAMES.indexOf(pr.name) !== -1;
      touched = true;
    }
  });
  return touched;
}

// The children identified so far. Used only to pre-tick the Kid boxes the
// first time; after that the ticks in the data are the source of truth.
const KNOWN_KID_NAMES = ["Ethan Gu", "Lingxuan Gu", "Sydney Yang", "Jasper Yi"];

function adultRows() {
  const rows = [];
  guests.forEach(g => {
    const push = (full, isKid) => {
      const name = (full || "").trim();
      if (!name || isKid) return;
      rows.push({first: name.split(/\s+/)[0], full: name, household: g.name || ""});
    };
    push(g.name, false);
    (g.people || []).forEach(pr => push(pr.name, pr.isKid));
  });
  return rows;
}

function exportAdultNames() {
  const rows = adultRows();
  const csv = ["First name,Full name,Household"].concat(
    rows.map(r => [r.first, r.full, r.household]
      .map(v => '"' + String(v).replace(/"/g, '""') + '"').join(","))
  ).join("\n");
  const blob = new Blob(["﻿" + csv], {type: "text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `adult-guest-names-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  return rows.length;
}

function handleAssigneeAction(selectEl, previousValue, onPicked) {
  if (selectEl.value === "__add_new__") {
    selectEl.value = previousValue || "";
    openInputModal("Helper name", "", (name) => {
      const trimmed = name.trim();
      if (!trimmed) return;
      helperTags.push({id: uid(), name: trimmed});
      saveKey("wedding-helper-tags", helperTags);
      if (onPicked) onPicked(trimmed);

    return true;

  if (selectEl.value === "__manage__") {
    selectEl.value = previousValue || "";
    openTagsModal("helpers");
    return true;
  }
  return false;
}

function readAndResizeImage(file, maxDim) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.naturalWidth, h = img.naturalHeight;
        if (w > maxDim || h > maxDim) {
          if (w >= h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve({dataUrl: canvas.toDataURL("image/jpeg", 0.85), width: w, height: h});
      };
      img.onerror = () => reject(new Error("Couldn't read that image."));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error("Couldn't read that file."));
    reader.readAsDataURL(file);
  });
}

function dataUrlToUint8Array(dataUrl) {
  const base64 = dataUrl.split(",")[1] || "";
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}
function buildGuidelineLines(section, area) {
  const materials = area.materials || [];
  const lines = [];
  lines.push(`Set up "${area.name}" within the ${section.label} portion of the day. ${area.assignee ? `${area.assignee} owns this area end to end.` : "Assign an owner for this area before the day of."}`);
  if (area.tableType) {
    lines.push(`Table: ${area.tableQty ? area.tableQty + "x " : ""}${area.tableType}.`);
  }
  if (materials.length) {
    const list = materials.map(m => [m.item, materialQuality(m)].filter(Boolean).join(" — ")).join("; ");
    lines.push(`Gather all checklist materials ahead of time: ${list}.`);
  } else {
    lines.push("Add materials to the checklist above so nothing gets missed on setup.");
  }
  if (area.notes && area.notes.trim()) {
    lines.push(`Design the experience around this: ${area.notes.trim()}`);
  }
  const openTodos = (area.todos || []).filter(t => !t.done);
  if (openTodos.length) {
    lines.push(`Close out these tasks before the event: ${openTodos.map(t => t.text).join("; ")}.`);
  }
  lines.push("Walk the space once fully set up, checklist in hand, before guests arrive.");
  return lines;
}
async function exportAreaDocx(section, area) {
  const {Document, Packer, Paragraph, HeadingLevel, ImageRun, Table, TableRow, TableCell, TextRun, WidthType, AlignmentType} = docx;
  const children = [];
  children.push(new Paragraph({text: area.name, heading: HeadingLevel.TITLE}));
  const subtitleParts = [section.label];
  if (area.assignee) subtitleParts.push(`Assignee: ${area.assignee}`);
  children.push(new Paragraph({text: subtitleParts.join(" · "), spacing: {after: 200}}));

  if (area.coverImage) {
    const bytes = dataUrlToUint8Array(area.coverImage);
    const w = area.coverImageW || 600, h = area.coverImageH || 400;
    const docWidth = 420;
    const docHeight = Math.round(docWidth * (h / w));
    children.push(new Paragraph({
      children: [new ImageRun({type: "jpg", data: bytes, transformation: {width: docWidth, height: docHeight}})],
      alignment: AlignmentType.CENTER,
      spacing: {after: 240}
    }));
  }

  children.push(new Paragraph({text: "User Experience", heading: HeadingLevel.HEADING_1}));
  children.push(new Paragraph({text: (area.notes && area.notes.trim()) || "No notes added yet.", spacing: {after: 200}}));

  children.push(new Paragraph({text: "Material Checklist", heading: HeadingLevel.HEADING_1}));
  const materials = area.materials || [];
  if (materials.length) {
    const headerRow = new TableRow({
      tableHeader: true,
      children: ["Item Name", "Quality", "Status"].map(h => new TableCell({
        width: {size: 33, type: WidthType.PERCENTAGE},
        children: [new Paragraph({children: [new TextRun({text: h, bold: true})]})]
      }))
    });
    const rows = materials.map(m => new TableRow({
      children: [m.item || "", materialQuality(m), m.done ? "Ready" : "Needed"].map(v => new TableCell({
        children: [new Paragraph(v)]
      }))
    }));
    children.push(new Table({width: {size: 100, type: WidthType.PERCENTAGE}, rows: [headerRow, ...rows]}));
  } else {
    children.push(new Paragraph({text: "No materials added yet."}));
  }
  children.push(new Paragraph({text: "", spacing: {after: 200}}));

  children.push(new Paragraph({text: "Implementation Guideline", heading: HeadingLevel.HEADING_1}));
  buildGuidelineLines(section, area).forEach(line => {
    children.push(new Paragraph({text: line, bullet: {level: 0}, spacing: {after: 120}}));
  });

  const doc = new Document({sections: [{children}]});
  const blob = await Packer.toBlob(doc);
  const safeName = `${section.label} - ${area.name}`.replace(/[\\/:*?"<>|]/g, "-");
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${safeName}.docx`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

let timeline = [];
function buildTimeOptions() {
  const opts = [];
  for (let h = 0; h < 24; h++) {
    for (let m = 0; m < 60; m += 5) {
      const h12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
      const ap = h < 12 ? "am" : "pm";
      opts.push(`${h12}:${String(m).padStart(2,"0")} ${ap}`);
    }
  }
  return opts;
}
const TIME_OPTIONS = buildTimeOptions();
function timeToMinutes(t) {
  const m = (t || "").match(/(\d+):(\d+)\s*(am|pm)/i);
  if (!m) return 0;
  let [, h, min, ap] = m;
  h = parseInt(h); min = parseInt(min);
  if (ap.toLowerCase() === "am") { if (h === 12) h = 0; }
  else { if (h !== 12) h += 12; }
  return h * 60 + min;
}
function timeSelectOptions(sel) {
  return TIME_OPTIONS.map(t => `<option value="${t}" ${t===sel?"selected":""}>${t}</option>`).join("");
}

function bindTlZoneDrop(p) {
  p.querySelectorAll(".tl-zone").forEach(zone => {
    zone.addEventListener("dragover", (e) => { if (tlDragId) e.preventDefault(); });
    zone.addEventListener("drop", (e) => {
      if (!tlDragId) return;
      if (e.target.closest(".tl-card")) return;
      e.preventDefault();
      const t = timeline.find(x => x.id === tlDragId);
      if (!t) return;
      t.section = zone.dataset.sectionName || "";
      const order = [...timeline].sort((a,b) => (a.order||0) - (b.order||0));
      const idx = order.findIndex(x => x.id === tlDragId);
      if (idx !== -1) {
        const [moved] = order.splice(idx, 1);
        order.push(moved);
        order.forEach((item, i) => { item.order = i; });
      }
      tlJumpId = tlDragId;
      renderTimeline();
      saveKey("wedding-timeline", timeline);
    });
  });
}

function bindTlDrag(p) {
  p.querySelectorAll(".tl-card").forEach(card => {
    card.addEventListener("dragstart", (e) => {
      if (["INPUT","SELECT","TEXTAREA","BUTTON"].includes(e.target.tagName)) {
        e.preventDefault();
        return;
      }
      tlDragId = card.dataset.tlId;
      card.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", "");
    });
    card.addEventListener("dragend", () => {
      card.classList.remove("dragging");
      p.querySelectorAll(".tl-card").forEach(c => c.classList.remove("drag-over-top","drag-over-bottom"));
      tlDragId = null;
    });
    card.addEventListener("dragover", (e) => {
      if (!tlDragId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      const rect = card.getBoundingClientRect();
      const mid = rect.top + rect.height / 2;
      card.classList.remove("drag-over-top","drag-over-bottom");
      card.classList.add(e.clientY < mid ? "drag-over-top" : "drag-over-bottom");
    });
    card.addEventListener("dragleave", () => {
      card.classList.remove("drag-over-top","drag-over-bottom");
    });
    card.addEventListener("drop", (e) => {
      if (!tlDragId) return;
      e.preventDefault();
      e.stopPropagation();
      card.classList.remove("drag-over-top","drag-over-bottom");
      if (tlDragId === card.dataset.tlId) return;
      const rect = card.getBoundingClientRect();
      const after = e.clientY >= rect.top + rect.height / 2;
      performTlMove(tlDragId, card.dataset.tlId, after);
    });
  });
}

function performTlMove(draggedId, targetId, after) {
  const order = [...timeline].sort((a,b) => (a.order||0) - (b.order||0));
  const fromIdx = order.findIndex(t => t.id === draggedId);
  if (fromIdx === -1) return;
  const [moved] = order.splice(fromIdx, 1);
  let targetIdx = order.findIndex(t => t.id === targetId);
  if (targetIdx === -1) targetIdx = order.length;
  let insertAt = after ? targetIdx + 1 : targetIdx;
  insertAt = Math.max(0, Math.min(insertAt, order.length));
  const targetItem = order[after ? insertAt - 1 : insertAt] || order[order.length - 1];
  if (targetItem) moved.section = targetItem.section || "";
  order.splice(insertAt, 0, moved);
  order.forEach((item, i) => { item.order = i; });
  tlJumpId = moved.id;
  renderTimeline();
  saveKey("wedding-timeline", timeline);
}

        <td><input type="text" autocomplete="off" data-lpignore="true" data-1p-ignore data-form-type="other" data-vid="${v.id}" data-vfield="vendor" value="${esc(v.vendor)}" placeholder="—" /></td>
        <td><input type="text" autocomplete="off" data-lpignore="true" data-1p-ignore data-form-type="other" data-vid="${v.id}" data-vfield="contact" value="${esc(v.contact)}" placeholder="—" /></td>
        <td><input type="text" autocomplete="off" data-lpignore="true" data-1p-ignore data-form-type="other" data-vid="${v.id}" data-vfield="phone" value="${esc(v.phone)}" placeholder="—" /></td>
        <td><input type="text" autocomplete="off" data-lpignore="true" data-1p-ignore data-form-type="other" data-vid="${v.id}" data-vfield="owner" value="${esc(v.owner)}" style="width:80px;" /></td>
        <td><input type="text" autocomplete="off" data-lpignore="true" data-1p-ignore data-form-type="other" data-vid="${v.id}" data-vfield="contract" value="${esc(v.contract)}" style="width:70px; ${yes(v.contract) ? "color:#1F8A5B; font-weight:600;" : ""}" /></td>
        <td><input type="text" autocomplete="off" data-lpignore="true" data-1p-ignore data-form-type="other" data-vid="${v.id}" data-vfield="paid" value="${esc(v.paid)}" style="width:100px; ${yes(v.paid) ? "color:#1F8A5B; font-weight:600;" : ""}" /></td>
        <td><input type="number" autocomplete="off" data-lpignore="true" data-1p-ignore data-form-type="other" data-vid="${v.id}" data-vfield="amount" value="${v.amount == null ? "" : v.amount}" placeholder="—" style="text-align:right; width:90px;" /></td>
        <td><input type="text" autocomplete="off" data-lpignore="true" data-1p-ignore data-form-type="other" data-vid="${v.id}" data-vfield="next" value="${esc(v.next)}" placeholder="—" /></td>
        <td><button class="icon-btn" data-vremove="${v.id}" aria-label="Remove vendor" title="Remove">${TRASH_ICON}</button></td>
      </tr>`).join("");
  }

  const xbody = document.getElementById("x-body");
  if (!budget.expenses.length) {
    xbody.innerHTML = '<tr><td colspan="4" class="muted" style="padding:12px;">No other expenses yet. Add one above.</td></tr>';
  } else {
    xbody.innerHTML = budget.expenses.map(x => `
      <tr>
        <td><input type="text" autocomplete="off" data-lpignore="true" data-1p-ignore data-form-type="other" data-xid="${x.id}" data-xfield="category" value="${esc(x.category)}" placeholder="—" /></td>
        <td><input type="text" autocomplete="off" data-lpignore="true" data-1p-ignore data-form-type="other" data-xid="${x.id}" data-xfield="name" value="${esc(x.name)}" placeholder="Item name" /></td>
        <td><input type="number" autocomplete="off" data-lpignore="true" data-1p-ignore data-form-type="other" data-xid="${x.id}" data-xfield="amount" value="${x.amount == null ? "" : x.amount}" placeholder="—" style="text-align:right;" /></td>
        <td><button class="icon-btn" data-xremove="${x.id}" aria-label="Remove expense" title="Remove">${TRASH_ICON}</button></td>
      </tr>`).join("");
  }

  document.getElementById("x-add").addEventListener("click", async () => {
    budget.expenses.push({id: uid(), category: "", name: "", amount: null});
    await saveKey("wedding-budget", budget);
    renderBudget();

    if (rows.length) rows[rows.length - 1].focus();

      if (!row) return;
      const field = e.currentTarget.dataset.xfield;
      const raw = e.currentTarget.value;
      row[field] = field === "amount" ? (raw.trim() === "" ? null : Number(raw) || 0) : raw;
      await saveKey("wedding-budget", budget);
      renderBudget();
    });
  });
  xbody.querySelectorAll("[data-xremove]").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      budget.expenses = budget.expenses.filter(x => x.id !== e.currentTarget.dataset.xremove);
      await saveKey("wedding-budget", budget);
      renderBudget();
    });
  });

    budget.total = Number(e.target.value) || 0;
    await saveKey("wedding-budget", budget);
    renderBudget();

    vendorExpanded = !vendorExpanded;
    renderBudget();
  });
  document.getElementById("v-add").addEventListener("click", async () => {
    budget.vendors.push({id: uid(), category:"", vendor:"", contact:"", phone:"", owner:"", contract:"No", paid:"No", amount:null, next:""});
    vendorExpanded = true;
    await saveKey("wedding-budget", budget);
    renderBudget();
    const cells = document.querySelectorAll("#v-body [data-vfield='category']");
    if (cells.length) cells[cells.length - 1].focus();
  });
  body.querySelectorAll("[data-vfield]").forEach(el => {
    el.addEventListener("change", async (e) => {
      const row = budget.vendors.find(v => v.id === e.currentTarget.dataset.vid);
      if (!row) return;
      const field = e.currentTarget.dataset.vfield;
      const raw = e.currentTarget.value;
      row[field] = field === "amount" ? (raw.trim() === "" ? null : Number(raw) || 0) : raw;
      await saveKey("wedding-budget", budget);
      renderBudget();
    });
  });
  body.querySelectorAll("[data-vremove]").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      budget.vendors = budget.vendors.filter(v => v.id !== e.currentTarget.dataset.vremove);
      await saveKey("wedding-budget", budget);
      renderBudget();
    });
  });
}

let shopList = [];
let shopSearch = "";
let shopListEditingId = null;
let shopStoreFilter = "";
const STORE_DEFAULTS = ["Costco","Woodmen","Global","Weee","Amazon"];

function renderShopList() {
  const p = document.getElementById("panel-shoplist");
  const storeOptionsHtml = ["<option value=\"\">All stores</option>"]
    .concat(storeOptions.map(s => `<option value="${s.name}" ${shopStoreFilter===s.name?"selected":""}>${s.name}</option>`))
    .join("");

  let html = `
  <div class="row" style="justify-content:space-between; margin-bottom:14px;">
    <button id="back-to-todo-btn" style="display:inline-flex; align-items:center; gap:6px;">&larr; Back to To-do</button>
  </div>

  <div class="add-form">
    <input type="text" id="sl-search" placeholder="Search items" value="${shopSearch}" style="flex:1; min-width:140px;" />
    <select id="sl-store-filter" style="flex:0 0 150px;">${storeOptionsHtml}</select>
  </div>

  <div class="add-form">
    <input type="text" id="sl-category" placeholder="Category" style="flex:1; min-width:110px;" />
    <input type="text" id="sl-item" placeholder="Item" style="flex:2; min-width:130px;" />
    <input type="number" id="sl-qty" placeholder="Qty" min="1" style="flex:0 0 80px;" />
    <select id="sl-store" style="flex:0 0 140px;">${storeSelectOptionsHtml("")}</select>
    <button class="primary" id="sl-add">+ Add item</button>
  </div>`;

  const q = shopSearch.trim().toLowerCase();
  let rows = shopList.filter(r => {
    const matchesSearch = q ? (r.item || "").toLowerCase().includes(q) : true;
    const matchesStore = shopStoreFilter ? r.store === shopStoreFilter : true;
    return matchesSearch && matchesStore;
  });

  if (shopList.length === 0) {
    html += `<div class="card"><p class="muted">No items yet. Add one above, or check the box in a to-do task's edit popup to send it here.</p></div>`;
  } else if (rows.length === 0) {
    html += `<div class="card"><p class="muted">No items match your search or filter.</p></div>`;
  } else {
    const categories = [];
    rows.forEach(r => { const c = r.category || "Uncategorized"; if (!categories.includes(c)) categories.push(c); });
    categories.forEach(cat => {
      const items = rows.filter(r => (r.category || "Uncategorized") === cat);
      html += `<div class="row" style="margin:18px 0 8px;"><span class="section-label">${cat}</span></div>`;
      html += `<div class="table-wrap"><table class="data-table">
        <thead><tr><th style="width:46px;">Got</th><th>Item Name</th><th>Quantity</th><th>Store</th><th></th></tr></thead>
        <tbody>`;
      items.forEach(row => {
        if (shopListEditingId === row.id) {
          const storeOpts = storeSelectOptionsHtml(row.store);
          html += `<tr>
            <td colspan="5" style="padding:10px;">
              <div class="row" style="gap:8px; margin-bottom:8px;">
                <input type="text" data-slrow-field="item" data-slrow-id="${row.id}" value="${row.item || ""}" placeholder="Item name" style="flex:2; min-width:100px;" />
                <input type="number" min="1" data-slrow-field="qtyNeeded" data-slrow-id="${row.id}" value="${row.qtyNeeded || 1}" style="flex:0 0 70px;" />
                <select data-slrow-field="store" data-slrow-id="${row.id}" style="flex:0 0 140px;">${storeOpts}</select>
                <input type="text" data-slrow-field="category" data-slrow-id="${row.id}" value="${row.category || ""}" placeholder="Category" style="flex:0 0 120px;" />
              </div>
              <div class="row" style="gap:8px;">
                <input type="text" data-slrow-field="notes" data-slrow-id="${row.id}" value="${row.notes || ""}" placeholder="Note" style="flex:1;" />
                <button data-slrow-done="${row.id}">Done</button>
                <button class="icon-btn" data-slrow-remove="${row.id}" aria-label="Remove item">${TRASH_ICON}</button>
              </div>
            </td>
          </tr>`;
        } else {
          html += `<tr>
            <td><input type="checkbox" data-slrow-bought="${row.id}" ${row.bought ? "checked" : ""} aria-label="Bought ${esc(row.item || "item")}" /></td>
            <td><span class="shop-item-name ${row.bought ? "strike" : ""}" data-slrow-open="${row.id}">${row.item || ""}</span></td>
            <td>${row.qtyNeeded || 1}</td>
            <td>${row.store || "\u2014"}</td>
            <td><button class="icon-btn" data-slrow-remove="${row.id}" aria-label="Remove item">${TRASH_ICON}</button></td>
          </tr>`;
        }
      });
      html += `</tbody></table></div>`;
    });
  }

  p.innerHTML = html;

  document.getElementById("back-to-todo-btn").addEventListener("click", () => goToTab("todo"));

  document.getElementById("sl-store").addEventListener("change", (e) => {
    handleStoreSelectAction(e.currentTarget, "", (created) => {
      renderShopList();
      const sel = document.getElementById("sl-store");
      if (sel) sel.value = created;
    });
  });

  document.getElementById("sl-search").addEventListener("input", (e) => {
    const pos = e.target.selectionStart;
    shopSearch = e.target.value;
    renderShopList();
    const el = document.getElementById("sl-search");
    el.focus();
    el.setSelectionRange(pos, pos);
  });
  document.getElementById("sl-store-filter").addEventListener("change", (e) => {
    shopStoreFilter = e.target.value;
    renderShopList();
  });

  document.getElementById("sl-add").addEventListener("click", () => {
    const category = document.getElementById("sl-category").value.trim();
    const item = document.getElementById("sl-item").value.trim();
    const qty = document.getElementById("sl-qty").value || 1;
    const store = document.getElementById("sl-store").value;
    if (!item) return;
    shopList.push({id: uid(), category, item, qtyNeeded: qty, store, notes: ""});
    renderShopList();
    saveKey("wedding-shop-list", shopList);
  });
  p.querySelectorAll("[data-slrow-open]").forEach(el => {
    el.addEventListener("click", (e) => {
      shopListEditingId = e.currentTarget.dataset.slrowOpen;
      renderShopList();
    });
  });
  p.querySelectorAll("[data-slrow-done]").forEach(el => {
    el.addEventListener("click", () => {
      shopListEditingId = null;
      renderShopList();
    });
  });
  p.querySelectorAll("[data-slrow-bought]").forEach(el => {
    el.addEventListener("change", async (e) => {
      const row = shopList.find(r => r.id === e.currentTarget.dataset.slrowBought);
      if (!row) return;
      row.bought = e.currentTarget.checked;
      await saveKey("wedding-shop-list", shopList);
      renderShopList();
    });
  });
  p.querySelectorAll("[data-slrow-field]").forEach(el => {
    el.addEventListener("change", (e) => {
      const row = shopList.find(r => r.id === e.currentTarget.dataset.slrowId);
      if (!row) return;
      const field = e.currentTarget.dataset.slrowField;
      if (field === "store" && handleStoreSelectAction(e.currentTarget, row.store, (created) => {
        row.store = created;
        saveKey("wedding-shop-list", shopList);
        renderShopList();
      })) return;
      row[field] = e.currentTarget.value;
      saveKey("wedding-shop-list", shopList);
      renderShopList();
    });
  });
  p.querySelectorAll("[data-slrow-remove]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      const id = e.currentTarget.dataset.slrowRemove;
      shopList = shopList.filter(r => r.id !== id);
      todoData.forEach(s => s.items.forEach(item => {
        if (item.shopItemId === id) item.shopItemId = "";
        if (item.shopItemIds) item.shopItemIds = item.shopItemIds.filter(x => x !== id);
      }));
      shopListEditingId = null;
      renderShopList();
      renderTodo();
      saveKey("wedding-shop-list", shopList);
      saveKey("wedding-todo-items", todoData);
    });
  });
}

function renderDashboard() {
  const p = document.getElementById("panel-dashboard");
  const totalPeople = guests.reduce((s,g) => s + (Number(g.partySize)||0), 0);
  const drivingCount = guests.filter(g => g.transport === "Driving").length;
  const flyingCount = guests.filter(g => g.transport === "Flying").length;

  const spent = budgetSpent();
  const shopTotal = shopList.length;
  const shopBought = shopList.filter(r => r.bought).length;
  const shopPct = shopTotal ? Math.round(shopBought / shopTotal * 100) : 0;
  const total = Number(budget.total) || 0;
  const pct = total ? Math.min(100, Math.round(spent / total * 100)) : 0;
  const remaining = total - spent;

  let totalDone = 0, totalItems = 0;
  const upcoming = [];
  todoData.forEach(s => s.items.forEach(item => {
    totalItems++;
    if (todoState[item.id]) totalDone++;
    else upcoming.push({...item, section: s.label});
  }));
  const todoPct = totalItems ? Math.round(totalDone/totalItems*100) : 0;

  const overallPct = todoPct;

  const dashboardShopStores = {};
  shopList.forEach(r => { const k = r.store || ""; if (k) dashboardShopStores[k] = (dashboardShopStores[k]||0) + 1; });

          pct: overallPct,
          centerText: overallPct + "%",
          centerSub: "complete",
          title: "Overall wedding readiness"
        })}
        <div class="ring-legend">
          <div class="ring-main">${totalDone} of ${totalItems} to-dos done</div>
        </div>
      </div>
    </div>
  </div>

  <div class="stat-row">
    <div class="stat icon-stat">
      <div class="icon-stat-badge">${icon("users")}</div>
      <div>
        <div class="num">${totalPeople}</div>
        <div class="lbl">Total guests (${drivingCount} driving, ${flyingCount} flying)</div>
      </div>
    </div>
    <div class="stat icon-stat">
      <div class="icon-stat-badge">${icon("wallet")}</div>
      <div>
        <div class="num">${fmtMoney(spent)}</div>
        <div class="lbl">${total ? "of " + fmtMoney(total) + " budget" : "spent so far"}</div>
      </div>
    </div>
    <div class="stat icon-stat">
      <div class="icon-stat-badge">${icon("check")}</div>
      <div>
        <div class="num">${totalDone}/${totalItems}</div>
        <div class="lbl">To-dos done</div>
      </div>
    </div>
  </div>

  <div class="dash-duo">
    <div class="card">
      <div class="row" style="justify-content:space-between; margin-bottom:8px;">
        <p class="section-title" style="margin:0;">Budget</p>

    <div class="row" style="justify-content:space-between; margin-bottom:8px;">
      <p class="section-title" style="margin:0;">To-do quick view</p>
      <div class="row" style="gap:10px;">
        <span class="muted">${todoPct}% complete</span>
        <button id="goto-todo" style="border:none; background:none; padding:0; color:var(--primary); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;">View all &rarr;</button>
      </div>
    </div>
    <div class="progress-bar" style="margin-bottom:12px;"><div class="progress-fill" style="width:${todoPct}%;"></div></div>
    ${upcoming.length === 0 ? '<p class="muted">Everything is checked off. Nicely done.</p>' : upcoming.slice(0, 5).map(item => `
      <div class="item-row">
        <span style="flex:2; min-width:150px;">${item.text}</span>
        <span class="muted" style="flex:0 0 100px;">${item.dueDate ? fmtDate(new Date(item.dueDate + "T00:00:00")) : "No deadline"}</span>
        <span class="muted" style="flex:0 0 90px;">${item.assignee || "Unassigned"}</span>
      </div>`).join("")}
  </div>`;
  p.innerHTML = html;
  const gotoLink = document.getElementById("goto-todo");
  if (gotoLink) {
    gotoLink.addEventListener("click", (e) => {
      e.preventDefault();
      goToTab("todo");
    });
  }
  const gotoBudgetLink = document.getElementById("goto-budget");
  if (gotoBudgetLink) {
    gotoBudgetLink.addEventListener("click", (e) => {
      e.preventDefault();
      goToTab("budget");
    });
  }
  const gotoShoplistLink = document.getElementById("goto-shoplist");
  if (gotoShoplistLink) {
    gotoShoplistLink.addEventListener("click", (e) => {
      e.preventDefault();
      goToTab("shoplist");
    });
  }
}

(async function init() {
  // "No rows came back" can mean an empty account or a request that timed out.
  // Seeding defaults on the second case writes them over real data, so every
  // seed below is gated on having actually reached the server.
  const maySeed = await storeIsTrustworthy();
  if (!maySeed) showOfflineBanner();

  const savedItems = await loadKey("wedding-todo-items");
  const savedState = (await loadKey("wedding-checklist")) || {};

  if (savedItems && savedItems.length) {
    todoData = savedItems;
    const migrated = await loadKey("wedding-assignee-reset-done");
    if (!migrated) {
      todoData.forEach(s => s.items.forEach(item => { item.assignee = ""; }));
      await saveKey("wedding-todo-items", todoData);
      await saveKey("wedding-assignee-reset-done", true);
    }
    todoState = savedState;
  } else if (maySeed) {
    todoData = TODO_DEFAULTS.map(s => ({
      id: s.id,
      label: s.label,
      items: s.items.map((text, i) => ({id: s.id + "-" + i, text}))
    }));
    todoState = savedState;
    await saveKey("wedding-todo-items", todoData);
  } else {
    todoData = [];
    todoState = savedState;
  }

  guests = await loadKey("wedding-guests");
  if ((!guests || guests.length === 0) && maySeed) {
    guests = GUEST_SEED.map(s => ({id: uid(), ...s}));
    await saveKey("wedding-guests", guests);
  }
  if (!guests) guests = [];
  activities = (await loadKey("wedding-activity-areas")) || [];
  if ((!Array.isArray(activities) || activities.length === 0) && maySeed) {
    activities = AREA_SEED.map(s => ({
      id: s.id,
      label: s.label,
      areas: s.areas.map(name => ({id: uid(), name, assignee: "", notes: "", todos: []}))
    }));
    await saveKey("wedding-activity-areas", activities);
  }
  if (!Array.isArray(activities)) activities = [];
  timeline = (await loadKey("wedding-timeline")) || [];
  if (timeline.length === 0 && maySeed) {
    timeline = TIMELINE_SEED.map(s => ({id: uid(), ...s}));
    await saveKey("wedding-timeline", timeline);
  }
  timelineSections = (await loadKey("wedding-timeline-sections")) || [];
  if (timelineSections.length === 0 && maySeed) {
    timelineSections = TIMELINE_SECTION_DEFAULTS.map(name => ({id: uid(), name}));
    await saveKey("wedding-timeline-sections", timelineSections);
  }
  helperTags = (await loadKey("wedding-helper-tags")) || [];
  budget = (await loadKey("wedding-budget")) || { total: 0, vendors: [], expenses: [] };
  if (!budget.vendors) budget.vendors = [];
  if (!budget.expenses) budget.expenses = [];
  if (budget.vendors.length === 0 && maySeed) {
    budget.vendors = BUDGET_SEED.map(v => ({id: uid(), ...v}));
    if (!budget.total) budget.total = 50000;
    await saveKey("wedding-budget", budget);
  }
  shopList = (await loadKey("wedding-shop-list")) || [];
  storeOptions = (await loadKey("wedding-store-options")) || [];
  if (storeOptions.length === 0 && maySeed) {
    storeOptions = STORE_DEFAULTS.map(name => ({id: uid(), name}));
    await saveKey("wedding-store-options", storeOptions);
  }

  renderDashboard();
  renderTodo();
  renderGuests();
  renderBudget();
  renderShopList();
  renderActivities();
  renderTimeline();

  // Push anything that was only saved locally (e.g. edits made while the
  // backend was down) up to the server now that it is reachable again.
  await syncLocalToRemote();

  // Last, so the day's copy reflects anything that just synced up.
  writeDailySnapshotIfNeeded();
})();
</script>
</body>
</html>
