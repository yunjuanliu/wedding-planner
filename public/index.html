<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wedding Planner</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%22-6%20-4%20153%20158%22%3E%3Cpath%20d%3D%22M3%203L40.5%2070.5V147%22%20stroke%3D%22%23C9A96E%22%20stroke-width%3D%229%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20fill%3D%22none%22%2F%3E%3Cpath%20d%3D%22M78%203L40.5%2070.5%22%20stroke%3D%22%23C9A96E%22%20stroke-width%3D%229%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20fill%3D%22none%22%2F%3E%3Cpath%20d%3D%22M63%203L100.5%2070.5V147%22%20stroke%3D%22%23C9A96E%22%20stroke-width%3D%229%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20fill%3D%22none%22%2F%3E%3Cpath%20d%3D%22M138%203L100.5%2070.5%22%20stroke%3D%22%23C9A96E%22%20stroke-width%3D%229%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20fill%3D%22none%22%2F%3E%3Cpath%20d%3D%22M70.5%2085.5C66%2081%2061.5%2081%2061.5%2085.5C61.5%2090%2070.5%2097.5%2070.5%2097.5C70.5%2097.5%2079.5%2090%2079.5%2085.5C79.5%2081%2075%2081%2070.5%2085.5Z%22%20fill%3D%22%23ECD1D1%22%2F%3E%3C%2Fsvg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F8F7FC;
    --surface: #FFFFFF;
    --ink: #1D1B29;
    --ink-soft: #6F6C81;
    --primary: #6E4CD9;
    --primary-hover: #5D3FC0;
    --primary-light: #EFEAFB;
    --border: #E7E4F1;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 0;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 0 20px 28px; }
  h1 {
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: 26px;
    margin: 0;
    letter-spacing: -0.4px;
  }
  .app-header {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 20px 20px 18px;
    margin-bottom: 22px;
    border-bottom: 1px solid var(--border);
  }
  .app-logo { width: 34px; height: 36px; flex: 0 0 auto; display: block; }
  @media (max-width: 480px) {
    .app-header { gap: 10px; padding: 16px 16px 14px; margin-bottom: 18px; }
    .app-logo { width: 28px; height: 30px; }
    h1 { font-size: 21px; }
  }
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .tab {
    flex: 1 1 0;
    min-width: 0;
    text-align: center;
    white-space: nowrap;
    padding: 9px 12px;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink-soft);
    cursor: pointer;
    border-radius: 8px;
    user-select: none;
    transition: background 0.15s, color 0.15s;
  }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--white); background: var(--primary); font-weight: 600; }
  .panel { display: none; }
  .panel.active { display: block; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 14px;
    box-shadow: 0 1px 2px rgba(28, 27, 41, 0.03);
  }
  .stat-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat {
    flex: 1;
    min-width: 110px;
    background: var(--primary-light);
    border-radius: 12px;
    padding: 13px 15px;
  }
  .stat .num { font-size: 21px; font-weight: 700; color: var(--primary); letter-spacing: -0.3px; }
  .stat .lbl { font-size: 12px; color: var(--ink-soft); margin-top: 1px; }
  .progress-bar { height: 8px; border-radius: 5px; background: var(--primary-light); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--primary); border-radius: 5px; transition: width 0.3s; }
  .dash-duo { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .dash-duo { grid-template-columns: 1fr; } }
  .ring-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 6px 0 2px; }
  .ring { position: relative; width: 132px; height: 132px; flex: 0 0 auto; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
  .ring .ring-track { stroke: var(--primary-light); }
  .ring .ring-fill { stroke-linecap: round; transition: stroke-dashoffset 0.45s ease; }
  .ring-center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 1px;
  }
  .ring-center .ring-pct { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.05; }
  .ring-center .ring-sub { font-size: 11px; color: var(--ink-soft); }
  .ring-legend { text-align: center; }
  .ring-legend .ring-main { font-size: 15px; font-weight: 600; }
  .ring-legend .ring-note { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  input[type=text], input[type=number], input[type=date], select {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 14px;
    font-family: inherit;
    background: var(--white);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
  }
  input[type=text]:focus, input[type=number]:focus, input[type=date]:focus, select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
  }
  input[type=checkbox] { accent-color: var(--primary); width: 17px; height: 17px; }
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }
  ::placeholder { color: #A6A3B6; }
  button {
    border: 1px solid var(--border);
    background: var(--white);
    color: var(--ink);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    font-family: inherit;
    min-height: 36px;
  }
  button:hover { background: var(--primary-light); border-color: var(--primary); }
  button.primary { background: var(--primary); color: var(--white); border-color: var(--primary); }
  button.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .icon-btn { padding: 6px 10px; border-color: transparent; color: var(--ink-soft); min-height: 32px; }
  .icon-btn:hover { background: var(--primary-light); color: var(--primary); border-color: transparent; }
  @media (max-width: 480px) {
    body { padding: 0; }
    .wrap { padding: 0 12px 16px; }
    .stat-row { gap: 8px; }
    .stat { min-width: 100%; }
    .item-row { gap: 6px; }
  }
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(29, 27, 41, 0.35);
    align-items: center; justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--white);
    border-radius: 14px;
    padding: 22px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 8px 30px rgba(29, 27, 41, 0.18);
  }
  .modal-box h3 { margin: 0 0 14px; font-size: 16px; font-weight: 600; }
  .modal-box input[type=text] { width: 100%; margin-bottom: 16px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .task-text { cursor: pointer; border-bottom: 1px dashed transparent; }
  .task-text:hover { border-bottom-color: var(--primary); color: var(--primary); }
  .switch {
    position: relative;
    display: inline-block;
    width: 42px;
    height: 24px;
    flex: 0 0 auto;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch-track {
    position: absolute; inset: 0;
    background: var(--border);
    border-radius: 24px;
    transition: background 0.15s;
    cursor: pointer;
  }
  .switch-track::before {
    content: '';
    position: absolute;
    height: 18px; width: 18px;
    left: 3px; bottom: 3px;
    background: var(--white);
    border-radius: 50%;
    transition: transform 0.15s;
    box-shadow: 0 1px 3px rgba(28,27,41,0.2);
  }
  .switch input:checked + .switch-track { background: var(--primary); }
  .switch input:checked + .switch-track::before { transform: translateX(18px); }
  .shop-item-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .shop-item-row:first-child { border-top: none; }
  .shop-item-name { cursor: pointer; border-bottom: 1px dashed transparent; flex: 2; min-width: 100px; }
  .shop-item-name:hover { border-bottom-color: var(--primary); color: var(--primary); }
  .link-btn {
    border: none;
    background: none;
    padding: 0;
    color: var(--primary);
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
    font-family: inherit;
  }
  .link-btn:hover { text-decoration: underline; }
  .guest-row {
    display: grid;
    grid-template-columns: minmax(130px, 2fr) 36px 110px 100px minmax(110px, 1fr) 32px;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-top: 1px solid var(--border);
    text-align: left;
  }
  .guest-row:first-child { border-top: none; }
  .guest-row > * { text-align: left; justify-self: start; }
  .guest-row select { width: 100%; }
  #g-list { overflow-x: auto; }
  #g-list .guest-row { min-width: 560px; }
  .tl-card {
    position: relative;
    transition: box-shadow 0.15s, opacity 0.15s;
  }
  .tl-card.dragging { opacity: 0.4; }
  .tl-card.drag-over-top { border-top: 2px solid var(--primary); margin-top: -2px; }
  .tl-card.drag-over-bottom { border-bottom: 2px solid var(--primary); }
  .tl-handle {
    cursor: grab;
    color: var(--border);
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
    flex: 0 0 auto;
    font-size: 15px;
    line-height: 1;
    padding: 0 2px;
    user-select: none;
  }
  .tl-card:hover .tl-handle { opacity: 1; }
  .tl-handle:hover { color: var(--primary); }
  .tl-handle:active { cursor: grabbing; }
  .tl-fade { opacity: 0; transition: opacity 0.15s; }
  .tl-card:hover .tl-fade { opacity: 1; }
  @keyframes tlPulse {
    0%   { box-shadow: 0 0 0 3px var(--primary); }
    100% { box-shadow: 0 1px 2px rgba(28,27,41,0.03); }
  }
  .tl-card.jumped { animation: tlPulse 0.6s ease-out forwards; }
  .item-row.dragging { opacity: 0.4; }
  .item-row.drag-over-top { border-top: 2px solid var(--primary); margin-top: -2px; }
  .item-row.drag-over-bottom { border-bottom: 2px solid var(--primary); }
  .item-row.jumped { animation: tlPulse 0.6s ease-out forwards; border-radius: 8px; }
  .todo-handle {
    cursor: grab;
    color: var(--border);
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
    flex: 0 0 auto;
    font-size: 15px;
    line-height: 1;
    padding: 0 2px;
    user-select: none;
  }
  .item-row:hover .todo-handle { opacity: 1; }
  .todo-handle:hover { color: var(--primary); }
  .todo-handle:active { cursor: grabbing; }
  .todo-zone { min-height: 6px; }
  .hero-banner {
    background: linear-gradient(135deg, var(--primary) 0%, #8B6FE8 100%);
    border-radius: 16px;
    padding: 24px 26px;
    color: #fff;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .hero-banner::before {
    content: '';
    position: absolute;
    right: -40px; top: -40px;
    width: 160px; height: 160px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
  }
  .hero-banner::after {
    content: '';
    position: absolute;
    right: 30px; bottom: -50px;
    width: 110px; height: 110px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
  }
  .hero-days {
    font-size: 38px;
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1;
    position: relative;
    z-index: 1;
  }
  .hero-sub {
    font-size: 13px;
    opacity: 0.85;
    margin-top: 6px;
    position: relative;
    z-index: 1;
  }
  .icon-stat {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .icon-stat-badge {
    flex: 0 0 auto;
    width: 38px; height: 38px;
    border-radius: 10px;
    background: var(--white);
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 1px 3px rgba(28,27,41,0.06);
  }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .item-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .item-row:last-child { border-bottom: none; }
  .section-title {
    font-family: "Inter", sans-serif;
    font-weight: 600;
    font-size: 15px;
    margin: 0 0 8px;
    color: var(--ink);
  }
  .section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--primary);
    background: var(--primary-light);
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
  }
  .muted { color: var(--ink-soft); font-size: 13px; }
  .strike { color: var(--ink-soft); text-decoration: line-through; }
  .add-form { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
  table.data-table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 13.5px; }
  table.data-table th {
    text-align: left; padding: 10px 10px; background: var(--primary-light); color: var(--primary);
    font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.3px;
    white-space: nowrap; position: sticky; top: 0;
  }
  table.data-table td { padding: 6px 8px; border-top: 1px solid var(--border); vertical-align: middle; }
  table.data-table tr:hover td { background: #FBFAFE; }
  table.data-table input[type=text], table.data-table input[type=number] {
    border: 1px solid transparent; background: transparent; width: 100%; padding: 6px 6px; border-radius: 6px;
  }
  table.data-table input[type=text]:hover, table.data-table input[type=number]:hover { border-color: var(--border); }
  table.data-table input[type=text]:focus, table.data-table input[type=number]:focus { background: var(--white); border-color: var(--primary); }
</style>
</head>
<body>
<header class="app-header">
  <svg class="app-logo" viewBox="0 0 141 150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Y&amp;Y monogram">
    <path d="M3.00049 3.00055L40.5005 70.5005V147.001" stroke="#C9A96E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M78.0005 3.00055L40.5005 70.5005" stroke="#C9A96E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M63.0005 3.00055L100.5 70.5005V147.001" stroke="#C9A96E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M138 3.00055L100.5 70.5005" stroke="#C9A96E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M70.5005 85.5005C66.0005 81.0005 61.5005 81.0005 61.5005 85.5005C61.5005 90.0005 70.5005 97.5005 70.5005 97.5005C70.5005 97.5005 79.5005 90.0005 79.5005 85.5005C79.5005 81.0005 75.0005 81.0005 70.5005 85.5005Z" fill="#ECD1D1"/>
  </svg>
  <h1>Wedding Planner</h1>
</header>
<div class="wrap">

  <div class="tabs">
    <div class="tab active" data-tab="dashboard">Dashboard</div>
    <div class="tab" data-tab="todo">To-do</div>
    <div class="tab" data-tab="guests">Guest count</div>
    <div class="tab" data-tab="budget">Budget</div>
    <div class="tab" data-tab="activities">Activity table</div>
    <div class="tab" data-tab="timeline">Timeline</div>
  </div>

  <div id="panel-dashboard" class="panel active"></div>
  <div id="panel-todo" class="panel"></div>
  <div id="panel-shoplist" class="panel"></div>
  <div id="panel-guests" class="panel"></div>
  <div id="panel-budget" class="panel"></div>
  <div id="panel-activities" class="panel"></div>
  <div id="panel-timeline" class="panel"></div>
</div>

<div class="modal-overlay" id="tags-modal">
  <div class="modal-box" style="max-width:340px;">
    <h3 style="margin:0 0 14px;">Manage tags</h3>
    <div id="tags-modal-list" style="margin-bottom:14px;"></div>
    <div class="modal-actions">
      <button id="tags-modal-close">Close</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="input-modal">
  <div class="modal-box" style="max-width:340px;">
    <h3 id="input-modal-title">Edit</h3>
    <input type="text" id="input-modal-field" />
    <div class="modal-actions">
      <button id="input-modal-cancel">Cancel</button>
      <button class="primary" id="input-modal-save">Save</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="task-modal">
  <div class="modal-box" style="max-width:440px;">

    <div id="task-view-mode">
      <div class="row" style="justify-content:space-between; align-items:flex-start; margin-bottom:10px;">
        <h3 id="tv-title" style="margin:0; word-break:break-word; flex:1;">Task title</h3>
        <button id="task-edit-btn" style="flex:0 0 auto;">Edit</button>
      </div>
      <div id="tv-image-wrap" style="margin-bottom:12px; display:none;">
        <img id="tv-image" style="width:100%; border-radius:10px; display:block;" />
      </div>
      <p id="tv-body" class="muted" style="white-space:pre-wrap; margin:0 0 14px;"></p>
      <div class="row" style="gap:16px; flex-wrap:wrap; margin-bottom:6px;">
        <div><span class="muted" style="font-size:12px;">Due date</span><br><span id="tv-due" style="font-weight:500;">—</span></div>
        <div><span class="muted" style="font-size:12px;">Assignee</span><br><span id="tv-assignee" style="font-weight:500;">Unassigned</span></div>
      </div>
      <div class="modal-actions" style="margin-top:16px;">
        <button id="task-view-close">Close</button>
      </div>
    </div>

    <div id="task-edit-mode" style="display:none;">
      <h3 style="margin:0 0 14px;">Edit task</h3>
      <label class="muted" style="font-size:12px;">Title</label>
      <input type="text" id="task-modal-title" style="margin-bottom:12px;" />
      <label class="muted" style="font-size:12px;">Notes</label>
      <textarea id="task-modal-body" rows="3" style="width:100%; margin-bottom:12px; border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-family:inherit; font-size:14px; resize:vertical;"></textarea>
      <div class="row" style="gap:10px; margin-bottom:12px;">
        <div style="flex:1;">
          <label class="muted" style="font-size:12px;">Due date</label>
          <input type="date" id="task-modal-due" style="width:100%;" />
        </div>
        <div style="flex:1;">
          <label class="muted" style="font-size:12px;">Assignee</label>
          <select id="task-modal-assignee" style="width:100%;"></select>
        </div>
      </div>
      <label class="muted" style="font-size:12px;">Image</label>
      <div class="row" style="gap:8px; margin-bottom:16px; align-items:center;">
        <input type="file" id="task-modal-image" accept="image/*" style="flex:1;" />
        <button id="task-modal-image-remove" type="button" style="flex:0 0 auto;">Remove</button>
      </div>
      <div id="task-modal-image-preview-wrap" style="margin:-8px 0 16px; display:none;">
        <img id="task-modal-image-preview" style="width:100%; max-height:160px; object-fit:cover; border-radius:10px; display:block;" />
      </div>

      <div style="border-top:1px solid var(--border); padding-top:14px; margin-bottom:16px;">
        <label style="display:flex; align-items:center; gap:10px; cursor:pointer; font-weight:600; font-size:14px;">
          <span class="switch">
            <input type="checkbox" id="task-modal-shop-toggle" />
            <span class="switch-track"></span>
          </span>
          <span id="task-modal-shop-label">Add items to shop list</span>
        </label>
        <div id="task-modal-shop-fields" style="display:none; margin-top:12px;">

function addShopItemFromModal(name, qty, store, notes) {
  const trimmed = name.trim();

  const newRow = { id: uid(), category: "", item: trimmed, qtyNeeded: qty || 1, store: store || "", notes: (notes || "").trim() };
  shopList.push(newRow);
  const ids = getShopItemIds(item);
  ids.push(newRow.id);
  item.shopItemIds = ids;
  delete item.shopItemId;
  saveKey("wedding-shop-list", shopList);
  saveKey("wedding-todo-items", todoData);
  renderShopItemsTable();
  renderShopList();
}

function removeShopItem(id) {
  const item = getEditingItem();
  shopList = shopList.filter(r => r.id !== id);
  if (item) {
    item.shopItemIds = getShopItemIds(item).filter(x => x !== id);
    delete item.shopItemId;
    saveKey("wedding-todo-items", todoData);
  }
  saveKey("wedding-shop-list", shopList);
  renderShopItemsTable();
  renderShopList();
}

const SUPABASE_URL = "https://nxqmcqdmiwewuvmsquzo.supabase.co";
const SUPABASE_KEY = "sb_publishable_wD2nS9lqTHuLTgjA6FBBKw_-udl1xAt";
const SB_HEADERS = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json"
};

let storeCache = null;
async function loadStore() {
  if (storeCache) return storeCache;
  storeCache = {};
  try {
    const r = await fetch(SUPABASE_URL + "/rest/v1/wedding_store?select=key,value", { headers: SB_HEADERS });
    if (r.ok) (await r.json()).forEach(row => { storeCache[row.key] = row.value; });
  } catch (e) {}
  return storeCache;
}

async function saveKey(key, value) {
  const store = await loadStore();
  store[key] = value;
  try {
    await fetch(SUPABASE_URL + "/rest/v1/wedding_store", {
      method: "POST",
      headers: { ...SB_HEADERS, "Prefer": "resolution=merge-duplicates" },
      body: JSON.stringify({ key: key, value: value })
    });
  } catch (e) {}
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

async function loadKey(key) {
  const store = await loadStore();
  if (key in store) return store[key];
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : null;
  } catch (e) { return null; }
}

const WEDDING_DATE = new Date(2026, 8, 19); // September 19, 2026
const SECTION_DAY_RANGES = {
  s1: {startDaysBefore: 70, endDaysBefore: 56},  // 10-8 weeks out
  s2: {startDaysBefore: 42, endDaysBefore: 28},  // 6-4 weeks out
  s3: {startDaysBefore: 21, endDaysBefore: 14},  // 3-2 weeks out
  s4: {startDaysBefore: 7, endDaysBefore: 1},    // week of
  s5: {startDaysBefore: 1, endDaysBefore: 1},    // day before
  s6: {startDaysBefore: 0, endDaysBefore: 0},    // day of
};
function fmtDate(d) {
  return d.toLocaleDateString(undefined, {month:"short", day:"numeric"});
}
function sectionDateLabel(sectionId) {
  const range = SECTION_DAY_RANGES[sectionId];
  if (!range) return "";
  const start = new Date(WEDDING_DATE);
  start.setDate(start.getDate() - range.startDaysBefore);
  const end = new Date(WEDDING_DATE);
  end.setDate(end.getDate() - range.endDaysBefore);
  if (range.startDaysBefore === range.endDaysBefore) return fmtDate(start);
  return fmtDate(start) + " – " + fmtDate(end);
}
function sectionDateStatus(sectionId) {
  const range = SECTION_DAY_RANGES[sectionId];
  if (!range) return "none";
  const today = new Date(); today.setHours(0,0,0,0);
  const start = new Date(WEDDING_DATE);
  start.setDate(start.getDate() - range.startDaysBefore);
  start.setHours(0,0,0,0);
  const end = new Date(WEDDING_DATE);
  end.setDate(end.getDate() - range.endDaysBefore);
  end.setHours(23,59,59,999);
  if (today >= start && today <= end) return "current";
  if (today > end) return "past";
  return "upcoming";
}

function renderTodo() {
  const p = document.getElementById("panel-todo");
  let totalDone = 0, totalItems = 0;
  todoData.forEach(s => { s.items.forEach(item => { totalItems++; if (todoState[item.id]) totalDone++; }); });
  const pct = totalItems ? Math.round(totalDone/totalItems*100) : 0;

  const shopTotalItems = shopList.length;
  const shopStoreBreakdown = {};
  shopList.forEach(r => { const k = r.store || "No store set"; shopStoreBreakdown[k] = (shopStoreBreakdown[k]||0) + 1; });
  const shopStoreSummary = Object.entries(shopStoreBreakdown)
    .sort((a,b) => b[1]-a[1])
    .slice(0, 3)
    .map(([store, count]) => `${store} (${count})`)
    .join(" \u00b7 ");

  let html = `
  <div class="row" style="gap:14px; align-items:stretch; margin-bottom:16px; flex-wrap:wrap;">
    <button id="goto-shoplist-btn" style="flex:1; min-width:220px; text-align:left; border:none; cursor:pointer; padding:0; font-family:inherit;">
      <div class="hero-banner" style="height:100%; padding:18px 20px; display:flex; flex-direction:column; justify-content:center; gap:10px; box-sizing:border-box;">
        <div style="width:40px; height:40px; border-radius:10px; background:rgba(255,255,255,0.18); display:flex; align-items:center; justify-content:center; color:#fff; position:relative; z-index:1;">${icon("cart", 20)}</div>
        <div style="position:relative; z-index:1;">
          <div style="font-size:16px; font-weight:700; color:#fff;">Shop List &rarr;</div>
          <div style="font-size:13px; color:rgba(255,255,255,0.85); margin-top:2px;">
            ${shopTotalItems === 0 ? "No items yet \u2014 tap to start" : `${shopTotalItems} item${shopTotalItems === 1 ? "" : "s"}${shopStoreSummary ? " \u00b7 " + shopStoreSummary : ""}`}
          </div>
        </div>
      </div>
    </button>
    <div class="card" style="flex:1; min-width:220px; margin-bottom:0; box-sizing:border-box;">
      <div class="row" style="justify-content:space-between; margin-bottom:8px;">
        <p class="section-title" style="margin:0;">To-do progress</p>
        <span style="font-weight:700; color:var(--primary); font-size:15px;">${pct}%</span>
      </div>
      <div class="progress-bar" style="height:10px; margin-bottom:14px;"><div class="progress-fill" style="width:${pct}%;"></div></div>
      <div class="icon-stat">
        <div class="icon-stat-badge">${icon("check")}</div>
        <div>
          <div class="num">${totalDone} / ${totalItems}</div>
          <div class="lbl">Tasks done</div>
        </div>
      </div>
    </div>
  </div>`;
  const statusOrder = { current: 0, upcoming: 1, past: 2, none: 1 };
  const orderedSections = [...todoData].sort((a, b) => {
    const sa = statusOrder[sectionDateStatus(a.id)];
    const sb = statusOrder[sectionDateStatus(b.id)];
    if (sa !== sb) return sa - sb;
    return 0;
  });

  orderedSections.forEach(s => {
    const done = s.items.filter(item => todoState[item.id]).length;
    const dateLabel = sectionDateLabel(s.id);
    const activeItems = s.items.filter(item => !todoState[item.id]);
    const status = sectionDateStatus(s.id);
    const cardStyle = status === "current"
      ? "border:2px solid var(--primary); box-shadow:0 0 0 3px var(--primary-light);"
      : status === "past" ? "opacity:0.7;" : "";
    html += `<div class="card" style="${cardStyle}"><div class="row" style="justify-content:space-between; margin-bottom:6px;">
      <div>
        <div class="row" style="gap:8px; align-items:center;">
          <p class="section-title" style="margin:0;">${s.label}</p>
          ${status === "current" ? '<span style="background:var(--primary); color:#fff; font-size:11px; font-weight:700; padding:2px 8px; border-radius:10px;">TODAY</span>' : ""}
        </div>
        ${dateLabel ? `<p class="muted" style="margin:2px 0 0; font-size:12px;">${dateLabel}</p>` : ""}
      </div>
      <span class="muted">${done}/${s.items.length}</span></div>`;
    html += `<div class="todo-zone" data-todo-zone="${s.id}">`;
    if (activeItems.length === 0) {
      html += `<p class="muted" style="font-size:13px; padding:4px 0;">All tasks in this section are done. Drag a task here to move it in.</p>`;
    }
    activeItems.forEach(item => {
      html += todoRowHtml(s.id, item, true);
    });
    html += `</div>`;
    html += `<div class="add-form" style="margin:10px 0 0;">
      <input type="text" data-add-section="${s.id}" placeholder="Add a task" style="flex:1; min-width:150px;" />
      <button data-add-btn="${s.id}">Add task</button>
    </div></div>`;
  });

  const doneList = [];
  todoData.forEach(s => s.items.forEach(item => { if (todoState[item.id]) doneList.push({sectionId: s.id, sectionLabel: s.label, item}); }));
  if (doneList.length > 0) {
    html += `<div class="card">

      ${todoDoneOpen ? `<div style="margin-top:10px;">${doneList.map(({sectionId, sectionLabel, item}) => `
        <div style="margin-bottom:2px;">
          <span class="muted" style="font-size:11px; text-transform:uppercase; letter-spacing:0.3px;">${sectionLabel}</span>
          ${todoRowHtml(sectionId, item, false)}
        </div>`).join("")}</div>` : ""}
    </div>`;
  }

  p.innerHTML = html;

  document.getElementById("goto-shoplist-btn").addEventListener("click", () => goToTab("shoplist"));

  bindTodoDrag(p);
  if (todoJumpId) {
    const el = p.querySelector(`[data-todo-id="${todoJumpId}"]`);
    if (el) {
      el.classList.add("jumped");
      el.addEventListener("animationend", () => el.classList.remove("jumped"), {once:true});
    }

  }

  document.getElementById("todo-done-toggle") && document.getElementById("todo-done-toggle").addEventListener("click", () => {
    todoDoneOpen = !todoDoneOpen;
    renderTodo();
  });

  p.querySelectorAll("input[type=checkbox]").forEach(cb => {
    cb.addEventListener("change", (e) => {
      todoState[e.target.dataset.key] = e.target.checked;
      renderTodo();
      saveKey("wedding-checklist", todoState);
    });
  });
  p.querySelectorAll(".task-text").forEach(span => {
    span.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      openTaskEditModal(span.dataset.editSection, span.dataset.editItem, true);
    });
  });
  p.querySelectorAll("[data-assign-item]").forEach(sel => {
    sel.addEventListener("change", (e) => {
      const sectionId = e.target.dataset.assignSection;
      const itemId = e.target.dataset.assignItem;
      const section = todoData.find(s => s.id === sectionId);
      const item = section.items.find(i => i.id === itemId);
      if (e.target.value === "__add_new__") {
        e.target.value = item.assignee || "";
        openInputModal("Helper name", "", (name) => {
          const trimmed = name.trim();
          if (!trimmed) return;
          helperTags.push({id: uid(), name: trimmed});
          item.assignee = trimmed;
          renderTodo();
          saveKey("wedding-helper-tags", helperTags);
          saveKey("wedding-todo-items", todoData);
        });
        return;
      }
      if (e.target.value === "__manage__") {
        e.target.value = item.assignee || "";
        openTagsModal();
        return;
      }
      item.assignee = e.target.value;
      renderTodo();
      saveKey("wedding-todo-items", todoData);
    });
  });
  p.querySelectorAll("[data-due-item]").forEach(inp => {
    inp.addEventListener("change", (e) => {
      const sectionId = e.target.dataset.dueSection;
      const itemId = e.target.dataset.dueItem;
      const section = todoData.find(s => s.id === sectionId);
      const item = section.items.find(i => i.id === itemId);
      item.dueDate = e.target.value;
      renderTodo();
      saveKey("wedding-todo-items", todoData);
    });
  });
  p.querySelectorAll("[data-shop-toggle-item]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      const sectionId = e.currentTarget.dataset.shopToggleSection;
      const itemId = e.currentTarget.dataset.shopToggleItem;
      openTaskEditModal(sectionId, itemId, true);
    });
  });
  p.querySelectorAll("[data-remove-item]").forEach(btn => {

      const sectionId = e.currentTarget.dataset.removeSection;
      const itemId = e.currentTarget.dataset.removeItem;
      const section = todoData.find(s => s.id === sectionId);
      section.items = section.items.filter(i => i.id !== itemId);
      delete todoState[itemId];
      renderTodo();
      saveKey("wedding-todo-items", todoData);
      saveKey("wedding-checklist", todoState);
    });
  });
  function addTask(sectionId) {
    const input = p.querySelector(`[data-add-section="${sectionId}"]`);
    const text = input.value.trim();
    if (!text) return;
    const section = todoData.find(s => s.id === sectionId);
    section.items.push({id: uid(), text, assignee: "", body: "", dueDate: "", image: ""});
    renderTodo();
    saveKey("wedding-todo-items", todoData);
  }
  p.querySelectorAll("[data-add-btn]").forEach(btn => {
    btn.addEventListener("click", (e) => addTask(e.currentTarget.dataset.addBtn));

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") addTask(input.dataset.addSection);
    });
  });
}

function bindTodoDrag(p) {
  p.querySelectorAll(".item-row[draggable=true]").forEach(row => {
    row.addEventListener("dragstart", (e) => {
      if (["INPUT","SELECT","TEXTAREA","BUTTON"].includes(e.target.tagName)) {
        e.preventDefault();
        return;
      }
      todoDragId = row.dataset.todoId;
      todoDragSection = row.dataset.todoSection;
      row.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", "");
    });
    row.addEventListener("dragend", () => {
      row.classList.remove("dragging");
      p.querySelectorAll(".item-row").forEach(r => r.classList.remove("drag-over-top","drag-over-bottom"));
      todoDragId = null;
      todoDragSection = null;
    });
    row.addEventListener("dragover", (e) => {
      if (!todoDragId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      const rect = row.getBoundingClientRect();
      const mid = rect.top + rect.height / 2;
      row.classList.remove("drag-over-top","drag-over-bottom");
      row.classList.add(e.clientY < mid ? "drag-over-top" : "drag-over-bottom");
    });
    row.addEventListener("dragleave", () => {
      row.classList.remove("drag-over-top","drag-over-bottom");
    });
    row.addEventListener("drop", (e) => {
      if (!todoDragId) return;
      e.preventDefault();
      e.stopPropagation();
      row.classList.remove("drag-over-top","drag-over-bottom");
      if (todoDragId === row.dataset.todoId) return;
      const rect = row.getBoundingClientRect();
      const after = e.clientY >= rect.top + rect.height / 2;
      performTodoMove(todoDragId, todoDragSection, row.dataset.todoSection, row.dataset.todoId, after);
    });
  });
  p.querySelectorAll(".todo-zone").forEach(zone => {
    zone.addEventListener("dragover", (e) => { if (todoDragId) e.preventDefault(); });
    zone.addEventListener("drop", (e) => {
      if (!todoDragId) return;
      if (e.target.closest(".item-row[draggable=true]")) return;
      e.preventDefault();
      performTodoMove(todoDragId, todoDragSection, zone.dataset.todoZone, null, true);
    });
  });
}

function performTodoMove(itemId, fromSectionId, toSectionId, targetItemId, after) {
  const fromSection = todoData.find(s => s.id === fromSectionId);
  if (!fromSection) return;
  const idx = fromSection.items.findIndex(i => i.id === itemId);
  if (idx === -1) return;
  const [moved] = fromSection.items.splice(idx, 1);
  const toSection = todoData.find(s => s.id === toSectionId) || fromSection;
  if (targetItemId) {
    let targetIdx = toSection.items.findIndex(i => i.id === targetItemId);
    if (targetIdx === -1) targetIdx = toSection.items.length;
    const insertAt = Math.max(0, Math.min(after ? targetIdx + 1 : targetIdx, toSection.items.length));
    toSection.items.splice(insertAt, 0, moved);
  } else {
    toSection.items.push(moved);
  }
  todoJumpId = moved.id;
  renderTodo();
  saveKey("wedding-todo-items", todoData);
}

let timeline = [];
function buildTimeOptions() {
  const opts = [];
  for (let h = 0; h < 24; h++) {
    for (let m = 0; m < 60; m += 5) {
      const h12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
      const ap = h < 12 ? "am" : "pm";
      opts.push(`${h12}:${String(m).padStart(2,"0")} ${ap}`);
    }
  }
  return opts;
}
const TIME_OPTIONS = buildTimeOptions();
function timeToMinutes(t) {
  const m = (t || "").match(/(\d+):(\d+)\s*(am|pm)/i);
  if (!m) return 0;
  let [, h, min, ap] = m;
  h = parseInt(h); min = parseInt(min);
  if (ap.toLowerCase() === "am") { if (h === 12) h = 0; }
  else { if (h !== 12) h += 12; }
  return h * 60 + min;
}
function timeSelectOptions(sel) {
  return TIME_OPTIONS.map(t => `<option value="${t}" ${t===sel?"selected":""}>${t}</option>`).join("");
}

function bindTlZoneDrop(p) {
  p.querySelectorAll(".tl-zone").forEach(zone => {
    zone.addEventListener("dragover", (e) => { if (tlDragId) e.preventDefault(); });
    zone.addEventListener("drop", (e) => {
      if (!tlDragId) return;
      if (e.target.closest(".tl-card")) return;
      e.preventDefault();
      const t = timeline.find(x => x.id === tlDragId);
      if (!t) return;
      t.section = zone.dataset.sectionName || "";
      const order = [...timeline].sort((a,b) => (a.order||0) - (b.order||0));
      const idx = order.findIndex(x => x.id === tlDragId);
      if (idx !== -1) {
        const [moved] = order.splice(idx, 1);
        order.push(moved);
        order.forEach((item, i) => { item.order = i; });
      }
      tlJumpId = tlDragId;
      renderTimeline();
      saveKey("wedding-timeline", timeline);
    });
  });
}

function bindTlDrag(p) {
  p.querySelectorAll(".tl-card").forEach(card => {
    card.addEventListener("dragstart", (e) => {
      if (["INPUT","SELECT","TEXTAREA","BUTTON"].includes(e.target.tagName)) {
        e.preventDefault();
        return;
      }
      tlDragId = card.dataset.tlId;
      card.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", "");
    });
    card.addEventListener("dragend", () => {
      card.classList.remove("dragging");
      p.querySelectorAll(".tl-card").forEach(c => c.classList.remove("drag-over-top","drag-over-bottom"));
      tlDragId = null;
    });
    card.addEventListener("dragover", (e) => {
      if (!tlDragId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      const rect = card.getBoundingClientRect();
      const mid = rect.top + rect.height / 2;
      card.classList.remove("drag-over-top","drag-over-bottom");
      card.classList.add(e.clientY < mid ? "drag-over-top" : "drag-over-bottom");
    });
    card.addEventListener("dragleave", () => {
      card.classList.remove("drag-over-top","drag-over-bottom");
    });
    card.addEventListener("drop", (e) => {
      if (!tlDragId) return;
      e.preventDefault();
      e.stopPropagation();
      card.classList.remove("drag-over-top","drag-over-bottom");
      if (tlDragId === card.dataset.tlId) return;
      const rect = card.getBoundingClientRect();
      const after = e.clientY >= rect.top + rect.height / 2;
      performTlMove(tlDragId, card.dataset.tlId, after);
    });
  });
}

function performTlMove(draggedId, targetId, after) {
  const order = [...timeline].sort((a,b) => (a.order||0) - (b.order||0));
  const fromIdx = order.findIndex(t => t.id === draggedId);
  if (fromIdx === -1) return;
  const [moved] = order.splice(fromIdx, 1);
  let targetIdx = order.findIndex(t => t.id === targetId);
  if (targetIdx === -1) targetIdx = order.length;
  let insertAt = after ? targetIdx + 1 : targetIdx;
  insertAt = Math.max(0, Math.min(insertAt, order.length));
  const targetItem = order[after ? insertAt - 1 : insertAt] || order[order.length - 1];
  if (targetItem) moved.section = targetItem.section || "";
  order.splice(insertAt, 0, moved);
  order.forEach((item, i) => { item.order = i; });
  tlJumpId = moved.id;
  renderTimeline();
  saveKey("wedding-timeline", timeline);
}

function esc(s) {
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function budgetSpent() {
  const v = (budget.vendors || []).reduce((s, r) => s + (Number(r.amount) || 0), 0);
  const e = (budget.expenses || []).reduce((s, r) => s + (Number(r.amount) || 0), 0);
  return v + e;
}
function fmtMoney(n) {
  return "$" + Number(n || 0).toLocaleString(undefined, {maximumFractionDigits: 0});
}
function progressRing({pct, centerText, centerSub, color, title}) {
  const r = 54, c = 2 * Math.PI * r;
  const shown = Math.max(0, Math.min(100, Number(pct) || 0));
  const offset = c - (shown / 100) * c;
  const stroke = color || "var(--primary)";
  return `<div class="ring" role="img" aria-label="${esc(title || "")} ${Math.round(shown)}%">
    <svg viewBox="0 0 128 128">
      <circle class="ring-track" cx="64" cy="64" r="${r}" fill="none" stroke-width="12"></circle>
      <circle class="ring-fill" cx="64" cy="64" r="${r}" fill="none" stroke-width="12"
        stroke="${stroke}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"></circle>
    </svg>
    <div class="ring-center">
      <span class="ring-pct" style="color:${stroke};">${centerText}</span>
      ${centerSub ? `<span class="ring-sub">${centerSub}</span>` : ""}
    </div>
  </div>`;
}

        if (item.shopItemIds) item.shopItemIds = item.shopItemIds.filter(x => x !== id);
      }));
      shopListEditingId = null;
      renderShopList();
      renderTodo();
      saveKey("wedding-shop-list", shopList);
      saveKey("wedding-todo-items", todoData);
    });
  });
}

function renderDashboard() {
  const p = document.getElementById("panel-dashboard");
  const totalPeople = guests.reduce((s,g) => s + (Number(g.partySize)||0), 0);
  const drivingCount = guests.filter(g => g.transport === "Driving").length;
  const flyingCount = guests.filter(g => g.transport === "Flying").length;
  const householdsWithTransport = guests.filter(g => g.transport).length;
  const guestPct = guests.length ? Math.round(householdsWithTransport / guests.length * 100) : 0;

  const spent = budgetSpent();
  const shopTotal = shopList.length;
  const shopBought = shopList.filter(r => r.bought).length;
  const shopPct = shopTotal ? Math.round(shopBought / shopTotal * 100) : 0;
  const total = Number(budget.total) || 0;
  const pct = total ? Math.min(100, Math.round(spent / total * 100)) : 0;
  const remaining = total - spent;
  const budgetPct = total ? pct : 0;

  let totalDone = 0, totalItems = 0;
  const upcoming = [];
  todoData.forEach(s => s.items.forEach(item => {
    totalItems++;
    if (todoState[item.id]) totalDone++;
    else upcoming.push({...item, section: s.label});
  }));
  const todoPct = totalItems ? Math.round(totalDone/totalItems*100) : 0;

  const overallPct = Math.round((guestPct + budgetPct + todoPct) / 3);

  const dashboardShopStores = {};
  shopList.forEach(r => { const k = r.store || ""; if (k) dashboardShopStores[k] = (dashboardShopStores[k]||0) + 1; });
  const dashboardShopStoreSummary = Object.entries(dashboardShopStores)
    .sort((a,b) => b[1]-a[1])
    .slice(0, 3)
    .map(([store, count]) => `${store} (${count})`)
    .join(" \u00b7 ");

  const today = new Date(); today.setHours(0,0,0,0);
  const daysLeft = Math.round((WEDDING_DATE - today) / 86400000);
  const weddingDateLabel = WEDDING_DATE.toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric", year:"numeric"});

  let html = `
  <div class="hero-banner">
    <div class="hero-days">${daysLeft >= 0 ? daysLeft + " days to go" : "The big day has passed \u2014 congrats!"}</div>
    <div class="hero-sub">${weddingDateLabel}</div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between; margin-bottom:8px;">
      <p class="section-title" style="margin:0;">Overall wedding readiness</p>
      <span style="font-weight:700; color:var(--primary); font-size:15px;">${overallPct}%</span>
    </div>
    <div class="progress-bar" style="height:10px; margin-bottom:14px;"><div class="progress-fill" style="width:${overallPct}%;"></div></div>
    <div class="row" style="gap:20px; flex-wrap:wrap;">
      <div style="flex:1; min-width:130px;">
        <div class="row" style="justify-content:space-between; margin-bottom:4px;"><span class="muted">Guest travel set</span><span class="muted">${guestPct}%</span></div>
        <div class="progress-bar" style="height:5px;"><div class="progress-fill" style="width:${guestPct}%;"></div></div>
      </div>
      <div style="flex:1; min-width:130px;">
        <div class="row" style="justify-content:space-between; margin-bottom:4px;"><span class="muted">Budget used</span><span class="muted">${total ? budgetPct + "%" : "No budget set"}</span></div>
        <div class="progress-bar" style="height:5px;"><div class="progress-fill" style="width:${budgetPct}%; ${remaining < 0 ? "background:#D9455F;" : ""}"></div></div>
      </div>
      <div style="flex:1; min-width:130px;">
        <div class="row" style="justify-content:space-between; margin-bottom:4px;"><span class="muted">To-dos done</span><span class="muted">${todoPct}%</span></div>
        <div class="progress-bar" style="height:5px;"><div class="progress-fill" style="width:${todoPct}%;"></div></div>
      </div>
    </div>
  </div>

  <div class="stat-row">
    <div class="stat icon-stat">
      <div class="icon-stat-badge">${icon("users")}</div>
      <div>
        <div class="num">${totalPeople}</div>
        <div class="lbl">Total guests (${drivingCount} driving, ${flyingCount} flying)</div>
      </div>
    </div>
    <div class="stat icon-stat">
      <div class="icon-stat-badge">${icon("wallet")}</div>
      <div>
        <div class="num">${fmtMoney(spent)}</div>
        <div class="lbl">${total ? "of " + fmtMoney(total) + " budget" : "spent so far"}</div>
      </div>
    </div>
    <div class="stat icon-stat">
      <div class="icon-stat-badge">${icon("check")}</div>
      <div>
        <div class="num">${totalDone}/${totalItems}</div>
        <div class="lbl">To-dos done</div>
      </div>
    </div>
  </div>

  <div class="dash-duo">
    <div class="card">
      <div class="row" style="justify-content:space-between; margin-bottom:8px;">
        <p class="section-title" style="margin:0;">Budget</p>
        <button id="goto-budget" style="border:none; background:none; padding:0; color:var(--primary); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;">View all &rarr;</button>
      </div>
      <div class="ring-wrap">
        ${progressRing({
          pct: total ? pct : 0,
          centerText: total ? pct + "%" : "—",
          centerSub: total ? "of budget" : "no budget",
          color: remaining < 0 ? "#D9455F" : "var(--primary)",
          title: "Budget used"
        })}
        <div class="ring-legend">
          <div class="ring-main">${fmtMoney(spent)} spent</div>
          <div class="ring-note">${total ? (remaining < 0 ? fmtMoney(Math.abs(remaining)) + " over budget" : fmtMoney(remaining) + " remaining") : "Set a total budget in the Budget tab"}</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between; margin-bottom:8px;">
        <p class="section-title" style="margin:0;">Shop List</p>
        <button id="goto-shoplist" style="border:none; background:none; padding:0; color:var(--primary); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;">View all &rarr;</button>
      </div>
      <div class="ring-wrap">
        ${progressRing({
          pct: shopPct,
          centerText: shopTotal ? shopPct + "%" : "—",
          centerSub: shopTotal ? shopBought + " of " + shopTotal : "no items",
          title: "Shop list bought"
        })}
        <div class="ring-legend">
          <div class="ring-main">${shopTotal === 0 ? "No items yet" : shopBought + " of " + shopTotal + " bought"}</div>
          <div class="ring-note">${shopTotal === 0 ? "Add items in the Shop list" : (dashboardShopStoreSummary || "Item" + (shopTotal === 1 ? "" : "s") + " to buy")}</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between; margin-bottom:8px;">
      <p class="section-title" style="margin:0;">To-do quick view</p>
      <div class="row" style="gap:10px;">
        <span class="muted">${todoPct}% complete</span>
        <button id="goto-todo" style="border:none; background:none; padding:0; color:var(--primary); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;">View all &rarr;</button>
      </div>
    </div>
    <div class="progress-bar" style="margin-bottom:12px;"><div class="progress-fill" style="width:${todoPct}%;"></div></div>
    ${upcoming.length === 0 ? '<p class="muted">Everything is checked off. Nicely done.</p>' : upcoming.slice(0, 5).map(item => `
      <div class="item-row">
        <span style="flex:2; min-width:150px;">${item.text}</span>
        <span class="muted" style="flex:0 0 100px;">${item.dueDate ? fmtDate(new Date(item.dueDate + "T00:00:00")) : "No deadline"}</span>
        <span class="muted" style="flex:0 0 90px;">${item.assignee || "Unassigned"}</span>
      </div>`).join("")}
  </div>`;
  p.innerHTML = html;
  const gotoLink = document.getElementById("goto-todo");
  if (gotoLink) {
    gotoLink.addEventListener("click", (e) => {
      e.preventDefault();
      goToTab("todo");
    });
  }
  const gotoBudgetLink = document.getElementById("goto-budget");
  if (gotoBudgetLink) {
    gotoBudgetLink.addEventListener("click", (e) => {
      e.preventDefault();
      goToTab("budget");
    });
  }
  const gotoShoplistLink = document.getElementById("goto-shoplist");
  if (gotoShoplistLink) {
    gotoShoplistLink.addEventListener("click", (e) => {
      e.preventDefault();
      goToTab("shoplist");
    });
  }
}

(async function init() {
  const savedItems = await loadKey("wedding-todo-items");
  const savedState = (await loadKey("wedding-checklist")) || {};

  if (savedItems && savedItems.length) {
    todoData = savedItems;
    const migrated = await loadKey("wedding-assignee-reset-done");
    if (!migrated) {
      todoData.forEach(s => s.items.forEach(item => { item.assignee = ""; }));
      await saveKey("wedding-todo-items", todoData);
      await saveKey("wedding-assignee-reset-done", true);
    }
    todoState = savedState;
  } else {
    todoData = TODO_DEFAULTS.map(s => ({
      id: s.id,
      label: s.label,
      items: s.items.map((text, i) => ({id: s.id + "-" + i, text}))
    }));
    todoState = savedState;
    await saveKey("wedding-todo-items", todoData);
  }

  guests = await loadKey("wedding-guests");
  if (!guests || guests.length === 0) {
    guests = GUEST_SEED.map(s => ({id: uid(), ...s}));
    await saveKey("wedding-guests", guests);
  }
  activities = (await loadKey("wedding-activities")) || [];
  timeline = (await loadKey("wedding-timeline")) || [];
  if (timeline.length === 0) {
    timeline = TIMELINE_SEED.map(s => ({id: uid(), ...s}));
    await saveKey("wedding-timeline", timeline);
  }
  timelineSections = (await loadKey("wedding-timeline-sections")) || [];
  if (timelineSections.length === 0) {
    timelineSections = TIMELINE_SECTION_DEFAULTS.map(name => ({id: uid(), name}));
    await saveKey("wedding-timeline-sections", timelineSections);
  }
  helperTags = (await loadKey("wedding-helper-tags")) || [];
  budget = (await loadKey("wedding-budget")) || { total: 0, vendors: [], expenses: [] };
  if (!budget.vendors) budget.vendors = [];
  if (!budget.expenses) budget.expenses = [];
  if (budget.vendors.length === 0) {
    budget.vendors = BUDGET_SEED.map(v => ({id: uid(), ...v}));
    if (!budget.total) budget.total = 50000;
    await saveKey("wedding-budget", budget);
  }
  shopList = (await loadKey("wedding-shop-list")) || [];
  storeOptions = (await loadKey("wedding-store-options")) || [];
  if (storeOptions.length === 0) {
    storeOptions = STORE_DEFAULTS.map(name => ({id: uid(), name}));
    await saveKey("wedding-store-options", storeOptions);
  }

  renderDashboard();
  renderTodo();
  renderGuests();
  renderBudget();
  renderShopList();
  renderActivities();
  renderTimeline();
})();
</script>
</body>
</html>
