<style>
  :root {
    --bg: #F8F7FC;
    --surface: #FFFFFF;
    --ink: #1D1B29;
    --ink-soft: #6F6C81;
    --primary: #6E4CD9;
    --primary-hover: #5D3FC0;
    --primary-light: #EFEAFB;
    --border: #E7E4F1;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 0;
    -webkit-font-smoothing: antialiased;
  }
  /* 12-column grid with 80px side margins. Content occupies the middle 10
     columns, leaving one empty column of breathing room each side. */
  .wrap {
    max-width: none;
    margin: 0;
    padding: 0 80px 28px;
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    column-gap: 20px;
    align-content: start;
  }
  .wrap > * { grid-column: 2 / 12; min-width: 0; }
  @media (max-width: 1024px) {
    .wrap { padding: 0 40px 24px; column-gap: 16px; }
    /* below this the spare columns cost more than they give back */
    .wrap > * { grid-column: 1 / -1; }
  }
  @media (max-width: 768px)  { .wrap { padding: 0 24px 20px; column-gap: 12px; } }
  h1 {
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: 26px;
    margin: 0;
    letter-spacing: -0.4px;
  }
  /* The rule runs full-bleed, but the logo and title sit on the same grid
     as the content so they always line up with it. */
  .app-header {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    column-gap: 20px;
    padding: 20px 80px 18px;
    margin-bottom: 22px;
    border-bottom: 1px solid var(--border);
  }
  .app-header-inner { grid-column: 2 / 12; display: flex; align-items: center; gap: 14px; min-width: 0; }
  .backup-btn { margin-left: auto; flex: 0 0 auto; white-space: nowrap; }
  .backup-btn.saved { background: #E8F6EF; border-color: #C6E7D8; color: #1F7A54; }
  @media (max-width: 1024px) {
    .app-header { padding: 18px 40px 16px; column-gap: 16px; }
    .app-header-inner { grid-column: 1 / -1; }
  }
  @media (max-width: 768px)  { .app-header { padding: 16px 24px 14px; column-gap: 12px; } }
  .app-logo { width: 38px; height: 38px; flex: 0 0 auto; display: block; }
  @media (max-width: 480px) {
    .app-header { padding: 16px 12px 14px; margin-bottom: 18px; }
    .app-header-inner { gap: 10px; }
    .app-logo { width: 32px; height: 32px; }
    h1 { font-size: 21px; }
  }
  .tabs {
    display: flex;
    gap: 2px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
    /* Underline tabs stay on one line; scroll sideways when they overflow. */
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    white-space: nowrap;
    padding: 10px 14px;
    margin-bottom: -1px;
    border-bottom: 2px solid transparent;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink-soft);
    cursor: pointer;
    user-select: none;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab svg { flex: 0 0 auto; opacity: 0.85; }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
  .tab.active svg { opacity: 1; }
  @media (max-width: 480px) {
    .tab { padding: 10px 11px; gap: 6px; }
  }
  .panel { display: none; }
  .panel.active { display: block; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 14px;
    box-shadow: 0 1px 2px rgba(28, 27, 41, 0.03);
  }
  .stat-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat {
    flex: 1;
    min-width: 110px;
    background: var(--primary-light);
    border-radius: 12px;
    padding: 13px 15px;
  }
  .stat .num { font-size: 21px; font-weight: 700; color: var(--primary); letter-spacing: -0.3px; }
  .stat .lbl { font-size: 12px; color: var(--ink-soft); margin-top: 1px; }
  .progress-bar { height: 8px; border-radius: 5px; background: var(--primary-light); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--primary); border-radius: 5px; transition: width 0.3s; }
  .dash-duo { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .dash-duo { grid-template-columns: 1fr; } }
  .dash-hero-row { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; align-items: stretch; }
  @media (max-width: 640px) { .dash-hero-row { grid-template-columns: 1fr; } }
  .ring-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 6px 0 2px; }
  .ring { position: relative; width: 132px; height: 132px; flex: 0 0 auto; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
  .ring .ring-track { stroke: var(--primary-light); }
  .ring .ring-fill { stroke-linecap: round; transition: stroke-dashoffset 0.45s ease; }
  .ring-center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 1px;
  }
  .ring-center .ring-pct { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.05; }
  .ring-center .ring-sub { font-size: 11px; color: var(--ink-soft); }
  .ring-legend { text-align: center; }
  .ring-legend .ring-main { font-size: 15px; font-weight: 600; }
  .ring-legend .ring-note { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  input[type=text], input[type=number], input[type=date], select {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    /* Matches button's min-height so inputs and buttons line up exactly. */
    min-height: 36px;
    font-size: 14px;
    font-family: inherit;
    background: var(--white);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
  }
  input[type=text]:focus, input[type=number]:focus, input[type=date]:focus, select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
  }
  input[type=checkbox] { accent-color: var(--primary); width: 17px; height: 17px; }
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }
  ::placeholder { color: #A6A3B6; }
  button {
    border: 1px solid var(--border);
    background: var(--white);
    color: var(--ink);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    font-family: inherit;
    min-height: 36px;
  }
  button:hover { background: var(--primary-light); border-color: var(--primary); }
  button.primary { background: var(--primary); color: var(--white); border-color: var(--primary); }
  button.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .icon-btn { padding: 6px 10px; border-color: transparent; color: var(--ink-soft); min-height: 32px; }
  .icon-btn:hover { background: var(--primary-light); color: var(--primary); border-color: transparent; }
  @media (max-width: 480px) {
    body { padding: 0; }
    .wrap { padding: 0 12px 16px; }
    .stat-row { gap: 8px; }
    .stat { min-width: 100%; }
    .item-row { gap: 6px; }
  }
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(29, 27, 41, 0.35);
    align-items: center; justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--white);
    border-radius: 14px;
    padding: 22px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 8px 30px rgba(29, 27, 41, 0.18);
  }
  .modal-box h3 { margin: 0 0 14px; font-size: 16px; font-weight: 600; }
  /* Ten of the twelve page columns - the same span .wrap gives its children,
     so the dialog sits exactly over the content width behind it. Mirrors the
     grid's padding and column-gap at each breakpoint. */
  .modal-box.wide-10 {
    width: calc((100vw - 160px - 220px) / 12 * 10 + 180px);
    max-width: calc(100vw - 40px);
    max-height: calc(100vh - 40px);
    overflow-y: auto;
  }
  /* Below 1024 the page gives its children all twelve columns, so the dialog
     follows suit rather than staying at ten and sitting narrower than the
     cards behind it. */
  @media (max-width: 1024px) {
    .modal-box.wide-10 { width: calc(100vw - 80px); }
  }
  @media (max-width: 768px) {
    .modal-box.wide-10 { width: calc(100vw - 48px); }
  }
  @media (max-width: 480px) {
    .modal-box.wide-10 { width: calc(100vw - 24px); }
  }
  .modal-box input[type=text] { width: 100%; margin-bottom: 16px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  #input-modal-title { font-size: 20px; margin-bottom: 20px; }
  #input-modal-field { font-size: 19px; min-height: 52px; padding: 12px 14px; }
  #input-modal .modal-actions button { font-size: 16px; padding: 11px 22px; }
  .field-label { display: block; margin: 14px 0 5px; font-size: 12px; color: var(--ink-soft); font-weight: 500; }
  textarea {
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
    font-size: 14px; font-family: inherit; background: var(--white); color: var(--ink);
    outline: none; width: 100%; resize: vertical; transition: border-color 0.15s;
  }
  textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
  .area-name-link { cursor: pointer; font-weight: 600; }
  .area-name-link:hover { color: var(--primary); text-decoration: underline; }
  .area-cover-banner {
    position: relative; width: 100%; height: 220px; overflow: hidden;
    background: var(--primary-light); cursor: pointer; flex: 0 0 auto;
  }
  .area-cover-banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .area-cover-banner-placeholder {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 8px; color: var(--primary); font-size: 13px; font-weight: 500;
  }
  .area-cover-banner:hover .area-cover-banner-placeholder { color: var(--primary-hover); }
  .area-cover-banner-remove {
    position: absolute; top: 12px; right: 12px; width: 28px; height: 28px;
    min-height: 28px; padding: 0; border-radius: 50%; background: rgba(29,27,41,0.55);
    border: none; color: var(--white); display: flex; align-items: center; justify-content: center;
  }
  .area-cover-banner-remove:hover { background: rgba(29,27,41,0.75); color: var(--white); }
  /* Guest sub-tabs: a lighter, pill-shaped row so they read as a level below
     the main tabs rather than competing with them. */
  .dish-tally { display: flex; gap: 10px; flex-wrap: wrap; }
  /* Muted on purpose: this is a reference total, not a headline like the
     guest counts above it. */
  .dish-count {
    flex: 1 1 110px; min-width: 110px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px;
  }
  .dish-count .num { font-size: 19px; font-weight: 600; color: var(--ink-soft); line-height: 1.1; }
  .dish-count .lbl { font-size: 12px; color: var(--ink-soft); opacity: 0.8; margin-top: 2px; }
  /* A dish that is no longer on the menu but still chosen by someone. */
  .dish-count.off-menu { background: #FDECEF; }
  .dish-count.off-menu .num { color: #B3253C; }
  .subtabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .subtab {
    border: 1px solid var(--border); background: var(--white); color: var(--ink-soft);
    border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 500;
    cursor: pointer; font-family: inherit; min-height: 32px;
  }
  .subtab:hover { color: var(--ink); border-color: var(--primary); background: var(--white); }
  .subtab.active { background: var(--primary); border-color: var(--primary); color: var(--white); font-weight: 600; }
  .nt-col-label { cursor: pointer; border-bottom: 1px dashed transparent; }
  .nt-col-label:hover { border-bottom-color: var(--primary); color: var(--primary); }
  .nt-col-remove { padding: 2px 5px; min-height: 0; font-size: 10px; opacity: 0; transition: opacity 0.12s; }
  th:hover .nt-col-remove { opacity: 1; }
  /* Portrait board, matching the proportions of a printed seating sign. */
  .seat-board-wrap { overflow-x: auto; }
  .seat-board {
    position: relative;
    /* Fills the ten content columns rather than sitting in a narrow strip:
       86 names need the room, and the extra width is what makes a table plan
       legible. Still portrait, so it matches a printed seating sign. */
    width: 100%; min-width: 320px; margin: 0 auto;
    background: var(--white);
    border: 1px solid var(--border); border-radius: 12px;
    background-image: linear-gradient(var(--border) 1px, transparent 1px),
                      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    overflow: hidden;
    touch-action: none;   /* let a drag pan the card, not the page */
  }
  .seat-card {
    position: absolute;
    z-index: 2;   /* above the tables: the plan is backdrop, the names are read */
    background: var(--primary-light); color: var(--primary);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 3px 8px; font-size: 12px; font-weight: 600;
    white-space: nowrap; cursor: grab; user-select: none;
    max-width: 46%; overflow: hidden; text-overflow: ellipsis;
  }
  .seat-card.placed { background: var(--white); border-color: var(--primary); }
  /* Gender drives the card colour so the mix at a table reads at a glance. */
  .seat-card { background: var(--gbg, var(--primary-light)); color: var(--g, var(--primary));
               border-color: color-mix(in srgb, var(--g, var(--primary)) 35%, white); }
  .seat-card.placed { background: var(--gbg, var(--white)); border-color: var(--g, var(--primary)); }
  .seat-card .seat-name { display: block; line-height: 1.15; }
  .seat-meals { display: flex; gap: 2px; justify-content: center; margin-top: 1px; opacity: 0.85; }
  .seat-meals svg { display: block; }
  .seat-card.dragging { cursor: grabbing; box-shadow: 0 6px 18px rgba(29,27,41,0.22); z-index: 5; opacity: 0.95; }
  /* Tables sit under the names: the plan is the backdrop, the names are read. */
  .seat-table { position: absolute; z-index: 1; cursor: grab; touch-action: none; }
  .seat-table svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .seat-table.dragging { cursor: grabbing; }
  .seat-table .seat-table-handle, .seat-table .seat-table-del { display: none; }
  .seat-table.selected { outline: 1.5px dashed var(--primary); outline-offset: 4px; }
  .seat-table.selected .seat-table-handle, .seat-table.selected .seat-table-del { display: block; }
  .seat-table-handle {
    position: absolute; width: 16px; height: 16px; background: var(--primary);
    border: 2px solid var(--white); box-shadow: 0 1px 3px rgba(29,27,41,0.3);
  }
  .seat-table-handle.rotate { border-radius: 50%; top: -22px; left: 50%; transform: translateX(-50%); cursor: grab; }
  .seat-table-del {
    position: absolute; top: -22px; right: -10px; width: 18px; height: 18px; min-height: 0;
    padding: 0; border-radius: 50%; border: none; background: #D9455F; color: #fff;
    font-size: 10px; line-height: 1; cursor: pointer;
  }
  .seat-table-del:hover { background: #B3253C; }
  .seat-table-name {
    position: absolute; top: -22px; right: 14px; width: 18px; height: 18px; min-height: 0;
    padding: 0; border-radius: 50%; border: none; background: var(--primary); color: #fff;
    font-size: 10px; line-height: 1; cursor: pointer; display: none;
  }
  .seat-table.selected .seat-table-name { display: block; }
  .seat-table-name:hover { background: var(--primary-hover); }
  /* Chairs respond only on the selected table, so a click on the plan at rest
     never silently changes the seat count. */
  .seat-table.selected svg { pointer-events: auto; }
  .seat-table.selected .chair-badge:hover circle { stroke: var(--ink); }
  .seat-table-label {
    position: absolute; top: 50%; left: 50%;
    font-size: 11px; font-weight: 700; color: var(--ink);
    white-space: nowrap; pointer-events: none; max-width: 96%;
    overflow: hidden; text-overflow: ellipsis;
  }
  /* The tent: a fixed outline the plan is arranged inside, not a draggable
     object. Sits under everything and ignores pointers entirely. */
  .tent-outline {
    position: absolute; z-index: 0; pointer-events: none;
    border: 2px solid var(--primary); border-radius: 4px;
    background: rgba(110,76,217,0.035);
  }
  .stage-divider {
    position: absolute; left: 0; right: 0; z-index: 0; pointer-events: none;
    border-top: 1px dashed var(--border);
  }
  .stage-divider span {
    position: absolute; top: -8px; left: 12px; padding: 0 6px;
    background: var(--white); color: var(--ink-soft); font-size: 10.5px; font-weight: 600;
  }
  .tent-pole {
    position: absolute; z-index: 0; pointer-events: none;
    transform: translate(-50%, -50%);
    border: 1px dashed #B3253C; border-radius: 50%;
    background: rgba(217,69,95,0.07);
  }
  /* The pole itself, at the centre of the clearance it needs. */
  .tent-pole > span {
    position: absolute; top: 50%; left: 50%; width: 7px; height: 7px;
    transform: translate(-50%, -50%); border-radius: 50%; background: #B3253C;
  }
  .seat-table.clash { outline: 2px solid #D9455F; outline-offset: 3px; }
  .tent-label {
    position: absolute; top: -9px; left: 10px; padding: 0 6px;
    background: var(--white); color: var(--primary);
    font-size: 11px; font-weight: 700; letter-spacing: 0.3px;
  }
  /* Group selection */
  .seat-card.sel { outline: 2px solid var(--primary); outline-offset: 1px; background: var(--primary); color: var(--white); }
  .seat-table.sel { outline: 1.5px dashed var(--primary); outline-offset: 4px; }
  .seat-marquee {
    position: absolute; z-index: 4; pointer-events: none;
    border: 1.5px dashed var(--primary); background: rgba(110,76,217,0.10); border-radius: 3px;
  }
  .icon-plus-btn {
    width: 32px; height: 32px; min-height: 32px; padding: 0; flex: 0 0 auto;
    border-radius: 8px; background: var(--primary); color: var(--white); border-color: var(--primary);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .icon-plus-btn:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .task-text { cursor: pointer; border-bottom: 1px dashed transparent; }
  .task-text:hover { border-bottom-color: var(--primary); color: var(--primary); }
  .switch {
    position: relative;
    display: inline-block;
    width: 42px;
    height: 24px;
    flex: 0 0 auto;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch-track {
    position: absolute; inset: 0;
    background: var(--border);
    border-radius: 24px;
    transition: background 0.15s;
    cursor: pointer;
  }
  .switch-track::before {
    content: '';
    position: absolute;
    height: 18px; width: 18px;
    left: 3px; bottom: 3px;
    background: var(--white);
    border-radius: 50%;
    transition: transform 0.15s;
    box-shadow: 0 1px 3px rgba(28,27,41,0.2);
  }
  .switch input:checked + .switch-track { background: var(--primary); }
  .switch input:checked + .switch-track::before { transform: translateX(18px); }
  .shop-item-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .shop-item-row:first-child { border-top: none; }
  .shop-item-name { cursor: pointer; border-bottom: 1px dashed transparent; flex: 2; min-width: 100px; }
  .shop-item-name:hover { border-bottom-color: var(--primary); color: var(--primary); }
  .link-btn {
    border: none;
    background: none;
    padding: 0;
    color: var(--primary);
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
    font-family: inherit;
  }
  .link-btn:hover { text-decoration: underline; }
  /* Household row and the person rows beneath it share one column track so
     names and dish pickers line up down the page. */
  .guest-row, .person-row {
    display: grid;
    grid-template-columns: minmax(130px, 2fr) 36px 110px 100px minmax(210px, 1.5fr) minmax(110px, 1fr) 32px;
    align-items: center;
    gap: 10px;
    text-align: left;
  }
  .guest-row { padding: 10px 0 8px; }
  .guest-block { border-top: 1px solid var(--border); }
  .guest-block:first-child { border-top: none; }
  .guest-row > *, .person-row > * { text-align: left; justify-self: start; }
  .guest-row select, .person-row select { width: 100%; }
  .guest-dishes { grid-column: 5; display: flex; gap: 6px; width: 100%; min-width: 0; }
  .guest-dishes select { flex: 1 1 0; min-width: 0; }
  .person-row { padding: 4px 0; }
  .person-row > [data-person-name] { grid-column: 1 / 5; width: 100%; }
  .person-row > .gender-cell { grid-column: 6; }
  .person-row > [data-action=remove-person] { grid-column: 7; }
  .gender-cell { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .gender-select { font-size: 12px; font-weight: 600; padding: 4px 6px; min-width: 78px; }
  /* The seat number is derived from the plan, so it reads as a fact rather
     than a field someone can type into. */
  .seat-chip {
    flex: 0 0 auto; font-size: 11px; font-weight: 700; letter-spacing: 0.2px;
    color: var(--primary); background: var(--primary-light);
    border-radius: 10px; padding: 2px 7px; white-space: nowrap;
  }
  .person-add-row { padding: 2px 0 10px; }
  .person-add-row > .link-btn { grid-column: 1 / 5; font-size: 12.5px; }
  /* The add-note button is clutter on the many rows that have no note, but
     hiding it outright would leave no way to add one. */
  .dietary-add { opacity: 0; transition: opacity 0.12s; }
  .guest-block:hover .dietary-add, .dietary-add:focus { opacity: 1; }
  #g-list { overflow-x: auto; }
  #g-list .guest-row, #g-list .person-row { min-width: 760px; }
  .tl-card {
    position: relative;
    transition: box-shadow 0.15s, opacity 0.15s;
  }
  .tl-card.dragging { opacity: 0.4; }
  .tl-card.drag-over-top { border-top: 2px solid var(--primary); margin-top: -2px; }
  .tl-card.drag-over-bottom { border-bottom: 2px solid var(--primary); }
  .tl-handle {
    cursor: grab;
    color: var(--border);
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
    flex: 0 0 auto;
    font-size: 15px;
    line-height: 1;
    padding: 0 2px;
    user-select: none;
  }
  .tl-card:hover .tl-handle { opacity: 1; }
  .tl-handle:hover { color: var(--primary); }
  .tl-handle:active { cursor: grabbing; }
  .tl-fade { opacity: 0; transition: opacity 0.15s; }
  .tl-card:hover .tl-fade { opacity: 1; }
  @keyframes tlPulse {
    0%   { box-shadow: 0 0 0 3px var(--primary); }
    100% { box-shadow: 0 1px 2px rgba(28,27,41,0.03); }
  }
  .tl-card.jumped { animation: tlPulse 0.6s ease-out forwards; }
  .item-row.dragging { opacity: 0.4; }
  .item-row.drag-over-top { border-top: 2px solid var(--primary); margin-top: -2px; }
  .item-row.drag-over-bottom { border-bottom: 2px solid var(--primary); }
  .item-row.jumped { animation: tlPulse 0.6s ease-out forwards; border-radius: 8px; }
  .todo-handle {
    cursor: grab;
    color: var(--border);
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
    flex: 0 0 auto;
    font-size: 15px;
    line-height: 1;
    padding: 0 2px;
    user-select: none;
  }
  .item-row:hover .todo-handle { opacity: 1; }
  .todo-handle:hover { color: var(--primary); }
  .todo-handle:active { cursor: grabbing; }
  .todo-zone { min-height: 6px; }
  .hero-banner {
    background: linear-gradient(135deg, var(--primary) 0%, #8B6FE8 100%);
    border-radius: 16px;
    padding: 24px 26px;
    color: #fff;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .hero-banner::before {
    content: '';
    position: absolute;
    right: -40px; top: -40px;
    width: 160px; height: 160px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
  }
  .hero-banner::after {
    content: '';
    position: absolute;
    right: 30px; bottom: -50px;
    width: 110px; height: 110px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
  }
  .hero-days {
    font-size: 38px;
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1;
    position: relative;
    z-index: 1;
  }
  .hero-sub {
    font-size: 13px;
    opacity: 0.85;
    margin-top: 6px;
    position: relative;
    z-index: 1;
  }
  .icon-stat {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .icon-stat-badge {
    flex: 0 0 auto;
    width: 38px; height: 38px;
    border-radius: 10px;
    background: var(--white);
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 1px 3px rgba(28,27,41,0.06);
  }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .item-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .item-row:last-child { border-bottom: none; }
  .section-title {
    font-family: "Inter", sans-serif;
    font-weight: 600;
    font-size: 15px;
    margin: 0 0 8px;
    color: var(--ink);
  }
  .section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--primary);
    background: var(--primary-light);
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
  }
  .muted { color: var(--ink-soft); font-size: 13px; }
  .strike { color: var(--ink-soft); text-decoration: line-through; }
  /* align-items:center stops the button stretching to the row height while
     the input keeps its intrinsic height, which left them visibly unequal. */
  .add-form { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  /* .modal-box input[type=text] carries a 16px bottom margin for the simple
     input modal; inside an add-form row it just knocks the button out of line. */
  .add-form input[type=text] { margin-bottom: 0; }
  /* selects size from their own content box and come out 1px taller */
  .add-form select { height: 36px; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
  table.data-table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 13.5px; }
  table.data-table th {
    text-align: left; padding: 10px 10px; background: var(--primary-light); color: var(--primary);
    font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.3px;
    white-space: nowrap; position: sticky; top: 0;
  }
  table.data-table td { padding: 6px 8px; border-top: 1px solid var(--border); vertical-align: middle; }
  table.data-table tr:hover td { background: #FBFAFE; }
  /* Add row sits at the foot of the table; the button fills the cell so the
     whole width is a click target, not just the few characters of text. */
  table.data-table tr.add-row td { padding: 0; }
  table.data-table tr.add-row .link-btn {
    display: block; width: 100%; text-align: left;
    padding: 10px 8px; font-size: 13px;
  }
  table.data-table tr.add-row:hover td { background: var(--primary-light); }
  table.data-table input[type=text], table.data-table input[type=number] {
    border: 1px solid transparent; background: transparent; width: 100%; padding: 6px 6px; border-radius: 6px;
  }
  table.data-table input[type=text]:hover, table.data-table input[type=number]:hover { border-color: var(--border); }
  table.data-table input[type=text]:focus, table.data-table input[type=number]:focus { background: var(--white); border-color: var(--primary); }
</style>
</head>

<div class="modal-overlay" id="task-modal">

       440px box wrapped a long note into a tall thin column, and .modal-box
       has no max-height, so the overflow ran off screen with nothing to
       scroll. Capping the height here makes a long note reachable. -->
  <div class="modal-box wide-10">

    <div id="task-view-mode">
      <div class="row" style="justify-content:space-between; align-items:flex-start; margin-bottom:10px;">
        <h3 id="tv-title" style="margin:0; word-break:break-word; flex:1;">Task title</h3>
        <button id="task-edit-btn" style="flex:0 0 auto;">Edit</button>
      </div>
      <div id="tv-image-wrap" style="margin-bottom:12px; display:none;">
        <img id="tv-image" style="width:100%; border-radius:10px; display:block;" />
      </div>
      <p id="tv-body" class="muted" style="white-space:pre-wrap; margin:0 0 14px;"></p>
      <div class="row" style="gap:16px; flex-wrap:wrap; margin-bottom:6px;">
        <div><span class="muted" style="font-size:12px;">Due date</span><br><span id="tv-due" style="font-weight:500;">—</span></div>
        <div><span class="muted" style="font-size:12px;">Assignee</span><br><span id="tv-assignee" style="font-weight:500;">Unassigned</span></div>
      </div>
      <div class="modal-actions" style="margin-top:16px;">
        <button id="task-view-close">Close</button>
      </div>
    </div>

    <div id="task-edit-mode" style="display:none;">
      <h3 style="margin:0 0 14px;">Edit task</h3>
      <label class="muted" style="font-size:12px;">Title</label>
      <input type="text" id="task-modal-title" style="margin-bottom:12px;" />
      <label class="muted" style="font-size:12px;">Notes</label>
      <textarea id="task-modal-body" rows="14" style="width:100%; margin-bottom:12px; border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-family:inherit; font-size:14px; resize:vertical;"></textarea>
      <div class="row" style="gap:10px; margin-bottom:12px;">
        <div style="flex:1;">
          <label class="muted" style="font-size:12px;">Due date</label>
          <input type="date" id="task-modal-due" style="width:100%;" />
        </div>
        <div style="flex:1;">
          <label class="muted" style="font-size:12px;">Assignee</label>
          <select id="task-modal-assignee" style="width:100%;"></select>
        </div>
      </div>
      <label class="muted" style="font-size:12px;">Image</label>
      <div class="row" style="gap:8px; margin-bottom:16px; align-items:center;">
        <input type="file" id="task-modal-image" accept="image/*" style="flex:1;" />
        <button id="task-modal-image-remove" type="button" style="flex:0 0 auto;">Remove</button>
      </div>
      <div id="task-modal-image-preview-wrap" style="margin:-8px 0 16px; display:none;">
        <img id="task-modal-image-preview" style="width:100%; max-height:160px; object-fit:cover; border-radius:10px; display:block;" />
      </div>

      <div style="border-top:1px solid var(--border); padding-top:14px; margin-bottom:16px;">
        <label style="display:flex; align-items:center; gap:10px; cursor:pointer; font-weight:600; font-size:14px;">
          <span class="switch">
            <input type="checkbox" id="task-modal-shop-toggle" />
            <span class="switch-track"></span>
          </span>
          <span id="task-modal-shop-label">Add items to shop list</span>
        </label>
        <div id="task-modal-shop-fields" style="display:none; margin-top:12px;">
          <div class="row" style="font-size:11px; text-transform:uppercase; letter-spacing:0.3px; color:var(--ink-soft); padding:0 0 4px;">
            <span style="flex:2; min-width:100px;">Item Name</span>
            <span style="flex:0 0 60px;">Qty</span>
            <span style="flex:0 0 120px;">Store</span>
            <span style="flex:0 0 28px;"></span>
          </div>
          <div id="task-modal-shop-items"></div>
          <div id="task-modal-shop-add-row" style="margin-top:8px;"></div>
        </div>
      </div>

      <div class="modal-actions">
        <button id="task-modal-cancel">Cancel</button>
        <button class="primary" id="task-modal-save">Save</button>
      </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/docx@9.7.1/dist/index.iife.min.js"></script>
<script>
let inputModalCallback = null;
function openInputModal(title, initialValue, onSave, inputType) {
  document.getElementById("input-modal-title").textContent = title;
  const field = document.getElementById("input-modal-field");
  field.type = inputType || "text";
  field.value = initialValue !== undefined && initialValue !== null ? initialValue : "";
  inputModalCallback = onSave;
  document.getElementById("input-modal").classList.add("open");
  field.focus();
  field.select();
}
function closeInputModal() {
  inputModalCallback = null;
  document.getElementById("input-modal").classList.remove("open");
}
document.getElementById("input-modal-cancel").addEventListener("click", closeInputModal);
document.getElementById("input-modal").addEventListener("click", (e) => {
  if (e.target.id === "input-modal") closeInputModal();
});
document.getElementById("input-modal-save").addEventListener("click", async () => {
  const value = document.getElementById("input-modal-field").value;
  const cb = inputModalCallback;
  closeInputModal();
  if (cb) await cb(value);
});
document.getElementById("input-modal-field").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("input-modal-save").click();
});

let tagsModalMode = "helpers";
function openTagsModal(mode) {
  tagsModalMode = mode === "stores" ? "stores" : "helpers";
  document.getElementById("tags-modal-title").textContent =
    tagsModalMode === "stores" ? "Manage stores" : "Manage tags";
  renderTagsModalList();
  document.getElementById("tags-modal").classList.add("open");
}
function closeTagsModal() {
  document.getElementById("tags-modal").classList.remove("open");
}
function tagsModalItems() {
  return tagsModalMode === "stores" ? storeOptions : helperTags;
}
async function persistTagsModal() {
  if (tagsModalMode === "stores") {
    await saveKey("wedding-store-options", storeOptions);
    await saveKey("wedding-shop-list", shopList);
    renderShopList();
    renderDashboard();
  } else {
    await saveKey("wedding-helper-tags", helperTags);
    await saveKey("wedding-todo-items", todoData);
    renderTodo();
  }
}
function renameTagReferences(oldName, newName) {
  if (tagsModalMode === "stores") {
    shopList.forEach(r => { if (r.store === oldName) r.store = newName; });
  } else {
    todoData.forEach(s => s.items.forEach(i => { if (i.assignee === oldName) i.assignee = newName; }));
  }
}
function clearTagReferences(name) {
  if (tagsModalMode === "stores") {
    shopList.forEach(r => { if (r.store === name) r.store = ""; });
  } else {
    todoData.forEach(s => s.items.forEach(i => { if (i.assignee === name) i.assignee = ""; }));
  }
}
function renderTagsModalList() {
  const list = document.getElementById("tags-modal-list");
  const items = tagsModalItems();
  if (items.length === 0) {
    list.innerHTML = `<p class="muted">${tagsModalMode === "stores" ? "No stores yet." : "No tags yet."}</p>`;
    return;
  }
  list.innerHTML = items.map(t => `
    <div class="item-row">
      <input type="text" autocomplete="off" data-lpignore="true" data-1p-ignore data-form-type="other"
        data-rename-tag="${t.id}" value="${esc(t.name)}" style="flex:1; min-width:120px;" />
      <button class="icon-btn" data-remove-tag-modal="${t.id}" aria-label="Remove ${esc(t.name)}" title="Remove">${TRASH_ICON}</button>
    </div>`).join("");
  list.querySelectorAll("[data-rename-tag]").forEach(inp => {
    inp.addEventListener("change", async (e) => {
      const entry = tagsModalItems().find(t => t.id === e.currentTarget.dataset.renameTag);
      if (!entry) return;
      const next = e.currentTarget.value.trim();
      if (!next || next === entry.name) { e.currentTarget.value = entry.name; return; }
      renameTagReferences(entry.name, next);
      entry.name = next;
      renderTagsModalList();
      await persistTagsModal();
    });
  });
  list.querySelectorAll("[data-remove-tag-modal]").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      const id = e.currentTarget.dataset.removeTagModal;
      const entry = tagsModalItems().find(t => t.id === id);
      if (entry) clearTagReferences(entry.name);
      if (tagsModalMode === "stores") storeOptions = storeOptions.filter(t => t.id !== id);
      else helperTags = helperTags.filter(t => t.id !== id);
      renderTagsModalList();
      await persistTagsModal();
    });
  });
}
document.getElementById("tags-modal-add").addEventListener("click", () => {
  const label = tagsModalMode === "stores" ? "Store name" : "Helper name";
  openInputModal(label, "", (name) => {
    const trimmed = name.trim();
    if (!trimmed) return;
    if (tagsModalMode === "stores") storeOptions.push({id: uid(), name: trimmed});
    else helperTags.push({id: uid(), name: trimmed});
    renderTagsModalList();
    persistTagsModal();
  });
});
document.getElementById("tags-modal-close").addEventListener("click", closeTagsModal);
document.getElementById("tags-modal").addEventListener("click", (e) => {
  if (e.target.id === "tags-modal") closeTagsModal();
});

let editingTask = null;
let pendingImageData = null;

function fillAssigneeSelect(selectEl, currentValue) {
  const options = ["<option value=\"\">Unassigned</option>"]
    .concat(helperTags.map(t => `<option value="${t.name}">${t.name}</option>`))
    .join("");
  selectEl.innerHTML = options;
  selectEl.value = currentValue || "";
}
let storeOptions = [];
function storeSelectOptionsHtml(currentValue) {
  return ["<option value=\"\">No store</option>"]
    .concat(storeOptions.map(s => `<option value="${esc(s.name)}" ${s.name === currentValue ? "selected" : ""}>${esc(s.name)}</option>`))
    .concat(["<option value=\"__add_new__\">+ Add new…</option>", "<option value=\"__manage__\">✎ Manage stores…</option>"])
    .join("");
}
// Handles the "+ Add new…" / "Manage stores…" entries on any store <select>.
// Returns true when the change was one of those actions (caller should stop).
function handleStoreSelectAction(selectEl, previousValue, onPicked) {
  if (selectEl.value === "__add_new__") {
    selectEl.value = previousValue || "";
    openInputModal("Store name", "", (name) => {
      const trimmed = name.trim();
      if (!trimmed) return;
      storeOptions.push({id: uid(), name: trimmed});
      saveKey("wedding-store-options", storeOptions);
      if (onPicked) onPicked(trimmed);
    });
    return true;
  }
  if (selectEl.value === "__manage__") {
    selectEl.value = previousValue || "";
    openTagsModal("stores");
    return true;
  }
  return false;
}
function fillStoreSelect(selectEl, currentValue) {
  selectEl.innerHTML = storeSelectOptionsHtml(currentValue);
  selectEl.value = currentValue || "";
}
document.getElementById("task-modal-shop-toggle").addEventListener("change", (e) => {
  document.getElementById("task-modal-shop-fields").style.display = e.target.checked ? "block" : "none";
});

function showTaskPreview(item) {
  document.getElementById("task-edit-mode").style.display = "none";
  document.getElementById("task-view-mode").style.display = "block";
  document.getElementById("tv-title").textContent = item.text;
  document.getElementById("tv-body").textContent = item.body || "No notes added.";
  document.getElementById("tv-due").textContent = item.dueDate || "Not set";
  document.getElementById("tv-assignee").textContent = item.assignee || "Unassigned";
  const imgWrap = document.getElementById("tv-image-wrap");
  if (item.image) {
    imgWrap.style.display = "block";
    document.getElementById("tv-image").src = item.image;
  } else {
    imgWrap.style.display = "none";
  }
}

// A fixed row count clipped the longer notes, which are usually pasted lists
// with many short lines. Grow to fit the text, up to half the viewport; past
// that the field scrolls itself and the dialog scrolls around it.
function autoGrowNotes(el) {
  if (!el) return;
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight + 2, window.innerHeight * 0.5) + "px";
}

function showTaskEditForm(item) {
  document.getElementById("task-view-mode").style.display = "none";
  document.getElementById("task-edit-mode").style.display = "block";
  document.getElementById("task-modal-title").value = item.text || "";
  const bodyField = document.getElementById("task-modal-body");
  bodyField.value = item.body || "";
  autoGrowNotes(bodyField);
  document.getElementById("task-modal-due").value = item.dueDate || "";
  fillAssigneeSelect(document.getElementById("task-modal-assignee"), item.assignee);
  pendingImageData = item.image || null;
  document.getElementById("task-modal-image").value = "";
  const previewWrap = document.getElementById("task-modal-image-preview-wrap");
  if (pendingImageData) {
    previewWrap.style.display = "block";
    document.getElementById("task-modal-image-preview").src = pendingImageData;
  } else {
    previewWrap.style.display = "none";
  }

  const linkedIds = getShopItemIds(item);
  const shopToggle = document.getElementById("task-modal-shop-toggle");
  const shopFields = document.getElementById("task-modal-shop-fields");
  shopToggle.checked = linkedIds.length > 0;
  shopFields.style.display = linkedIds.length > 0 ? "block" : "none";
  shopAddOpen = false;
  renderShopItemsTable();
  renderShopAddRow();
}

function getShopItemIds(item) {
  if (item.shopItemIds) return item.shopItemIds;
  if (item.shopItemId) return [item.shopItemId];
  return [];
}

let shopItemEditingId = null;
function renderShopItemsTable() {
  const item = getEditingItem();
  const wrap = document.getElementById("task-modal-shop-items");
  if (!item || !wrap) return;
  const ids = getShopItemIds(item);
  const rows = ids.map(id => shopList.find(r => r.id === id)).filter(Boolean);
  if (rows.length === 0) {
    wrap.innerHTML = '<p class="muted" style="font-size:13px; padding:4px 0;">No items yet. Add one below.</p>';
    return;
  }
  wrap.innerHTML = rows.map(row => {
    if (shopItemEditingId === row.id) {
      const storeOpts = storeSelectOptionsHtml(row.store);
      return `<div class="shop-item-row" style="flex-direction:column; align-items:stretch; gap:6px;">
        <div class="row" style="gap:8px;">
          <input type="text" data-shop-edit-field="item" data-shop-edit-id="${row.id}" value="${row.item || ""}" placeholder="Item name" style="flex:2; min-width:100px;" />
          <input type="number" min="1" data-shop-edit-field="qtyNeeded" data-shop-edit-id="${row.id}" value="${row.qtyNeeded || 1}" style="flex:0 0 60px;" />
          <select data-shop-edit-field="store" data-shop-edit-id="${row.id}" style="flex:0 0 120px;">${storeOpts}</select>
          <button class="icon-btn" data-shop-remove-id="${row.id}" aria-label="Remove item">${TRASH_ICON}</button>
        </div>
        <input type="text" data-shop-edit-field="notes" data-shop-edit-id="${row.id}" value="${row.notes || ""}" placeholder="Note" style="width:100%;" />
        <button data-shop-done-id="${row.id}" style="align-self:flex-end;">Done</button>
      </div>`;
    }
    return `<div class="shop-item-row">
      <span class="shop-item-name" data-shop-open-id="${row.id}">${row.item || ""}</span>
      <span class="muted" style="flex:0 0 60px;">${row.qtyNeeded || 1}</span>
      <span class="muted" style="flex:0 0 120px;">${row.store || "\u2014"}</span>
      <button class="icon-btn" data-shop-remove-id="${row.id}" aria-label="Remove item" style="flex:0 0 28px;">${TRASH_ICON}</button>
    </div>`;
  }).join("");

  wrap.querySelectorAll("[data-shop-open-id]").forEach(el => {
    el.addEventListener("click", (e) => {
      shopItemEditingId = e.currentTarget.dataset.shopOpenId;
      renderShopItemsTable();
    });
  });
  wrap.querySelectorAll("[data-shop-done-id]").forEach(el => {
    el.addEventListener("click", () => {
      shopItemEditingId = null;
      renderShopItemsTable();
    });
  });
  wrap.querySelectorAll("[data-shop-remove-id]").forEach(el => {
    el.addEventListener("click", (e) => {
      const id = e.currentTarget.dataset.shopRemoveId;
      removeShopItem(id);
    });
  });
  wrap.querySelectorAll("[data-shop-edit-field]").forEach(el => {
    el.addEventListener("change", (e) => {
      const id = e.currentTarget.dataset.shopEditId;
      const field = e.currentTarget.dataset.shopEditField;
      const row = shopList.find(r => r.id === id);
      if (!row) return;
      if (field === "store" && handleStoreSelectAction(e.currentTarget, row.store, (created) => {
        row.store = created;
        saveKey("wedding-shop-list", shopList);
        renderShopItemsTable();
        renderShopList();
      })) return;
      row[field] = e.currentTarget.value;
      saveKey("wedding-shop-list", shopList);
      renderShopList();
      if (field === "item") renderShopItemsTable();
    });
  });
}

function addShopItemFromModal(name, qty, store, notes) {
  const trimmed = name.trim();
  if (!trimmed) return;
  const item = getEditingItem();
  if (!item) return;
  const newRow = { id: uid(), category: "", item: trimmed, qtyNeeded: qty || 1, store: store || "", notes: (notes || "").trim() };
  shopList.push(newRow);
  const ids = getShopItemIds(item);
  ids.push(newRow.id);
  item.shopItemIds = ids;
  delete item.shopItemId;
  saveKey("wedding-shop-list", shopList);
  saveKey("wedding-todo-items", todoData);
  renderShopItemsTable();
  renderShopList();
}

function removeShopItem(id) {
  const item = getEditingItem();
  shopList = shopList.filter(r => r.id !== id);
  if (item) {
    item.shopItemIds = getShopItemIds(item).filter(x => x !== id);
    delete item.shopItemId;
    saveKey("wedding-todo-items", todoData);
  }
  saveKey("wedding-shop-list", shopList);
  renderShopItemsTable();
  renderShopList();
}

let shopAddOpen = false;
function renderShopAddRow() {
  const wrap = document.getElementById("task-modal-shop-add-row");
  if (!wrap) return;
  if (!shopAddOpen) {
    wrap.innerHTML = `<button class="link-btn" id="shop-add-trigger">+ Add Shop List</button>`;
    document.getElementById("shop-add-trigger").addEventListener("click", () => {
      shopAddOpen = true;
      renderShopAddRow();
    });
    return;
  }
  wrap.innerHTML = `<div style="border-top:1px dashed var(--border); padding-top:8px;">
    <input type="text" id="task-modal-shop-new-item" placeholder="Item name" style="width:100%; margin-bottom:8px;" />
    <div class="row" style="gap:8px; margin-bottom:8px;">
      <input type="number" id="task-modal-shop-new-qty" min="1" value="1" placeholder="Qty" style="flex:1;" />
      <select id="task-modal-shop-new-store" style="flex:1;"></select>
    </div>
    <input type="text" id="task-modal-shop-new-notes" placeholder="Note" style="width:100%; margin-bottom:8px;" />
    <div class="row" style="justify-content:flex-end;">
      <button class="primary" id="task-modal-shop-new-add">Add item</button>
    </div>
  </div>`;
  fillStoreSelect(document.getElementById("task-modal-shop-new-store"), "");
  const input = document.getElementById("task-modal-shop-new-item");
  const qtyInput = document.getElementById("task-modal-shop-new-qty");
  const storeSelect = document.getElementById("task-modal-shop-new-store");
  const notesInput = document.getElementById("task-modal-shop-new-notes");
  storeSelect.addEventListener("change", (e) => {
    handleStoreSelectAction(e.currentTarget, "", (created) => {
      fillStoreSelect(e.currentTarget, created);
    });
  });
  input.focus();
  function trySave() {
    if (!input.value.trim()) { input.focus(); return; }
    addShopItemFromModal(input.value, qtyInput.value, storeSelect.value, notesInput.value);
    input.value = "";
    qtyInput.value = 1;
    storeSelect.value = "";
    notesInput.value = "";
    input.focus();
  }
  document.getElementById("task-modal-shop-new-add").addEventListener("click", trySave);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); trySave(); } });
  qtyInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); trySave(); } });
  storeSelect.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); trySave(); } });
  notesInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); trySave(); } });
}

function getEditingItem() {
  if (!editingTask) return null;
  const section = todoData.find(s => s.id === editingTask.sectionId);
  return section && section.items.find(i => i.id === editingTask.itemId);

function closeTaskEditModal() {
  editingTask = null;

  document.getElementById("task-modal").classList.remove("open");
}

document.getElementById("task-edit-btn").addEventListener("click", () => {

document.getElementById("task-view-close").addEventListener("click", closeTaskEditModal);
document.getElementById("task-modal-cancel").addEventListener("click", () => {

});
document.getElementById("task-modal").addEventListener("click", (e) => {
  if (e.target.id === "task-modal") closeTaskEditModal();

document.getElementById("task-modal-body").addEventListener("input", (e) => autoGrowNotes(e.currentTarget));
document.getElementById("task-modal-image").addEventListener("change", async (e) => {
  const file = e.target.files[0];

  // This used to store the camera file as-is. A single phone photo is several

  try {
    const {dataUrl} = await readAndResizeImage(file);
    pendingImageData = dataUrl;
    const previewWrap = document.getElementById("task-modal-image-preview-wrap");
    previewWrap.style.display = "block";
    document.getElementById("task-modal-image-preview").src = pendingImageData;
  } catch (err) {
    alert("Couldn't use that image. Try a different file.");
  }

document.getElementById("task-modal-image-remove").addEventListener("click", () => {
  pendingImageData = null;
  document.getElementById("task-modal-image").value = "";
  document.getElementById("task-modal-image-preview-wrap").style.display = "none";
});
document.getElementById("task-modal-save").addEventListener("click", async () => {
  if (!editingTask) return;
  const title = document.getElementById("task-modal-title").value.trim();
  if (!title) return;
  const section = todoData.find(s => s.id === editingTask.sectionId);
  const item = section && section.items.find(i => i.id === editingTask.itemId);
  if (item) {

    item.dueDate = document.getElementById("task-modal-due").value;
    item.assignee = document.getElementById("task-modal-assignee").value;
    item.image = pendingImageData || "";
    const newSectionId = moveTaskToDueSection(editingTask.sectionId, editingTask.itemId);
    if (newSectionId !== editingTask.sectionId) todoJumpId = editingTask.itemId;
    saveKey("wedding-todo-items", todoData);
  }
  closeTaskEditModal();
  renderTodo();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && document.getElementById("task-modal").classList.contains("open")) {
    closeTaskEditModal();
  }
});

function goToTab(name) {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));

// One-click backup. Captures the server copy AND this browser's local copy
// separately: when the two disagree - which is exactly how data was lost
// before - keeping both means nothing is thrown away.
async function downloadBackup() {
  const backup = {
    app: "wedding-planner",
    exportedAt: new Date().toISOString(),
    remoteReachable: false,
    remote: {},
    local: {}
  };

  try {
    // Snapshots are copies of these same rows, so they are excluded server-side
    // rather than fetched only to be dropped. Cover images are NOT excluded:
    // this file is the thing you restore from, and a backup missing the photos
    // is not a backup of everything.
    const r = await sbFetch(SUPABASE_URL + "/rest/v1/wedding_store?select=key,value&key=not.like." +
      encodeURIComponent(SNAPSHOT_PREFIX + "*"), { headers: SB_HEADERS });
    if (r.ok) {
      (await r.json()).forEach(row => { backup.remote[row.key] = row.value; });
      backup.remoteReachable = true;
    }
  } catch (e) {
    // offline or project down - the local copy below is then the only record
  }

  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || k.indexOf("wedding-") !== 0) continue;
      try { backup.local[k] = JSON.parse(localStorage.getItem(k)); }
      catch (e) { backup.local[k] = localStorage.getItem(k); }
    }
  } catch (e) {}

  backup.summary = {
    remoteKeys: Object.keys(backup.remote).length,
    localKeys: Object.keys(backup.local).length,
    guests: (backup.remote["wedding-guests"] || backup.local["wedding-guests"] || []).length,
    vendors: ((backup.remote["wedding-budget"] || backup.local["wedding-budget"] || {}).vendors || []).length,
    timeline: (backup.remote["wedding-timeline"] || backup.local["wedding-timeline"] || []).length
  };

  const stamp = new Date().toISOString().slice(0, 10);
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `wedding-planner-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  return backup;
}

document.getElementById("backup-btn").addEventListener("click", async (e) => {
  const btn = e.currentTarget;
  const label = document.getElementById("backup-btn-label");
  btn.disabled = true;
  label.textContent = "Saving…";
  try {
    const b = await downloadBackup();
    label.textContent = b.remoteReachable ? "Saved ✓" : "Saved (local only) ✓";
    btn.classList.add("saved");
  } catch (err) {
    label.textContent = "Failed — try again";
  }
  setTimeout(() => {
    label.textContent = "Back up";
    btn.classList.remove("saved");
    btn.disabled = false;
  }, 2600);
});

function uid() { return Math.random().toString(36).slice(2, 9); }
const TRASH_ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 6V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2"></path></svg>';
function icon(name, size) {

function bindTodoDrag(p) {
  p.querySelectorAll(".item-row[draggable=true]").forEach(row => {
    row.addEventListener("dragstart", (e) => {
      if (["INPUT","SELECT","TEXTAREA","BUTTON"].includes(e.target.tagName)) {
        e.preventDefault();
        return;
      }
      todoDragId = row.dataset.todoId;
      todoDragSection = row.dataset.todoSection;
      row.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", "");
    });
    row.addEventListener("dragend", () => {
      row.classList.remove("dragging");
      p.querySelectorAll(".item-row").forEach(r => r.classList.remove("drag-over-top","drag-over-bottom"));
      todoDragId = null;
      todoDragSection = null;
    });
    row.addEventListener("dragover", (e) => {
      if (!todoDragId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      const rect = row.getBoundingClientRect();
      const mid = rect.top + rect.height / 2;
      row.classList.remove("drag-over-top","drag-over-bottom");
      row.classList.add(e.clientY < mid ? "drag-over-top" : "drag-over-bottom");
    });
    row.addEventListener("dragleave", () => {
      row.classList.remove("drag-over-top","drag-over-bottom");
    });
    row.addEventListener("drop", (e) => {
      if (!todoDragId) return;
      e.preventDefault();
      e.stopPropagation();
      row.classList.remove("drag-over-top","drag-over-bottom");
      if (todoDragId === row.dataset.todoId) return;
      const rect = row.getBoundingClientRect();
      const after = e.clientY >= rect.top + rect.height / 2;
      performTodoMove(todoDragId, todoDragSection, row.dataset.todoSection, row.dataset.todoId, after);
    });
  });
  p.querySelectorAll(".todo-zone").forEach(zone => {
    zone.addEventListener("dragover", (e) => { if (todoDragId) e.preventDefault(); });
    zone.addEventListener("drop", (e) => {
      if (!todoDragId) return;
      if (e.target.closest(".item-row[draggable=true]")) return;
      e.preventDefault();
      performTodoMove(todoDragId, todoDragSection, zone.dataset.todoZone, null, true);
    });
  });
}

function performTodoMove(itemId, fromSectionId, toSectionId, targetItemId, after) {
  const fromSection = todoData.find(s => s.id === fromSectionId);
  if (!fromSection) return;
  const idx = fromSection.items.findIndex(i => i.id === itemId);
  if (idx === -1) return;
  const [moved] = fromSection.items.splice(idx, 1);
  const toSection = todoData.find(s => s.id === toSectionId) || fromSection;
  if (targetItemId) {
    let targetIdx = toSection.items.findIndex(i => i.id === targetItemId);
    if (targetIdx === -1) targetIdx = toSection.items.length;
    const insertAt = Math.max(0, Math.min(after ? targetIdx + 1 : targetIdx, toSection.items.length));
    toSection.items.splice(insertAt, 0, moved);
  } else {
    toSection.items.push(moved);
  }
  todoJumpId = moved.id;
  renderTodo();
  saveKey("wedding-todo-items", todoData);
}

// Removing a guest has to clear their name-tag ticks and seat position too.
// Those live in their own rows keyed by guest id, so without this they linger
// forever, and a future guest could never reuse the id but the row still grows.
async function forgetGuestKeys(keys) {
  let touched = false;
  keys.forEach(k => {
    if (nameTags.done && nameTags.done[k]) { delete nameTags.done[k]; touched = true; }
    if (seating.positions && seating.positions[k]) { delete seating.positions[k]; touched = true; }
  });
  if (!touched) return;
  await saveKey("wedding-nametags", nameTags);
  await saveKey("wedding-seating", seating);
}
// Every id a household occupies: its own, plus each person row under it.
function householdKeys(g) {
  return [g.id].concat((g.people || []).map(pr => pr.id));
}

// Clears ticks and seat positions belonging to guests who no longer exist -
// the residue of deletions made before those were cleaned up at the source.
// Guarded hard: if the guest list failed to load, every key would look like an
// orphan and this would wipe the lot.
async function pruneOrphanGuestData() {
  if (!storeLoadedOk || !Array.isArray(guests) || guests.length === 0) return 0;
  const live = new Set();
  guests.forEach(g => householdKeys(g).forEach(k => live.add(k)));
  const dead = [];
  Object.keys(nameTags.done || {}).forEach(k => { if (!live.has(k)) dead.push(k); });
  Object.keys(seating.positions || {}).forEach(k => { if (!live.has(k) && dead.indexOf(k) === -1) dead.push(k); });
  if (dead.length === 0) return 0;
  await forgetGuestKeys(dead);
  return dead.length;
}

// ---- seat numbers ----------------------------------------------------
// A card's seat is read off the plan rather than typed: whichever numbered
// table it sits nearest, then its position in reading order around that
// table - down the rows, left to right. Arrange the board, get the numbers.
function tableNumberOf(t) {
  const m = /(\d+)/.exec(t.label || "");        // "Table 7", and the "Tabel 3" typo
  return m ? Number(m[1]) : null;
}
function seatAssignments() {
  const out = {};
  if (!seating || !seating.positions) return out;
  const tables = (seating.tables || [])
    .map(t => ({t, n: tableNumberOf(t)}))
    .filter(x => x.n !== null);
  if (!tables.length) return out;

  const people = allGuestPeople();
  const placed = people.filter(p => seating.positions[p.key]);
  const claimed = {};
  placed.forEach(p => {
    const pos = seating.positions[p.key];
    let best = null;
    tables.forEach(({t, n}) => {
      const fp = tableFootprintFt(t);
      // distance in feet, so a wide table does not out-reach a small one
      const dx = (pos.x - t.x) / 100 * BOARD_FT.w;
      const dy = (pos.y - t.y) / 100 * BOARD_FT.h;
      const d = Math.hypot(dx, dy);
      const reach = Math.hypot(fp.w, fp.h) / 2 + 3;   // half-diagonal plus a chair
      if (d <= reach && (!best || d < best.d)) best = {d, t, n};
    });
    if (!best) return;
    (claimed[best.n] = claimed[best.n] || []).push({p, pos, t: best.t});
  });

  Object.keys(claimed).forEach(n => {
    const t = claimed[n][0].t;
    // Numbered the way the plan is read: down the table in rows, left to
    // right within each row. Sorting purely by y would flip a pair whose
    // cards sit a few hundredths of a foot apart, so rows are grouped with a
    // tolerance first - the two seats facing each other are one row.
    const withXY = claimed[n].map(c => ({
      c,
      x: (c.pos.x - t.x) / 100 * BOARD_FT.w,
      y: (c.pos.y - t.y) / 100 * BOARD_FT.h,
    })).sort((a, b) => a.y - b.y);

    const ROW_TOL = 1.2;                       // feet; chairs pair up closer than they stack
    const rows = [];
    withXY.forEach(item => {
      const row = rows[rows.length - 1];
      if (row && Math.abs(item.y - row[0].y) <= ROW_TOL) row.push(item);
      else rows.push([item]);
    });

    let seat = 0;
    rows.forEach(row => {
      row.sort((a, b) => a.x - b.x)
         .forEach(item => { out[item.c.p.key] = `T${n}-${++seat}`; });
    });
  });

  return out;
}

function firstNameOf(n) {
  const t = (n || "").trim();
  return t ? t.split(/\s+/)[0] : "";

// Every named person in the planner: the household's own name plus each
// individual row under it. Rows with no name yet are skipped - they would
// show up as blank cards and blank table rows.
function allGuestPeople() {
  const out = [];
  guests.forEach(g => {
    if ((g.name || "").trim()) {
      out.push({key: g.id, first: firstNameOf(g.name), full: g.name.trim(), household: g.name.trim(),
                isKid: genderOf(g) === "kid", gender: genderOf(g), dishes: g.dishes || []});
    }
    (g.people || []).forEach(pr => {
      if (!(pr.name || "").trim()) return;
      out.push({key: pr.id, first: firstNameOf(pr.name), full: pr.name.trim(), household: (g.name || "").trim(),
                isKid: genderOf(pr) === "kid", gender: genderOf(pr), dishes: pr.dishes || []});
    });
  });
  return out;
}
// The wedding menu. Swapping this list is safe: dishOptionsHtml keeps a pick

const DISHES_PER_GUEST = 2;

function dishIconSvg(dish, size) {
  const d = DISH_ICONS[dish];
  if (!d) return "";
  return `<svg width="${size}" height="${size}" viewBox="0 0 20 20" fill="none" stroke="currentColor"` +
         ` stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
}

function dishOptionsHtml(current) {
  const opts = MENU_DISHES.slice();
  // Keep a choice that is not on the current menu rather than resetting it.
  if (current && opts.indexOf(current) === -1) opts.push(current);
  return ['<option value="">—</option>'].concat(
    opts.map(d => `<option value="${esc(d)}" ${d === current ? "selected" : ""}>${esc(d)}</option>`)
  ).join("");
}

// plusOne was free text with several shapes: "A, B, C", "A (+ B, C)", "A and B".
function parsePlusOneNames(raw) {
  if (!raw) return [];
  const extras = [];
  const stripped = String(raw).replace(/\(([^)]*)\)/g, (m, inner) => {
    extras.push(inner.replace(/^\s*\+\s*/, ""));
    return "";
  });
  const out = [];
  (stripped + "," + extras.join(",")).split(/[,;]+/).forEach(part => {
    part.split(/\s+and\s+/i).forEach(n => {
      const t = n.trim();
      if (t) out.push(t);
    });
  });
  return out;
}

function blankDishes() { return new Array(DISHES_PER_GUEST).fill(""); }

// Builds the per-person rows once, from the old free-text field. The original
// plusOne string is deliberately left in place: if a name parsed wrongly, the
// text it came from is still on record.
function ensureGuestPeople(g) {
  if (!Array.isArray(g.dishes)) g.dishes = blankDishes();
  while (g.dishes.length < DISHES_PER_GUEST) g.dishes.push("");
  let touched = false;
  if (!Array.isArray(g.people)) {
    g.people = parsePlusOneNames(g.plusOne).map(name => ({id: uid(), name, dishes: blankDishes()}));
    touched = true;
  }
  g.people.forEach(pr => {
    if (!Array.isArray(pr.dishes)) pr.dishes = blankDishes();
    while (pr.dishes.length < DISHES_PER_GUEST) pr.dishes.push("");
    // Only fill in a missing flag, never overwrite one - otherwise unticking a
    // seeded name would silently tick itself again on the next render.
    if (pr.isKid === undefined) {
      pr.isKid = KNOWN_KID_NAMES.indexOf(pr.name) !== -1;
      touched = true;
    }
  });
  return touched;
}

// The children identified so far. Used only to pre-tick the Kid boxes the
// first time; after that the ticks in the data are the source of truth.
const KNOWN_KID_NAMES = ["Ethan Gu", "Lingxuan Gu", "Sydney Yang", "Jasper Yi"];

function adultRows() {
  const rows = [];
  guests.forEach(g => {
    const push = (full, isKid) => {
      const name = (full || "").trim();
      if (!name || isKid) return;
      rows.push({first: name.split(/\s+/)[0], full: name, household: g.name || ""});
    };
    push(g.name, false);
    (g.people || []).forEach(pr => push(pr.name, pr.isKid));
  });
  return rows;
}

function exportAdultNames() {
  const rows = adultRows();
  const csv = ["First name,Full name,Household"].concat(
    rows.map(r => [r.first, r.full, r.household]
      .map(v => '"' + String(v).replace(/"/g, '""') + '"').join(","))
  ).join("\n");
  const blob = new Blob(["﻿" + csv], {type: "text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `adult-guest-names-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  return rows.length;
}

// Counts every dish chosen across the whole guest list. Two picks per person,
// so the numbers add up to more than the headcount - they are portions to
// order, which is what a caterer needs.
function dishTally() {
  const counts = {};
  MENU_DISHES.forEach(d => { counts[d] = 0; });
  let chosen = 0, total = 0;
  guests.forEach(g => {
    const seats = [g].concat((g.people || []).filter(p => (p.name || "").trim()));
    if (!(g.name || "").trim()) seats.shift();
    seats.forEach(s => {
      total++;
      const picks = (s.dishes || []).filter(Boolean);
      if (picks.length) chosen++;
      // A dish no longer on the menu is still counted, under its own name,
      // rather than vanishing from the totals.
      picks.forEach(d => { counts[d] = (counts[d] || 0) + 1; });
    });
  });
  return {counts, chosen, total, portions: Object.values(counts).reduce((a, b) => a + b, 0)};
}
