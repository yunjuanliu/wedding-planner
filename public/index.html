// ---------- Guest sub-tab: name tag creation ----------
function ensureNameTagColumns() {
  if (!nameTags || typeof nameTags !== "object") nameTags = {columns: [], done: {}};
  if (!Array.isArray(nameTags.columns)) nameTags.columns = [];
  if (!nameTags.done || typeof nameTags.done !== "object") nameTags.done = {};
  if (nameTags.columns.length === 0) {
    nameTags.columns.push({id: uid(), label: "Name Tag Creation"});
    return true;
  }
  return false;
}

function renderNameTags() {
  const p = document.getElementById("guest-subpanel");
  if (ensureNameTagColumns()) saveKey("wedding-nametags", nameTags);
  const people = allGuestPeople();
  const cols = nameTags.columns;

  const counts = cols.map(c => people.filter(pr => (nameTags.done[pr.key] || {})[c.id]).length);

  let html = `<div class="stat-row">
    <div class="stat"><div class="num">${people.length}</div><div class="lbl">Guests</div></div>
    ${cols.map((c, i) => `<div class="stat"><div class="num">${counts[i]} / ${people.length}</div><div class="lbl">${esc(c.label)}</div></div>`).join("")}
  </div>
  <div class="table-wrap">
    <table class="data-table" style="min-width:${340 + cols.length * 150}px;">
      <thead><tr>
        <th style="min-width:150px;">First name</th>
        ${cols.map(c => `<th style="width:150px; text-align:center;">
            <span class="nt-col-label" data-col-rename="${c.id}" title="Click to rename">${esc(c.label)}</span>
            ${cols.length > 1 ? `<button class="icon-btn nt-col-remove" data-col-remove="${c.id}" aria-label="Remove ${esc(c.label)} column" title="Remove column">&#10005;</button>` : ""}
          </th>`).join("")}
        <th style="width:56px; text-align:center;">
          <button class="icon-plus-btn" id="nt-add-col" aria-label="Add a tracking column" title="Add a tracking column">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
        </th>
      </tr></thead>
      <tbody>`;

  if (people.length === 0) {
    html += `<tr><td colspan="${cols.length + 2}" class="muted" style="padding:12px;">No named guests yet. Add them in the Overview tab.</td></tr>`;
  } else {
    people.forEach(pr => {
      html += `<tr>
        <td><span style="font-weight:600;">${esc(pr.first)}</span>
          ${pr.full !== pr.first ? `<span class="muted" style="font-size:12px;"> ${esc(pr.full.slice(pr.first.length).trim())}</span>` : ""}
          ${pr.isKid ? '<span style="margin-left:6px; background:#FBE9EF; color:#C23568; border-radius:10px; padding:1px 7px; font-size:11px; font-weight:600;">kid</span>' : ""}
        </td>
        ${cols.map(c => `<td style="text-align:center;">
          <input type="checkbox" data-nt-person="${pr.key}" data-nt-col="${c.id}" ${(nameTags.done[pr.key]||{})[c.id] ? "checked" : ""}
            aria-label="${esc(c.label)} for ${esc(pr.full)}" style="width:16px; height:16px;" />
        </td>`).join("")}
        <td></td>
      </tr>`;
    });
  }
  html += `</tbody></table></div>`;
  p.innerHTML = html;

  p.querySelectorAll("[data-nt-person]").forEach(cb => {
    cb.addEventListener("change", async (e) => {
      const key = e.currentTarget.dataset.ntPerson, col = e.currentTarget.dataset.ntCol;
      if (!nameTags.done[key]) nameTags.done[key] = {};
      if (e.currentTarget.checked) nameTags.done[key][col] = true;
      else delete nameTags.done[key][col];
      await saveKey("wedding-nametags", nameTags);
      // Only the counters need refreshing; a full re-render here would drop
      // the focus ring while ticking down a column.
      renderNameTagCounts();
    });
  });
  document.getElementById("nt-add-col").addEventListener("click", () => {
    openInputModal("New column name", "", async (raw) => {
      const label = raw.trim();
      if (!label) return;
      nameTags.columns.push({id: uid(), label});
      await saveKey("wedding-nametags", nameTags);
      renderNameTags();
    });
  });
  p.querySelectorAll("[data-col-rename]").forEach(el => {
    el.addEventListener("click", () => {
      const col = nameTags.columns.find(c => c.id === el.dataset.colRename);
      if (!col) return;
      openInputModal("Column name", col.label, async (raw) => {
        const label = raw.trim();
        if (!label) return;
        col.label = label;
        await saveKey("wedding-nametags", nameTags);
        renderNameTags();
      });
    });
  });
  p.querySelectorAll("[data-col-remove]").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      const id = e.currentTarget.dataset.colRemove;
      const col = nameTags.columns.find(c => c.id === id);
      const ticked = allGuestPeople().filter(pr => (nameTags.done[pr.key] || {})[id]).length;
      if (ticked && !confirm(`Remove the "${col.label}" column? ${ticked} tick${ticked === 1 ? "" : "s"} will be lost.`)) return;
      nameTags.columns = nameTags.columns.filter(c => c.id !== id);
      Object.keys(nameTags.done).forEach(k => { delete nameTags.done[k][id]; });
      await saveKey("wedding-nametags", nameTags);
      renderNameTags();
    });
  });
}
// Refreshes just the counter row, so ticking a box does not rebuild the table.
function renderNameTagCounts() {
  const people = allGuestPeople();
  const stats = document.querySelectorAll("#guest-subpanel .stat-row .stat");
  nameTags.columns.forEach((c, i) => {
    const el = stats[i + 1];
    if (el) el.querySelector(".num").textContent =
      people.filter(pr => (nameTags.done[pr.key] || {})[c.id]).length + " / " + people.length;
  });
}

// ---------- Guest sub-tab: find your seat ----------
// Drawn as SVG so a table stays sharp at any scale. Width is a percentage of
// the board and the height follows the viewBox, so one number scales a table.
// The board is a scale drawing, not an arbitrary canvas. One board width is
// BOARD_FT.w feet, and because the board's aspect ratio matches those feet
// exactly, a foot is the same number of pixels horizontally and vertically -
// so a table sized as a percentage of board width comes out true to scale in
// both axes with no further maths.
const TENT_FT  = {w: 30, h: 45};          // the tent itself
// The board is the tent plus a 3ft margin, then a staging strip underneath.
// Unplaced names used to stack over the tent and hide the very plan they are
// being arranged into; they now wait below it until dragged in.
const BOARD_FT = {w: 36, h: 63};          // h is recomputed per render
const TENT_TOP_FT = 3;
const STAGE_TOP_FT = TENT_TOP_FT + TENT_FT.h + 2;   // 2ft clear below the tent
const STAGE_ROW_FT = 1.3;
// Centre poles on the long axis at the third points, which is how a 30x45
// pole tent is rigged: dead centre across the width, 15ft and 30ft down the
// length, splitting it into three bays. POLE_CLEAR_FT is the footprint to
// keep clear around each - the pole itself plus its base plate.
const TENT_POLES_FT = [
  {x: TENT_FT.w / 2, y: TENT_FT.h / 3},
  {x: TENT_FT.w / 2, y: TENT_FT.h * 2 / 3},
];
const POLE_CLEAR_FT = 3;
// The strip has to fit however many guests there are: at a fixed height the
// last rows were clipped by the board's overflow and those names became
// unreachable. Recomputed each render, and the board's aspect ratio is set
// from it so a foot stays square whatever the height works out to be.
function boardHeightFt(peopleCount) {
  const rows = Math.ceil(Math.max(peopleCount, 1) / SEAT_TRAY_COLS);
  return Math.round((STAGE_TOP_FT + rows * STAGE_ROW_FT + 2) * 10) / 10;
}

// Real footprints in feet, table plus the chairs pulled up to it. A banquet
// table is 2.5ft deep and a chair needs about 1.5ft, so an 8ft rectangle
// occupies 8 x 5.5ft of floor.
const TABLE_TYPES = [
  {id: "rect8",   label: "8' rectangle - up to 10 seats", ftH: 5.5, tableW: 8, tableD: 2.5, seatsPerSide: 4, ends: true},
  {id: "rect6",   label: "6' rectangle - up to 8 seats",  ftH: 5.5, tableW: 6, tableD: 2.5, seatsPerSide: 3, ends: true},
  {id: "rect4",   label: "4' rectangle - up to 6 seats",  ftH: 5.5, tableW: 4, tableD: 2.5, seatsPerSide: 2, ends: true},
  {id: "round60", label: '60" round - 8 seats',           ftW: 8, ftH: 8, round: true, dia: 5, seats: 8},
  {id: "round48", label: '48" round - 6 seats',           ftW: 7, ftH: 7, round: true, dia: 4, seats: 6},
  {id: "head8",   label: "8' head table - 4 seats",       ftW: 8, ftH: 4, tableW: 8, tableD: 2.5, seatsPerSide: 4, oneSided: true},
];
const CHAIR_FT = 1.5;
// Chair indices: along the top edge, then the bottom, then the two ends.
// Stable, so a removal survives re-renders.
function endIndices(type) {
  if (!type.ends) return [];
  const n = type.seatsPerSide;
  return [n * 2, n * 2 + 1];
}
// End seats start off: an 8ft table normally seats 8, and turning them on is
// what takes it to 10. Tables saved before end seats existed get the same
// treatment, so an existing plan does not silently gain seats and grow.
function normalizeTableChairs(t) {
  if (!Array.isArray(t.noChairs)) t.noChairs = endIndices(tableTypeById(t.type)).slice();
  return t;
}
// Footprint in feet, which changes with the end seats: an 8ft table is 8ft of
// floor, or 11ft once someone is sitting at each end.
function tableFootprintFt(t) {
  const type = tableTypeById(t.type);
  if (type.round) return {w: type.ftW, h: type.ftH};
  const rem = t.noChairs || [];
  const [li, ri] = endIndices(type);
  const left  = type.ends && rem.indexOf(li) === -1 ? CHAIR_FT : 0;
  const right = type.ends && rem.indexOf(ri) === -1 ? CHAIR_FT : 0;
  return {w: type.tableW + left + right, h: type.ftH, left: left, right: right};
}
// Percentage of board width, which is what the element is sized in.
function tableWidthPct(t) { return (tableFootprintFt(t).w / BOARD_FT.w) * 100; }
function tableTypeById(id) { return TABLE_TYPES.find(t => t.id === id) || TABLE_TYPES[0]; }

// focused = this table is selected. In focus mode every seat carries a badge:
// a cross to take it away, a plus where one has been taken away to put it
// back. Out of focus a removed seat is simply not drawn, so the plan reads as
// the room will actually be laid out.
function tableSvg(t, focused) {
  const type = tableTypeById(t.type);
  const rem = t.noChairs || [];
  const U = 10, C = CHAIR_FT * U;
  const S = "stroke='#3A3A3A' fill='#FFFFFF' stroke-width='2' vector-effect='non-scaling-stroke'";
  const r = 3;
  const gone = i => rem.indexOf(i) !== -1;

  // A seat, plus its badge when the table has focus.
  const parts = [];
  const seat = (i, shape) => {
    if (gone(i) && !focused) return;
    const off = gone(i);
    const style = off ? "stroke='#C9C4DA' fill='none' stroke-width='1.5' stroke-dasharray='3 3' vector-effect='non-scaling-stroke'" : S;
    parts.push(shape(style));
    if (!focused) return;
    const [bx, by] = shape.centre;
    const R = 4.6;
    parts.push(`<g class="chair-badge" data-chair="${i}" style="cursor:pointer;">` +
      `<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="${R}" fill="${off ? "#2E9E6B" : "#D9455F"}" stroke="#FFFFFF" stroke-width="1.4" vector-effect="non-scaling-stroke"/>` +
      (off
        ? `<path d="M${(bx-2.3).toFixed(1)} ${by.toFixed(1)}h4.6M${bx.toFixed(1)} ${(by-2.3).toFixed(1)}v4.6" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`
        : `<path d="M${(bx-1.9).toFixed(1)} ${(by-1.9).toFixed(1)}l3.8 3.8M${(bx+1.9).toFixed(1)} ${(by-1.9).toFixed(1)}l-3.8 3.8" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`) +
      `</g>`);
  };

  if (type.round) {
    const W = type.ftW * U, H = type.ftH * U;
    const R = (type.dia / 2) * U, cx = W / 2, cy = H / 2;
    for (let i = 0; i < type.seats; i++) {
      const a = (i / type.seats) * Math.PI * 2 - Math.PI / 2;
      const cr = R + C * 0.62;
      const x = cx + Math.cos(a) * cr, y = cy + Math.sin(a) * cr;
      const sh = (style) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(C/2).toFixed(1)}" ${style}/>`;
      sh.centre = [x, y];
      seat(i, sh);
    }
    return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${parts.join("")}` +
           `<circle cx="${cx}" cy="${cy}" r="${R}" ${S}/></svg>`;
  }

  const fp = tableFootprintFt(t);
  const W = fp.w * U, H = type.ftH * U;
  const bodyW = type.tableW * U, bodyD = type.tableD * U;
  const bx = (fp.left || 0) * U, by = (H - bodyD) / 2;
  const n = type.seatsPerSide;

  for (let i = 0; i < n; i++) {
    const x = bx + (bodyW / n) * i + (bodyW / n - C) / 2;
    const top = (style) => `<rect x="${x.toFixed(1)}" y="${(by - C).toFixed(1)}" width="${C}" height="${C}" rx="${r}" ${style}/>`;
    top.centre = [x + C/2, by - C/2];
    seat(i, top);
    if (!type.oneSided) {
      const bot = (style) => `<rect x="${x.toFixed(1)}" y="${(by + bodyD).toFixed(1)}" width="${C}" height="${C}" rx="${r}" ${style}/>`;
      bot.centre = [x + C/2, by + bodyD + C/2];
      seat(n + i, bot);
    }
  }
  if (type.ends) {
    const [li, ri] = endIndices(type);
    const ey = by + (bodyD - C) / 2;
    const lx = bx - C;
    const left = (style) => `<rect x="${lx.toFixed(1)}" y="${ey.toFixed(1)}" width="${C}" height="${C}" rx="${r}" ${style}/>`;
    left.centre = [lx + C/2, ey + C/2];
    seat(li, left);
    const rx2 = bx + bodyW;
    const right = (style) => `<rect x="${rx2.toFixed(1)}" y="${ey.toFixed(1)}" width="${C}" height="${C}" rx="${r}" ${style}/>`;
    right.centre = [rx2 + C/2, ey + C/2];
    seat(ri, right);
  }
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${parts.join("")}` +
         `<rect x="${bx}" y="${by}" width="${bodyW}" height="${bodyD}" rx="${r}" ${S}/></svg>`;
}
// Chairs actually available at a table, after any have been clicked off.
function tableSeatCount(t) {
  const type = tableTypeById(t.type);
  const total = type.round ? type.seats
              : type.seatsPerSide * (type.oneSided ? 1 : 2) + endIndices(type).length;
  return total - ((t.noChairs || []).length);
}

// Positions are percentages of the board, not pixels, so a layout arranged on
// a laptop still reads correctly on a phone.
// Unplaced names wait in the staging strip below the tent, eight across.
const SEAT_TRAY_COLS = 8;
function seatDefaultPos(index) {
  const col = index % SEAT_TRAY_COLS, row = Math.floor(index / SEAT_TRAY_COLS);
  return {x: 2 + col * 12.2,
          y: ((STAGE_TOP_FT + row * STAGE_ROW_FT) / BOARD_FT.h) * 100,
          placed: false};
}
function seatPos(key, index) {
  const saved = seating.positions[key];
  if (saved && typeof saved.x === "number" && typeof saved.y === "number") {
    return {x: saved.x, y: saved.y, placed: true};
  }
  return seatDefaultPos(index);
}

let seatSel = new Set();   // ids like c:<guestKey> / t:<tableId>
function renderSeating() {
  const p = document.getElementById("guest-subpanel");
  if (!seating || typeof seating !== "object") seating = {positions: {}, tables: []};
  if (!seating.positions) seating.positions = {};
  if (!Array.isArray(seating.tables)) seating.tables = [];
  seating.tables.forEach(normalizeTableChairs);
  const people = allGuestPeople();
  const seatLabels = seatAssignments();
  BOARD_FT.h = boardHeightFt(people.length);
  const placed = people.filter(pr => seating.positions[pr.key]).length;

  p.innerHTML = `
  <div class="row" style="justify-content:space-between; margin-bottom:10px; gap:10px;">
    <span class="muted" style="font-size:13px;">
      <strong id="seat-placed">${placed}</strong> of ${people.length} placed &middot; drag a name anywhere on the board
      <span id="seat-selinfo" style="color:var(--primary); font-weight:600; margin-left:6px;"></span>
      <span id="seat-poleclash" style="display:none; color:#B3253C; font-weight:600; margin-left:8px;"></span>
    </span>
    <div class="row" style="gap:8px;">
      <select id="seat-table-type" style="min-width:150px;">
        ${TABLE_TYPES.map(t => `<option value="${t.id}">${esc(t.label)}</option>`).join("")}
      </select>
      <button id="seat-add-table">+ Add table</button>
      <button id="seat-reset">Reset layout</button>
    </div>
  </div>
  <div class="seat-board-wrap">
    <div class="seat-board" id="seat-board" style="aspect-ratio:${BOARD_FT.w} / ${BOARD_FT.h}; background-size:${(100/BOARD_FT.w).toFixed(4)}% ${(100/BOARD_FT.h).toFixed(4)}%;">
      <div class="tent-outline" style="
        left:${((BOARD_FT.w - TENT_FT.w) / 2 / BOARD_FT.w * 100).toFixed(3)}%;
        top:${(TENT_TOP_FT / BOARD_FT.h * 100).toFixed(3)}%;
        width:${(TENT_FT.w / BOARD_FT.w * 100).toFixed(3)}%;
        height:${(TENT_FT.h / BOARD_FT.h * 100).toFixed(3)}%;">
        <span class="tent-label">${TENT_FT.w}' &times; ${TENT_FT.h}' tent</span>
        ${TENT_POLES_FT.map((pole, i) => `<div class="tent-pole" data-pole="${i}" title="Tent pole - keep clear"
          style="left:${(pole.x / TENT_FT.w * 100).toFixed(3)}%; top:${(pole.y / TENT_FT.h * 100).toFixed(3)}%;
                 width:${(POLE_CLEAR_FT / TENT_FT.w * 100).toFixed(3)}%;
                 height:${(POLE_CLEAR_FT / TENT_FT.h * 100).toFixed(3)}%;"><span></span></div>`).join("")}
      </div>
      <div class="stage-divider" style="top:${((STAGE_TOP_FT - 1) / BOARD_FT.h * 100).toFixed(3)}%;">
        <span>Not seated yet - drag into the tent</span>
      </div>
      ${(seating.tables || []).map(t => {
        normalizeTableChairs(t);
        const type = tableTypeById(t.type);
        const focused = seatSel.size === 1 && seatSel.has("t:" + t.id);
        return `<div class="seat-table${seatSel.size === 1 && seatSel.has("t:" + t.id) ? " selected" : ""}${seatSel.has("t:" + t.id) ? " sel" : ""}" data-table-id="${t.id}"
          style="left:${t.x}%; top:${t.y}%; width:${tableWidthPct(t).toFixed(3)}%; transform:translate(-50%,-50%) rotate(${t.rot || 0}deg);">
          ${tableSvg(t, focused)}
          ${t.label ? `<span class="seat-table-label" style="transform:translate(-50%,-50%) rotate(${-(t.rot || 0)}deg);">${esc(t.label)}</span>` : ""}
          <span class="seat-table-handle rotate" data-handle="rotate" title="Drag to rotate"></span>
          <button class="seat-table-name" data-table-label="${t.id}" title="Name this table" aria-label="Name this table">&#9998;</button>
          <button class="seat-table-del" data-table-del="${t.id}" title="Remove table" aria-label="Remove table">&#10005;</button>
        </div>`;
      }).join("")}
      ${people.map((pr, i) => {
        const pos = seatPos(pr.key, i);
        const gm = genderMeta(pr.gender);
        const icons = (pr.dishes || []).filter(Boolean).map(d => dishIconSvg(d, 11)).join("");
        const seat = seatLabels[pr.key];
        return `<div class="seat-card${pos.placed ? " placed" : ""}${seatSel.has("c:" + pr.key) ? " sel" : ""}"
          data-seat-key="${pr.key}" style="left:${pos.x}%; top:${pos.y}%; --g:${gm.color}; --gbg:${gm.bg};"
          title="${esc(pr.full)}${seat ? " - " + seat : ""}${pr.household && pr.household !== pr.full ? " - " + esc(pr.household) : ""}${(pr.dishes||[]).filter(Boolean).length ? " - " + esc((pr.dishes||[]).filter(Boolean).join(", ")) : ""}">
          <span class="seat-name">${esc(pr.first)}</span>
          ${icons ? `<span class="seat-meals">${icons}</span>` : ""}
        </div>`;
      }).join("")}
    </div>
  </div>
  <p class="muted" style="font-size:12px; margin-top:8px;">
    Drag a name onto the board to seat it. Drag across empty board to select several at once, or shift-click to add and remove
    individual ones, then drag any of them to move the whole group. Select a table to rotate it and to show its seat controls - a red cross takes a seat away, a green plus puts one back, including the two end seats. Use ✎ to name it. Tables are drawn to scale and cannot be resized.
    <strong>${navigator.platform.indexOf("Mac") === 0 ? "⌘Z" : "Ctrl+Z"}</strong> undoes the last change on this board
    (<strong>${navigator.platform.indexOf("Mac") === 0 ? "⇧⌘Z" : "Ctrl+Y"}</strong> redoes).
    With tables selected: <strong>${navigator.platform.indexOf("Mac") === 0 ? "⌘C / ⌘V" : "Ctrl+C / Ctrl+V"}</strong> to copy and paste,
    <strong>Delete</strong> to remove, <strong>Esc</strong> to deselect.
  </p>`;

  const board = document.getElementById("seat-board");
  const save = () => saveKey("wedding-seating", seating);

  // A table over a pole is the one mistake this plan exists to prevent, so it
  // is called out rather than left to the eye. Measured from the rendered
  // boxes, which already account for rotation.
  function flagPoleClashes() {
    const poles = [...board.querySelectorAll(".tent-pole")].map(p => p.getBoundingClientRect());
    let clashes = 0;
    board.querySelectorAll(".seat-table").forEach(el => {
      const r = el.getBoundingClientRect();
      const hit = poles.some(p => r.left < p.right && r.right > p.left && r.top < p.bottom && r.bottom > p.top);
      el.classList.toggle("clash", hit);
      if (hit) clashes++;
    });
    const warn = document.getElementById("seat-poleclash");
    if (warn) {
      warn.textContent = clashes ? `${clashes} table${clashes === 1 ? "" : "s"} sitting on a tent pole` : "";
      warn.style.display = clashes ? "" : "none";
    }
    return clashes;
  }
  flagPoleClashes();
  const selId = (kind, id) => kind + ":" + id;
  const elFor = (sid) => {
    const [kind, id] = [sid.slice(0, 1), sid.slice(2)];
    return kind === "c" ? board.querySelector(`[data-seat-key="${id}"]`)
                        : board.querySelector(`[data-table-id="${id}"]`);
  };
  const paintSelection = () => {
    board.querySelectorAll(".seat-card, .seat-table").forEach(el => {
      const sid = el.dataset.seatKey ? selId("c", el.dataset.seatKey) : selId("t", el.dataset.tableId);
      el.classList.toggle("sel", seatSel.has(sid));
    });
    // Rotate/scale handles only make sense on exactly one table.
    const onlyTable = seatSel.size === 1 && [...seatSel][0].startsWith("t:");
    board.querySelectorAll(".seat-table").forEach(el => {
      el.classList.toggle("selected", onlyTable && seatSel.has(selId("t", el.dataset.tableId)));
    });
    const bar = document.getElementById("seat-selinfo");
    if (bar) bar.textContent = seatSel.size > 1 ? `${seatSel.size} selected - drag to move together` : "";
  };
  paintSelection();

  let mode = null, start = null, marquee = null, moved = false;

  const boundsFor = (el, sid, r) => {
    // Cards are positioned by their top-left, tables by their centre.
    if (sid.startsWith("t:")) return {minX: 0, maxX: 100, minY: 0, maxY: 100};
    return {minX: 0, maxX: 100 - (el.offsetWidth / r.width) * 100,
            minY: 0, maxY: 100 - (el.offsetHeight / r.height) * 100};
  };

  board.addEventListener("pointerdown", (e) => {
    if (e.target.closest("[data-table-del]") || e.target.closest("[data-table-label]")) return;
    // Chairs are only interactive on the selected table, and a click on one
    // toggles it rather than starting a drag.
    if (e.target.closest(".chair-badge")) return;
    const handle = e.target.closest("[data-handle]");
    const item = e.target.closest(".seat-card, .seat-table");
    const r = board.getBoundingClientRect();
    moved = false;

    if (handle && item) {
      // Single-table rotate / resize.
      const t = seating.tables.find(x => x.id === item.dataset.tableId);
      if (!t) return;
      e.preventDefault();
      const cr = item.getBoundingClientRect();
      const cx = cr.left + cr.width / 2, cy = cr.top + cr.height / 2;
      mode = handle.dataset.handle;
      start = {el: item, t, cx, cy, rot: t.rot || 0, pre: seatSnapshot(),
               ang: Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI};
      board.setPointerCapture(e.pointerId);
      return;
    }

    if (item) {
      const sid = item.dataset.seatKey ? selId("c", item.dataset.seatKey) : selId("t", item.dataset.tableId);
      const additive = e.shiftKey || e.metaKey || e.ctrlKey;
      if (additive) {
        if (seatSel.has(sid)) seatSel.delete(sid); else seatSel.add(sid);
      } else if (!seatSel.has(sid)) {
        seatSel.clear();
        seatSel.add(sid);
      }
      paintSelection();
      if (!seatSel.has(sid)) return;   // shift-click that removed it: nothing to drag
      e.preventDefault();
      // Snapshot every selected item, so the whole group moves as one.
      const items = [...seatSel].map(id => {
        const el = elFor(id);
        if (!el) return null;
        return {id, el, x: parseFloat(el.style.left) || 0, y: parseFloat(el.style.top) || 0,
                b: boundsFor(el, id, r)};
      }).filter(Boolean);
      mode = "move";
      start = {r, px: e.clientX, py: e.clientY, items, pre: seatSnapshot()};
      items.forEach(it => it.el.classList.add("dragging"));
      board.setPointerCapture(e.pointerId);
      return;
    }

    // Empty board: rubber-band select.
    e.preventDefault();
    if (!(e.shiftKey || e.metaKey || e.ctrlKey)) { seatSel.clear(); paintSelection(); }
    mode = "marquee";
    start = {r, x0: e.clientX - r.left, y0: e.clientY - r.top};
    marquee = document.createElement("div");
    marquee.className = "seat-marquee";
    board.appendChild(marquee);
    board.setPointerCapture(e.pointerId);
  });

  board.addEventListener("pointermove", (e) => {
    if (!mode) return;
    moved = true;
    if (mode === "move") {
      const r = start.r;
      let dx = ((e.clientX - start.px) / r.width) * 100;
      let dy = ((e.clientY - start.py) / r.height) * 100;
      // Clamp the shared delta so no member of the group leaves the board.
      start.items.forEach(it => {
        dx = Math.max(it.b.minX - it.x, Math.min(dx, it.b.maxX - it.x));
        dy = Math.max(it.b.minY - it.y, Math.min(dy, it.b.maxY - it.y));
      });
      start.items.forEach(it => {
        it.el.style.left = (it.x + dx) + "%";
        it.el.style.top = (it.y + dy) + "%";
      });
    } else if (mode === "rotate") {
      const a = Math.atan2(e.clientY - start.cy, e.clientX - start.cx) * 180 / Math.PI;
      let next = start.rot + (a - start.ang);
      // Snap to the square angles, which is what a floor plan almost always wants.
      const near = Math.round(next / 15) * 15;
      if (Math.abs(next - near) < 4) next = near;
      start.t.rot = Math.round(next * 10) / 10;
      start.el.style.transform = `translate(-50%,-50%) rotate(${start.t.rot}deg)`;
    } else if (mode === "marquee") {
      const r = start.r;
      const x = Math.max(0, Math.min(e.clientX - r.left, r.width));
      const y = Math.max(0, Math.min(e.clientY - r.top, r.height));
      marquee.style.left = Math.min(start.x0, x) + "px";
      marquee.style.top = Math.min(start.y0, y) + "px";
      marquee.style.width = Math.abs(x - start.x0) + "px";
      marquee.style.height = Math.abs(y - start.y0) + "px";
    }
  });

  const endDrag = async (e) => {
    if (!mode) return;
    const finished = mode;
    mode = null;
    try { board.releasePointerCapture(e.pointerId); } catch (err) {}

    if (finished === "move") {
      // Only a drag that moved is worth an undo entry; a plain click to select
      // would otherwise fill the history with no-ops.
      if (moved) seatPushUndo(start.pre);
      start.items.forEach(it => {
        it.el.classList.remove("dragging");
        const x = parseFloat(it.el.style.left) || 0, y = parseFloat(it.el.style.top) || 0;
        if (it.id.startsWith("t:")) {
          const t = seating.tables.find(x2 => x2.id === it.id.slice(2));
          if (t) { t.x = x; t.y = y; }
        } else {
          it.el.classList.add("placed");
          seating.positions[it.id.slice(2)] = {x, y};
        }
      });
      const el = document.getElementById("seat-placed");
      if (el) el.textContent = allGuestPeople().filter(pr => seating.positions[pr.key]).length;
      flagPoleClashes();
      await save();
    } else if (finished === "marquee") {
      const mr = marquee.getBoundingClientRect();
      // A click with no drag should not select the whole board.
      if (moved && mr.width > 3 && mr.height > 3) {
        board.querySelectorAll(".seat-card, .seat-table").forEach(el => {
          const b = el.getBoundingClientRect();
          const hit = b.left < mr.right && b.right > mr.left && b.top < mr.bottom && b.bottom > mr.top;
          if (hit) seatSel.add(el.dataset.seatKey ? selId("c", el.dataset.seatKey) : selId("t", el.dataset.tableId));
        });
      }
      marquee.remove();
      marquee = null;
      paintSelection();
    } else {
      if (moved && start && start.pre) seatPushUndo(start.pre);
      flagPoleClashes();
      await save();
    }
  };
  board.addEventListener("pointerup", endDrag);
  board.addEventListener("pointercancel", endDrag);

  board.querySelectorAll(".seat-table.selected .chair-badge").forEach(ch => {
    ch.addEventListener("click", async (e) => {
      e.stopPropagation();
      const el = e.currentTarget.closest(".seat-table");
      const t = seating.tables.find(x => x.id === el.dataset.tableId);
      if (!t) return;
      const i = Number(e.currentTarget.dataset.chair);
      seatPushUndo();
      t.noChairs = t.noChairs || [];
      const at = t.noChairs.indexOf(i);
      if (at === -1) t.noChairs.push(i); else t.noChairs.splice(at, 1);
      await save();
      renderSeating();
      seatFlash(`${tableSeatCount(t)} seat${tableSeatCount(t) === 1 ? "" : "s"} at this table`);
    });
  });
  board.querySelectorAll("[data-table-label]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const t = seating.tables.find(x => x.id === e.currentTarget.dataset.tableLabel);
      if (!t) return;
      openInputModal("Table name", t.label || "", async (raw) => {
        seatPushUndo();
        const v = raw.trim();
        if (v) t.label = v; else delete t.label;
        await save();
        renderSeating();
      });
    });
  });
  board.querySelectorAll("[data-table-del]").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const id = e.currentTarget.dataset.tableDel;
      seatPushUndo();
      seating.tables = seating.tables.filter(x => x.id !== id);
      seatSel.delete(selId("t", id));
      await save();
      renderSeating();
    });
  });
  document.getElementById("seat-add-table").addEventListener("click", async () => {
    const type = tableTypeById(document.getElementById("seat-table-type").value);
    seating.tables = seating.tables || [];
    seatPushUndo();
    const t = {id: uid(), type: type.id, x: 50, y: 50, rot: 0};
    seating.tables.push(t);
    seatSel = new Set([selId("t", t.id)]);
    await save();
    renderSeating();
  });

  document.getElementById("seat-reset").addEventListener("click", async () => {
    const nTables = (seating.tables || []).length;
    if (!confirm(`Move every name back to the top of the board${nTables ? ` and remove ${nTables} table${nTables === 1 ? "" : "s"}` : ""}? The seating layout will be cleared.`)) return;
    seatPushUndo();
    seating.positions = {};
    seating.tables = [];
    seatSel.clear();
    await save();
    renderSeating();
  });
}

// Copy/paste and delete for tables. Bound once at the document rather than on
// each render, which would stack a new listener every time the board redraws.
// Kept in memory rather than the system clipboard: a table is a shape in this
// plan, not something another app could paste.
let seatClipboard = [];
// Undo history for the board. Session-only and capped: it holds whole copies
// of a small object (positions + tables), which is far simpler to get right
// than replaying inverse operations, and the board is the one place here
// where a stray keystroke or drag can undo minutes of arranging.
let seatUndo = [], seatRedo = [];
const SEAT_UNDO_MAX = 50;
function seatSnapshot() {
  return JSON.stringify({positions: seating.positions || {}, tables: seating.tables || []});
}
// Call with the state as it was BEFORE the change.
function seatPushUndo(before) {
  if (before === undefined) before = seatSnapshot();
  if (seatUndo.length && seatUndo[seatUndo.length - 1] === before) return;
  seatUndo.push(before);
  if (seatUndo.length > SEAT_UNDO_MAX) seatUndo.shift();
  seatRedo.length = 0;   // a fresh edit invalidates the redo branch
}
async function seatApplyState(json) {
  const st = JSON.parse(json);
  seating.positions = st.positions || {};
  seating.tables = st.tables || [];
  seatSel.clear();
  await saveKey("wedding-seating", seating);
  renderSeating();
}
async function seatUndoStep() {
  if (!seatUndo.length) return false;
  seatRedo.push(seatSnapshot());
  await seatApplyState(seatUndo.pop());
  return true;
}
async function seatRedoStep() {
  if (!seatRedo.length) return false;
  seatUndo.push(seatSnapshot());
  await seatApplyState(seatRedo.pop());
  return true;
}
function seatShortcutsAllowed() {
  if (guestSubTab !== "seating") return false;
  if (!document.getElementById("seat-board")) return false;
  const panel = document.getElementById("panel-guests");
  if (!panel || !panel.classList.contains("active")) return false;
  if (document.querySelector(".modal-overlay.open")) return false;
  // Never steal a keystroke meant for a field.
  const ae = document.activeElement;
  if (ae && (/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) || ae.isContentEditable)) return false;
  return true;
}
document.addEventListener("keydown", async (e) => {
  if (!seatShortcutsAllowed()) return;
  const mod = e.metaKey || e.ctrlKey;
  const selectedTables = () => [...seatSel].filter(s => s.startsWith("t:")).map(s => s.slice(2));

  if (e.key === "Escape") {
    if (!seatSel.size) return;
    seatSel.clear();
    renderSeating();
    return;
  }
  if (mod && (e.key === "z" || e.key === "Z") && !e.shiftKey) {
    e.preventDefault();
    seatFlash((await seatUndoStep()) ? "Undone" : "Nothing to undo");
    return;
  }
  if (mod && ((e.key === "z" || e.key === "Z") && e.shiftKey || e.key === "y" || e.key === "Y")) {
    e.preventDefault();
    seatFlash((await seatRedoStep()) ? "Redone" : "Nothing to redo");
    return;
  }
  if (mod && (e.key === "c" || e.key === "C")) {
    const ids = selectedTables();
    if (!ids.length) return;
    e.preventDefault();
    // Deep copy: a table carries a noChairs array, and a spread would leave
    // the copy sharing it - editing one table's chairs would change the other.
    seatClipboard = seating.tables.filter(t => ids.indexOf(t.id) !== -1).map(t => JSON.parse(JSON.stringify(t)));
    seatFlash(`${seatClipboard.length} table${seatClipboard.length === 1 ? "" : "s"} copied`);
    return;
  }
  if (mod && (e.key === "v" || e.key === "V")) {
    if (!seatClipboard.length) return;
    e.preventDefault();
    seatPushUndo();
    // Offset the copies so they do not land exactly on the originals and look
    // like nothing happened.
    const made = seatClipboard.map(t => Object.assign(JSON.parse(JSON.stringify(t)), {
      id: uid(),
      x: Math.max(0, Math.min(100, t.x + 4)),
      y: Math.max(0, Math.min(100, t.y + 4))
    }));
    seating.tables = (seating.tables || []).concat(made);
    seatSel = new Set(made.map(t => "t:" + t.id));
    // Paste again and the next copies step further out rather than restacking.
    seatClipboard = made.map(t => JSON.parse(JSON.stringify(t)));
    await saveKey("wedding-seating", seating);
    renderSeating();
    seatFlash(`${made.length} table${made.length === 1 ? "" : "s"} pasted`);
    return;
  }
  if (e.key === "Delete" || e.key === "Backspace") {
    const ids = selectedTables();
    if (!ids.length) return;
    // Backspace navigates back in some setups.
    e.preventDefault();
    seatPushUndo();
    seating.tables = seating.tables.filter(t => ids.indexOf(t.id) === -1);
    ids.forEach(id => seatSel.delete("t:" + id));
    await saveKey("wedding-seating", seating);
    renderSeating();
    seatFlash(`${ids.length} table${ids.length === 1 ? "" : "s"} removed`);
  }
});
// Brief confirmation, so a keystroke that changed something off-screen is not silent.
function seatFlash(msg) {
  const el = document.getElementById("seat-selinfo");
  if (!el) return;
  el.textContent = msg;
  clearTimeout(seatFlash._t);
  seatFlash._t = setTimeout(() => {
    const n = seatSel.size;
    el.textContent = n > 1 ? `${n} selected - drag to move together` : "";
  }, 1600);
}

const AREA_SEED = [
  {id: "sec-checkin",  label: "Check-in",      areas: ["Check-in Table", "Activity booth"]},
  {id: "sec-gallery",  label: "Image Gallery", areas: []},
  {id: "sec-ceremony", label: "Ceremony",      areas: ["Dessert Table"]},
  {id: "sec-cocktail", label: "Cocktail",      areas: []},
  {id: "sec-reception",label: "Reception",     areas: []},
];

let activities = [];
let openAreaRef = null;

const TABLE_TYPE_OPTIONS = ["6 foot Table", "8 foot Table", "4 foot table", "curved table", "Round 30\" H", "Round 42\" H"];
function tableQtyOptionsHtml(current) {
  let html = '<option value="">—</option>';
  for (let i = 1; i <= 20; i++) {
    html += `<option value="${i}" ${String(current) === String(i) ? "selected" : ""}>${i}</option>`;
  }
  return html;
}

function findArea(sectionId, areaId) {
  const section = activities.find(s => s.id === sectionId);
  if (!section) return null;
  const area = (section.areas || []).find(a => a.id === areaId);
  return area ? {section, area} : null;
}
function areaTodoCounts(area) {
  const items = area.todos || [];
  return {done: items.filter(t => t.done).length, total: items.length};
}
function assigneeOptionsHtml(current) {
  return ["<option value=\"\">Unassigned</option>"]
    .concat(helperTags.map(t => `<option value="${esc(t.name)}" ${t.name === current ? "selected" : ""}>${esc(t.name)}</option>`))
    .concat(["<option value=\"__add_new__\">+ Add new…</option>", "<option value=\"__manage__\">✎ Manage tags…</option>"])
    .join("");
}
// Shared by the area rows and the to-do rows inside the detail modal.
// Returns true when the change was an add/manage action the caller should not treat as a value.
function handleAssigneeAction(selectEl, previousValue, onPicked) {
  if (selectEl.value === "__add_new__") {
    selectEl.value = previousValue || "";
    openInputModal("Helper name", "", (name) => {
      const trimmed = name.trim();
      if (!trimmed) return;
      helperTags.push({id: uid(), name: trimmed});
      saveKey("wedding-helper-tags", helperTags);
      if (onPicked) onPicked(trimmed);
    });
    return true;
  }
  if (selectEl.value === "__manage__") {
    selectEl.value = previousValue || "";
    openTagsModal("helpers");
    return true;
  }
  return false;
}

function renderActivities() {
  const p = document.getElementById("panel-activities");
  let totalAreas = 0, totalDone = 0, totalTodos = 0;
  activities.forEach(s => (s.areas || []).forEach(a => {
    totalAreas++;
    const c = areaTodoCounts(a);
    totalDone += c.done; totalTodos += c.total;
  }));

  let html = `<div class="row" style="justify-content:flex-end; margin-bottom:12px;">
    <button id="table-summary-btn">Table Summary</button>
  </div>
  <div class="stat-row">
    <div class="stat"><div class="num">${totalAreas}</div><div class="lbl">Areas</div></div>
    <div class="stat"><div class="num">${totalDone} / ${totalTodos}</div><div class="lbl">Area to-dos done</div></div>
    <div class="stat" style="flex:2; display:flex; flex-direction:column; justify-content:center;">
      <div class="progress-bar"><div class="progress-fill" style="width:${totalTodos ? Math.round(totalDone/totalTodos*100) : 0}%"></div></div>
    </div>
  </div>`;

  activities.forEach(section => {
    const areas = section.areas || [];
    const secDone = areas.reduce((n,a) => n + areaTodoCounts(a).done, 0);
    const secTotal = areas.reduce((n,a) => n + areaTodoCounts(a).total, 0);
    html += `<div class="card">
      <div class="row" style="justify-content:space-between; margin-bottom:8px;">
        <p class="section-title" style="margin:0;">${esc(section.label)} <span class="muted" style="font-weight:500;">(${areas.length})</span></p>
        <span class="muted">${secTotal ? secDone + "/" + secTotal + " to-dos" : ""}</span>
      </div>
      <div class="table-wrap">
        <table class="data-table" style="min-width:480px;">
          <thead><tr>
            <th>Area</th><th style="width:170px;">Assignee</th><th style="width:90px;">To-dos</th><th style="width:44px;"></th>
          </tr></thead>
          <tbody>`;
    if (areas.length === 0) {
      html += `<tr><td colspan="4" class="muted" style="padding:12px;">No areas yet. Add one below.</td></tr>`;
    } else {
      areas.forEach(area => {
        const c = areaTodoCounts(area);
        html += `<tr>
          <td><span class="area-name-link" data-open-section="${section.id}" data-open-area="${area.id}" title="Open details">${esc(area.name)}</span></td>
          <td><select data-assign-section="${section.id}" data-assign-area="${area.id}" style="width:100%;">${assigneeOptionsHtml(area.assignee)}</select></td>
          <td>${c.total ? `<span class="${c.done === c.total ? "" : "muted"}">${c.done}/${c.total}</span>` : '<span class="muted">—</span>'}</td>
          <td><button class="icon-btn" data-remove-section="${section.id}" data-remove-area="${area.id}" aria-label="Remove area" title="Remove">${TRASH_ICON}</button></td>
        </tr>`;
      });
    }
    html += `</tbody></table></div>
      <div class="add-form" style="margin:10px 0 0;">
        <input type="text" data-add-section="${section.id}" placeholder="Add an area" autocomplete="off"
          data-lpignore="true" data-1p-ignore style="flex:1; min-width:150px;" />
        <button data-add-btn="${section.id}">Add area</button>
      </div>
    </div>`;
  });
  p.innerHTML = html;

  p.querySelectorAll("[data-open-area]").forEach(el => {
    el.addEventListener("click", () => openAreaModal(el.dataset.openSection, el.dataset.openArea));
  });
  p.querySelectorAll("[data-assign-area]").forEach(sel => {
    sel.addEventListener("change", async (e) => {
      const found = findArea(e.currentTarget.dataset.assignSection, e.currentTarget.dataset.assignArea);
      if (!found) return;
      if (handleAssigneeAction(e.currentTarget, found.area.assignee, async (name) => {
        found.area.assignee = name;
        await saveKey("wedding-activity-areas", activities);
        renderActivities();
      })) return;
      found.area.assignee = e.currentTarget.value;
      await saveKey("wedding-activity-areas", activities);
      renderActivities();
    });
  });
  p.querySelectorAll("[data-remove-area]").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      const section = activities.find(s => s.id === e.currentTarget.dataset.removeSection);
      if (!section) return;
      section.areas = (section.areas || []).filter(a => a.id !== e.currentTarget.dataset.removeArea);
      await saveKey("wedding-activity-areas", activities);
      renderActivities();
    });
  });
  p.querySelectorAll("[data-add-btn]").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      const sectionId = e.currentTarget.dataset.addBtn;
      const input = p.querySelector(`[data-add-section="${sectionId}"]`);
      const name = input.value.trim();
      if (!name) return;
      const section = activities.find(s => s.id === sectionId);
      section.areas = section.areas || [];
      section.areas.push({id: uid(), name, assignee: "", notes: "", todos: []});
      await saveKey("wedding-activity-areas", activities);
      renderActivities();
    });
  });
  p.querySelectorAll("[data-add-section]").forEach(inp => {
    inp.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); p.querySelector(`[data-add-btn="${e.currentTarget.dataset.addSection}"]`).click(); }
    });
  });
  p.querySelector("#table-summary-btn").addEventListener("click", openTableSummaryModal);
}

function openAreaModal(sectionId, areaId) {
  const found = findArea(sectionId, areaId);
  if (!found) return;
  openAreaRef = {sectionId, areaId};
  const {section, area} = found;
  document.getElementById("area-modal-name").value = area.name || "";
  document.getElementById("area-modal-section").textContent = section.label;
  document.getElementById("area-modal-notes").value = area.notes || "";
  const assignee = document.getElementById("area-modal-assignee");
  assignee.innerHTML = assigneeOptionsHtml(area.assignee);
  assignee.value = area.assignee || "";
  document.getElementById("area-modal-table-type").value = area.tableType || "";
  const tableQty = document.getElementById("area-modal-table-qty");
  tableQty.innerHTML = tableQtyOptionsHtml(area.tableQty);
  tableQty.value = area.tableQty ? String(area.tableQty) : "";
  renderAreaCoverImage();
  renderAreaMaterials();
  renderAreaTodos();
  document.getElementById("area-modal").classList.add("open");
}
function closeAreaModal() {
  document.getElementById("area-modal").classList.remove("open");
  openAreaRef = null;
  renderActivities();
}
function currentArea() {
  return openAreaRef ? findArea(openAreaRef.sectionId, openAreaRef.areaId) : null;
}
function openTableSummaryModal() {
  const counts = {};
  activities.forEach(section => (section.areas || []).forEach(area => {
    if (!area.tableType || !area.tableQty) return;
    counts[area.tableType] = (counts[area.tableType] || 0) + Number(area.tableQty);
  }));
  const types = TABLE_TYPE_OPTIONS.filter(t => counts[t]);
  const body = document.getElementById("table-summary-body");
  if (types.length === 0) {
    body.innerHTML = '<tr><td colspan="2" class="muted" style="padding:12px;">No tables assigned yet. Set a table type and quantity on an area to see it here.</td></tr>';
  } else {

// --- Cover image ---
// Each cover lives in its own row, excluded from the initial load and fetched
// only when its area is opened. Held inline in wedding-activity-areas they
// were 328KB of a 362KB startup payload against 34KB of planning data, and
// every added photo pushed the first paint closer to the timeout that has
// already shown an empty planner twice.
const AREA_IMAGE_PREFIX = "area-image::";
function areaImageKey(areaId) { return AREA_IMAGE_PREFIX + areaId; }
const areaImageCache = {};

async function loadAreaImage(areaId) {
  if (Object.prototype.hasOwnProperty.call(areaImageCache, areaId)) return areaImageCache[areaId];
  try {
    const r = await sbFetch(SUPABASE_URL + "/rest/v1/wedding_store?select=value&key=eq." +
      encodeURIComponent(areaImageKey(areaId)), { headers: SB_HEADERS });
    if (!r.ok) return null;
    const rows = await r.json();
    const val = rows[0] && rows[0].value;
    areaImageCache[areaId] = val && val.dataUrl ? val.dataUrl : null;
    return areaImageCache[areaId];
  } catch (e) { return null; }
}
async function saveAreaImage(areaId, dataUrl) {
  areaImageCache[areaId] = dataUrl;
  await saveKey(areaImageKey(areaId), dataUrl ? {dataUrl} : null);
}

// Renders whatever is known now, then fills the picture in when it arrives -
// the modal must not sit blank waiting on a network round trip.
async function renderAreaCoverImage() {
  const found = currentArea();
  if (!found) return;
  const areaId = found.area.id;
  const img = document.getElementById("area-modal-cover-img");
  const placeholder = document.getElementById("area-modal-cover-placeholder");
  const removeBtn = document.getElementById("area-modal-cover-remove");
  const show = (src) => {
    // The modal may have moved on to another area while the fetch was in
    // flight; showing this picture then would put it on the wrong area.
    if (!openAreaRef || openAreaRef.areaId !== areaId) return;
    if (src) {
      img.src = src;
      img.style.display = "";
      placeholder.style.display = "none";
      removeBtn.style.display = "";
    } else {
      img.style.display = "none";
      img.removeAttribute("src");
      placeholder.style.display = "";
      removeBtn.style.display = "none";
    }
  };
  const cached = Object.prototype.hasOwnProperty.call(areaImageCache, areaId) ? areaImageCache[areaId] : undefined;
  show(cached === undefined ? (found.area.hasCover ? img.src || null : null) : cached);
  if (cached === undefined) show(await loadAreaImage(areaId));
}

// One-time move of the covers already sitting inside wedding-activity-areas.
// Guarded like every other sweep: on a failed load this would strip images
// from a list it only thinks is empty.
async function migrateAreaImagesOut() {
  if (!storeLoadedOk || !Array.isArray(activities) || activities.length === 0) return 0;
  let moved = 0;
  for (const s of activities) {
    for (const a of (s.areas || [])) {
      if (!a.coverImage) continue;
      await saveKey(areaImageKey(a.id), {dataUrl: a.coverImage});
      areaImageCache[a.id] = a.coverImage;
      delete a.coverImage;
      a.hasCover = true;
      moved++;
    }
  }
  if (moved) await saveKey("wedding-activity-areas", activities);
  return moved;
}
// Every image is stored inline in the row it belongs to and downloaded on
// every page load, so its size is a reliability question, not a cosmetic one.
// The cover banner renders about 773x220, and object-fit crops most of the
// height away, so anything much beyond this is downloaded and never seen.
const IMAGE_MAX_PX = 720;
const IMAGE_QUALITY = 0.65;
function readAndResizeImage(file, maxDim, quality) {
  maxDim = maxDim || IMAGE_MAX_PX;
  quality = quality || IMAGE_QUALITY;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.naturalWidth, h = img.naturalHeight;
        if (w > maxDim || h > maxDim) {
          if (w >= h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        // A white base: JPEG has no alpha, and a transparent PNG would
        // otherwise flatten onto black.
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve({dataUrl: canvas.toDataURL("image/jpeg", quality), width: w, height: h});
      };
      img.onerror = () => reject(new Error("Couldn't read that image."));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error("Couldn't read that file."));
    reader.readAsDataURL(file);
  });
}

// --- Export to Word ---
function dataUrlToUint8Array(dataUrl) {
  const base64 = dataUrl.split(",")[1] || "";
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}
function buildGuidelineLines(section, area) {
  const materials = area.materials || [];
  const lines = [];
  lines.push(`Set up "${area.name}" within the ${section.label} portion of the day. ${area.assignee ? `${area.assignee} owns this area end to end.` : "Assign an owner for this area before the day of."}`);
  if (area.tableType) {
    lines.push(`Table: ${area.tableQty ? area.tableQty + "x " : ""}${area.tableType}.`);
  }
  if (materials.length) {
    const list = materials.map(m => [m.item, materialQuality(m)].filter(Boolean).join(" — ")).join("; ");
    lines.push(`Gather all checklist materials ahead of time: ${list}.`);
  } else {
    lines.push("Add materials to the checklist above so nothing gets missed on setup.");
  }
  if (area.notes && area.notes.trim()) {
    lines.push(`Design the experience around this: ${area.notes.trim()}`);
  }
  const openTodos = (area.todos || []).filter(t => !t.done);
  if (openTodos.length) {
    lines.push(`Close out these tasks before the event: ${openTodos.map(t => t.text).join("; ")}.`);
  }
  lines.push("Walk the space once fully set up, checklist in hand, before guests arrive.");
  return lines;
}
async function exportAreaDocx(section, area) {
  const {Document, Packer, Paragraph, HeadingLevel, ImageRun, Table, TableRow, TableCell, TextRun, WidthType, AlignmentType} = docx;
  const children = [];
  children.push(new Paragraph({text: area.name, heading: HeadingLevel.TITLE}));
  const subtitleParts = [section.label];
  if (area.assignee) subtitleParts.push(`Assignee: ${area.assignee}`);
  children.push(new Paragraph({text: subtitleParts.join(" · "), spacing: {after: 200}}));

  const coverForDoc = await loadAreaImage(area.id);
  if (coverForDoc) {
    const bytes = dataUrlToUint8Array(coverForDoc);
    const w = area.coverImageW || 600, h = area.coverImageH || 400;
    const docWidth = 420;
    const docHeight = Math.round(docWidth * (h / w));
    children.push(new Paragraph({
      children: [new ImageRun({type: "jpg", data: bytes, transformation: {width: docWidth, height: docHeight}})],
      alignment: AlignmentType.CENTER,
      spacing: {after: 240}
    }));
  }

  children.push(new Paragraph({text: "User Experience", heading: HeadingLevel.HEADING_1}));
  children.push(new Paragraph({text: (area.notes && area.notes.trim()) || "No notes added yet.", spacing: {after: 200}}));

  children.push(new Paragraph({text: "Material Checklist", heading: HeadingLevel.HEADING_1}));
  const materials = area.materials || [];
  if (materials.length) {
    const headerRow = new TableRow({
      tableHeader: true,
      children: ["Item Name", "Quality", "Status"].map(h => new TableCell({
        width: {size: 33, type: WidthType.PERCENTAGE},
        children: [new Paragraph({children: [new TextRun({text: h, bold: true})]})]
      }))
    });
    const rows = materials.map(m => new TableRow({
      children: [m.item || "", materialQuality(m), m.done ? "Ready" : "Needed"].map(v => new TableCell({
        children: [new Paragraph(v)]
      }))
    }));
    children.push(new Table({width: {size: 100, type: WidthType.PERCENTAGE}, rows: [headerRow, ...rows]}));
  } else {
    children.push(new Paragraph({text: "No materials added yet."}));
  }
  children.push(new Paragraph({text: "", spacing: {after: 200}}));

  children.push(new Paragraph({text: "Implementation Guideline", heading: HeadingLevel.HEADING_1}));
  buildGuidelineLines(section, area).forEach(line => {
    children.push(new Paragraph({text: line, bullet: {level: 0}, spacing: {after: 120}}));
  });

  const doc = new Document({sections: [{children}]});
  const blob = await Packer.toBlob(doc);
  const safeName = `${section.label} - ${area.name}`.replace(/[\\/:*?"<>|]/g, "-");
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${safeName}.docx`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

let timeline = [];
function buildTimeOptions() {
  const opts = [];
  for (let h = 0; h < 24; h++) {
    for (let m = 0; m < 60; m += 5) {
      const h12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
      const ap = h < 12 ? "am" : "pm";
      opts.push(`${h12}:${String(m).padStart(2,"0")} ${ap}`);
    }
  }
  return opts;
}
const TIME_OPTIONS = buildTimeOptions();
function timeToMinutes(t) {
  const m = (t || "").match(/(\d+):(\d+)\s*(am|pm)/i);
  if (!m) return 0;
  let [, h, min, ap] = m;
  h = parseInt(h); min = parseInt(min);
  if (ap.toLowerCase() === "am") { if (h === 12) h = 0; }
  else { if (h !== 12) h += 12; }
  return h * 60 + min;
}
function timeSelectOptions(sel) {
  return TIME_OPTIONS.map(t => `<option value="${t}" ${t===sel?"selected":""}>${t}</option>`).join("");
}

function bindTlZoneDrop(p) {
  p.querySelectorAll(".tl-zone").forEach(zone => {
    zone.addEventListener("dragover", (e) => { if (tlDragId) e.preventDefault(); });
    zone.addEventListener("drop", (e) => {
      if (!tlDragId) return;
      if (e.target.closest(".tl-card")) return;
      e.preventDefault();
      const t = timeline.find(x => x.id === tlDragId);
      if (!t) return;
      t.section = zone.dataset.sectionName || "";
      const order = [...timeline].sort((a,b) => (a.order||0) - (b.order||0));
      const idx = order.findIndex(x => x.id === tlDragId);
      if (idx !== -1) {
        const [moved] = order.splice(idx, 1);
        order.push(moved);
        order.forEach((item, i) => { item.order = i; });
      }
      tlJumpId = tlDragId;
      renderTimeline();
      saveKey("wedding-timeline", timeline);
    });
  });
}

function bindTlDrag(p) {
  p.querySelectorAll(".tl-card").forEach(card => {
    card.addEventListener("dragstart", (e) => {
      if (["INPUT","SELECT","TEXTAREA","BUTTON"].includes(e.target.tagName)) {
        e.preventDefault();
        return;
      }
      tlDragId = card.dataset.tlId;
      card.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", "");
    });
    card.addEventListener("dragend", () => {
      card.classList.remove("dragging");
      p.querySelectorAll(".tl-card").forEach(c => c.classList.remove("drag-over-top","drag-over-bottom"));
      tlDragId = null;
    });
    card.addEventListener("dragover", (e) => {
      if (!tlDragId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      const rect = card.getBoundingClientRect();
      const mid = rect.top + rect.height / 2;
      card.classList.remove("drag-over-top","drag-over-bottom");
      card.classList.add(e.clientY < mid ? "drag-over-top" : "drag-over-bottom");
    });
    card.addEventListener("dragleave", () => {
      card.classList.remove("drag-over-top","drag-over-bottom");
    });
    card.addEventListener("drop", (e) => {
      if (!tlDragId) return;
      e.preventDefault();
      e.stopPropagation();
      card.classList.remove("drag-over-top","drag-over-bottom");
      if (tlDragId === card.dataset.tlId) return;
      const rect = card.getBoundingClientRect();
      const after = e.clientY >= rect.top + rect.height / 2;
      performTlMove(tlDragId, card.dataset.tlId, after);
    });
  });
}

function performTlMove(draggedId, targetId, after) {
  const order = [...timeline].sort((a,b) => (a.order||0) - (b.order||0));
  const fromIdx = order.findIndex(t => t.id === draggedId);
  if (fromIdx === -1) return;
  const [moved] = order.splice(fromIdx, 1);
  let targetIdx = order.findIndex(t => t.id === targetId);
  if (targetIdx === -1) targetIdx = order.length;
  let insertAt = after ? targetIdx + 1 : targetIdx;
  insertAt = Math.max(0, Math.min(insertAt, order.length));
  const targetItem = order[after ? insertAt - 1 : insertAt] || order[order.length - 1];
  if (targetItem) moved.section = targetItem.section || "";
  order.splice(insertAt, 0, moved);
  order.forEach((item, i) => { item.order = i; });
  tlJumpId = moved.id;
  renderTimeline();
  saveKey("wedding-timeline", timeline);
}

             <td colspan="2"></td>`
          : `<td style="text-align:right; font-weight:600;">Vendors total</td>
             <td style="text-align:right; font-weight:700; color:var(--primary);">${fmtMoney(vendorTotal)}</td>
             <td></td>`}

    <span class="section-title" style="margin:0;">Other expenses</span>
  </div>
  <div class="table-wrap">
    <table class="data-table" style="min-width:520px;">
      <thead><tr>
        <th>Category</th><th>Item name</th><th style="text-align:right; width:130px;">Cost</th><th style="width:44px;"></th>
      </tr></thead>
      <tbody id="x-body"></tbody>
      <tfoot><tr>
        <td colspan="2" style="text-align:right; font-weight:600;">Other expenses total</td>
        <td style="text-align:right; font-weight:700; color:var(--primary);">${fmtMoney(expenseTotal)}</td>

  <div class="card" style="margin-top:14px;">
    <div class="row" style="justify-content:space-between;">
      <span class="section-title" style="margin:0;">Grand total</span>
